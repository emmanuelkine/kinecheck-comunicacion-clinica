name: Academy competency pilot QA
on:
  pull_request:
    paths: ['academy/competencias/**','functions/api/academy-workflow.js','functions/_shared/academy-monthly-report.mjs','supabase/migrations/*academy_competency_workflow.sql','supabase/rollback/academy_competency_workflow.sql','tests/academy-*','scripts/export-academy-monthly.mjs','.github/workflows/academy-competency-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-api-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: node scripts/validate-academy-integrity.mjs && node scripts/validate-academy-ui-contracts.mjs
      - run: npx playwright install --with-deps webkit
      - run: node tests/academy-workflow-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academy-competency-pilot-evidence
          path: docs/academic/audit-2026-10-28/test-evidence/
          retention-days: 30
