name: Academy integrity

on:
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - 'banderas-clinicas/**'
      - 'productos/banderas-clinicas/**'
      - 'kinecheck-clinico-curso/**'
      - 'kinecheck-clinico-guia/**'
      - 'traumatologia/**'
      - 'comunicacion-clinica.html'
      - 'scripts/validate-academy-integrity.mjs'
      - '.github/workflows/academy-integrity.yml'
  pull_request:
    paths:
      - 'academy/**'
      - 'banderas-clinicas/**'
      - 'productos/banderas-clinicas/**'
      - 'kinecheck-clinico-curso/**'
      - 'kinecheck-clinico-guia/**'
      - 'traumatologia/**'
      - 'comunicacion-clinica.html'
      - 'scripts/validate-academy-integrity.mjs'
      - '.github/workflows/academy-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate Academy catalog and access routes
        run: node scripts/validate-academy-integrity.mjs
