name: Academy UI regression guard

on:
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - '_headers'
      - 'scripts/validate-academy-ui-contracts.mjs'
      - '.github/workflows/academy-ui-regression-guard.yml'
  pull_request:
    paths:
      - 'academy/**'
      - '_headers'
      - 'scripts/validate-academy-ui-contracts.mjs'
      - '.github/workflows/academy-ui-regression-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  academy-ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check critical Academy JavaScript syntax
        run: |
          node --check academy/academy-kinecheck-v4.js
          node --check academy/academy-view-contract-fix-v1.js
          node --check academy/academy-owned-native-bridge-v1.js
          node --check academy/academy-home-native-courses-v1.js
          node --check academy/academy-open-v6.js
          node --check academy/academy-brand-identity.js
      - name: Validate Academy UI contracts
        run: node scripts/validate-academy-ui-contracts.mjs
