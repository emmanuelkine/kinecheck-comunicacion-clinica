name: Add verified evidence 2026-08-09

on:
  push:
    paths:
      - '.github/workflows/add-evidence-20260809.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified evidence items
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('academy/evidence-alerts.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          new=[
            {
              "id":"reason-cp-clinical-reasoning-2026","alertDate":"2026-08-09","source":"PubMed","status":"Verificada",
              "title":"REASON CP: razonamiento clínico basado en sistemas, CIF y participación",
              "authors":"Mayston M, Foley S, Reynolds K, Walsh W, Saloojee G.",
              "citation":"REASON CP: a systems-based framework for clinical reasoning to support participation across the lifespan in childhood-onset neurodisability. Front Public Health. 2026;14:1800273.",
              "publicationDate":"2026-04-21","studyType":"Mini-revisión y propuesta de marco de razonamiento clínico",
              "population":"Personas con neurodiscapacidad de inicio infantil, con énfasis en parálisis cerebral, sus familias y equipos terapéuticos.",
              "mainFinding":"REASON CP (Reflect, Evaluate, Activate, Support, Optimize, Navigate via Clinical reasoning for Participation) explicita un proceso colaborativo y basado en sistemas para vincular metas, análisis de tareas, CIF, evidencia disponible y selección de intervenciones en el momento adecuado.",
              "quality":"Es un marco conceptual y clínico, no un ensayo de efectividad ni una guía normativa. Su utilidad reside en estructurar y transparentar el razonamiento; requiere evaluación empírica adicional de resultados.",
              "clinicalImplication":"Puede utilizarse para hacer explícito por qué una intervención es pertinente para una persona, objetivo y momento determinados, integrando participación, contexto, trayectoria y toma de decisiones compartida.",
              "teachingImplication":"Útil para enseñar que el razonamiento clínico no consiste en escoger técnicas: el estudiante debe conectar hallazgos, CIF, objetivos, evidencia, contexto y reevaluación en una cadena de decisiones justificable.",
              "topics":["Razonamiento clínico","CIF","Sistemas","Participación","Toma de decisiones compartida"],
              "pmid":"42094902","doi":"10.3389/fpubh.2026.1800273","url":"https://pubmed.ncbi.nlm.nih.gov/42094902/"
            },
            {
              "id":"diagnostic-reasoning-msk-2026","alertDate":"2026-08-09","source":"Revisión científica","status":"Verificada",
              "title":"Razonamiento diagnóstico en atención musculoesquelética contemporánea",
              "authors":"De Sloovere M, Van Tiggelen D, De Ridder R, Dewitte V, Cagnie B.",
              "citation":"Diagnostic reasoning in musculoskeletal healthcare: a scoping review. J Bodyw Mov Ther. 2026;47:295-303.",
              "publicationDate":"2026-04-01","studyType":"Scoping review",
              "population":"65 estudios de distintas profesiones sanitarias sobre razonamiento diagnóstico en trastornos musculoesqueléticos.",
              "mainFinding":"Identificó dimensiones recurrentes de razonamiento: factores ambientales y personales, estratificación de riesgo, estructuras/mecanismos tisulares y mecanismos de dolor. Se identificaron 23 herramientas, pero ninguna dimensión aislada representa adecuadamente la complejidad diagnóstica.",
              "quality":"Revisión de alcance: describe el campo y sus herramientas, pero no establece superioridad diagnóstica ni efectividad clínica. Los autores señalan la necesidad de herramientas válidas y fiables que integren simultáneamente múltiples dimensiones.",
              "clinicalImplication":"Evitar reducir la evaluación musculoesquelética a una prueba física o etiqueta estructural. La hipótesis clínica debe integrar riesgo, contexto, factores personales, mecanismos y hallazgos físicos, actualizando probabilidades a medida que aparece nueva información.",
              "teachingImplication":"Evaluar al estudiante por la calidad de la integración y actualización de hipótesis, no por la cantidad de pruebas especiales memorizadas.",
              "topics":["Razonamiento diagnóstico","Musculoesquelético","Biopsicosocial","Estratificación de riesgo","Hipótesis clínica"],
              "doi":"10.1016/j.jbmt.2026.04.003","url":"https://doi.org/10.1016/j.jbmt.2026.04.003"
            },
            {
              "id":"clinical-reasoning-pedagogy-2026","alertDate":"2026-08-09","source":"PubMed","status":"Verificada",
              "title":"Estrategias pedagógicas para desarrollar razonamiento clínico en fisioterapia",
              "authors":"Ndacayisaba G, Vanderweyen J, Mapinduzi J, et al.",
              "citation":"Effectiveness of various pedagogical tools to enhance clinical reasoning in physiotherapy: a systematic review. Physiother Theory Pract. 2026:1-15.",
              "publicationDate":"2026-04-27","studyType":"Revisión sistemática",
              "population":"34 estudios y 3.048 participantes, desde estudiantes de fisioterapia hasta clínicos titulados.",
              "mainFinding":"La simulación, las tecnologías digitales, el aprendizaje activo y basado en casos y los programas estructurados mostraron mejoras en razonamiento o toma de decisiones. La simulación y los enfoques activos presentaron resultados especialmente consistentes.",
              "quality":"Los estudios incluidos fueron de calidad metodológica moderada a alta, pero existió heterogeneidad de intervenciones y desenlaces. Se requieren más ensayos aleatorizados y resultados de largo plazo vinculados a pacientes.",
              "clinicalImplication":"Para formación clínica y educación continua, priorizar práctica deliberada con casos, simulación, reflexión y retroalimentación por sobre exposición exclusivamente teórica.",
              "teachingImplication":"Diseñar evaluaciones donde el estudiante deba verbalizar hipótesis, justificar decisiones, responder a información nueva y reflexionar sobre errores; no limitar la evaluación a recuerdo factual.",
              "topics":["Razonamiento clínico","Educación","Simulación","Aprendizaje basado en casos","Tecnología educativa"],
              "pmid":"42046463","doi":"10.1080/09593985.2026.2664643","url":"https://pubmed.ncbi.nlm.nih.gov/42046463/"
            },
            {
              "id":"pne-physical-therapy-2025","alertDate":"2026-08-09","source":"PubMed","status":"Verificada",
              "title":"Educación en neurociencia del dolor combinada con fisioterapia",
              "authors":"Sánchez-Robalino A, Sinchi-Sinchi H, Ramírez A.",
              "citation":"Effectiveness of Pain Neuroscience Education in Physical Therapy: A Systematic Review and Meta-Analysis. Brain Sci. 2025;15(6):658.",
              "publicationDate":"2025-06-18","studyType":"Revisión sistemática y metaanálisis",
              "population":"19 estudios de personas con dolor crónico tratadas con PNE combinada con modalidades de rehabilitación.",
              "mainFinding":"La PNE combinada con fisioterapia se asoció con reducción de intensidad de dolor y mejoría funcional. Los resultados apoyan utilizar educación dentro de una intervención multimodal, no como sustituto automático de la rehabilitación activa.",
              "quality":"La síntesis agrupa poblaciones e intervenciones heterogéneas; la magnitud y transferibilidad del efecto dependen del contexto, comparador, dosis educativa y tratamiento concomitante.",
              "clinicalImplication":"Usar PNE para apoyar comprensión, autoeficacia y participación en actividad o ejercicio, evitando convertirla en una explicación estandarizada que invalide la experiencia de dolor.",
              "teachingImplication":"Enseñar PNE como una competencia de comunicación clínica integrada con exposición, actividad y ejercicio, evaluando lenguaje, individualización y vínculo con objetivos funcionales.",
              "topics":["Dolor persistente","PNE","Educación","Ejercicio terapéutico","Comunicación clínica"],
              "pmid":"40563828","doi":"10.3390/brainsci15060658","url":"https://pubmed.ncbi.nlm.nih.gov/40563828/"
            },
            {
              "id":"pne-plus-mechanisms-2025","alertDate":"2026-08-09","source":"PubMed","status":"Verificada",
              "title":"PNE+ en diferentes mecanismos de dolor crónico",
              "authors":"Tatikola SP, Natarajan V, Amaravadi SK, et al.",
              "citation":"Effect of pain neuroscience education+ (PNE+) in people with different mechanisms of chronic pain: A systematic review and meta-analysis. J Bodyw Mov Ther. 2025;41:215-237.",
              "publicationDate":"2025-03-01","studyType":"Revisión sistemática y metaanálisis",
              "population":"24 estudios en la revisión sistemática y 20 en el metaanálisis, con diferentes mecanismos de dolor crónico.",
              "mainFinding":"PNE+ redujo dolor e interferencia y mostró mejoras en variables psicosociales como kinesiofobia y catastrofización. La mayor parte de la evidencia se concentró en sensibilización central/nociplasticidad, con menor evidencia para dolor neuropático específico.",
              "quality":"La evidencia fue moderada a buena en estudios centrados predominantemente en sensibilización central y dolor neuropático, pero la heterogeneidad y la escasez de estudios por mecanismo limitan inferencias de tratamiento específico por fenotipo.",
              "clinicalImplication":"No utilizar la clasificación nociceptivo-neuropático-nociplástico como algoritmo rígido para prescribir PNE. Individualizar educación y tratamiento activo según presentación clínica, objetivos y respuesta.",
              "teachingImplication":"Enseñar mecanismos de dolor como hipótesis clínicas probabilísticas. El estudiante debe justificar qué mensaje educativo utiliza, para qué barrera concreta y cómo lo integra con una intervención activa.",
              "topics":["PNE+","Dolor nociplástico","Dolor neuropático","Kinesiofobia","Catastrofización"],
              "pmid":"39663091","doi":"10.1016/j.jbmt.2024.11.016","url":"https://pubmed.ncbi.nlm.nih.gov/39663091/"
            }
          ]
          ids={x.get('id') for x in d.get('items',[])}
          d['items']=[x for x in new if x['id'] not in ids]+d.get('items',[])
          d['version']='2026-08-09.1'
          d['lastReviewed']='2026-08-09'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit evidence update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy/evidence-alerts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(evidence): publish verified reasoning and PNE digest"
          git push
