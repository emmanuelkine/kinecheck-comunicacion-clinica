name: Auditar precios públicos Hotmart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-hotmart-public-prices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Auditar checkouts para Chile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const products = {
              'kinecheck-clinico': 'https://pay.hotmart.com/L106791841D',
              'kinecheck-estudiante': 'https://pay.hotmart.com/G106801166S',
              'kinecheck-recupera': 'https://pay.hotmart.com/P106806251E',
              'comunicacion-clinica': 'https://pay.hotmart.com/T106883983U',
              'mas-alla-del-dolor': 'https://pay.hotmart.com/W106888386Q',
              'evidencia-aplicada': 'https://pay.hotmart.com/F106921972I',
              'traumatologia-ortopedia-clinica': 'https://pay.hotmart.com/B106913952R',
              'pack-estudiante': 'https://pay.hotmart.com/Q106891608M'
            };
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'es-CL',
              timezoneId: 'America/Santiago',
              geolocation: { latitude: -33.4489, longitude: -70.6693 },
              permissions: ['geolocation'],
              viewport: { width: 1440, height: 1200 }
            });
            const output = {};
            for (const [slug, url] of Object.entries(products)) {
              const page = await context.newPage();
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(4500);
                const changeCountry = page.getByText(/change country|cambiar pa[ií]s/i).first();
                if (await changeCountry.isVisible().catch(() => false)) {
                  await changeCountry.click();
                  await page.waitForTimeout(700);
                  const chile = page.getByText(/^Chile$/i).last();
                  if (await chile.isVisible().catch(() => false)) {
                    await chile.click();
                    await page.waitForTimeout(4000);
                  }
                }
                const body = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
                output[slug] = {
                  finalUrl: page.url(),
                  title: await page.title(),
                  excerpt: body.slice(0, 1250)
                };
              } catch (error) {
                output[slug] = { error: String(error.message || error) };
              } finally {
                await page.close();
              }
            }
            await browser.close();
            console.log('HOTMART_CHILE_AUDIT_START');
            console.log(JSON.stringify(output, null, 2));
            console.log('HOTMART_CHILE_AUDIT_END');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
