name: KineCheck Binary Asset Audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and metadata tools
        run: sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y poppler-utils libimage-exiftool-perl tesseract-ocr tesseract-ocr-spa
      - name: Install image converter
        run: python3 -m pip install --user --break-system-packages pillow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect tracked PDF, vector and raster assets
        run: node scripts/audit-public-assets.mjs
      - name: Verify public routes and branding
        run: node scripts/audit-public-routes.mjs
