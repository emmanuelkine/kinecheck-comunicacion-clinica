name: Cloudflare credential availability check
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      TOKEN_PAGES: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Check for an existing Cloudflare API token
        shell: bash
        run: |
          if [[ -n "$TOKEN_PRIMARY" ]]; then
            echo "Cloudflare credential is available as CLOUDFLARE_API_TOKEN."
          elif [[ -n "$TOKEN_ALT" ]]; then
            echo "Cloudflare credential is available as CF_API_TOKEN."
          elif [[ -n "$TOKEN_PAGES" ]]; then
            echo "Cloudflare credential is available as CLOUDFLARE_PAGES_API_TOKEN."
          else
            echo "::error::No Cloudflare API token is configured in GitHub Actions."
            exit 1
          fi
