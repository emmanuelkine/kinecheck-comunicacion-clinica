name: Emergency Academy cache bust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-academy-cache-bust.yml

permissions:
  contents: write

jobs:
  patch-cache-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump Academy hotfix asset versions
        shell: python
        run: |
          from pathlib import Path

          bootstrap = Path('academy/academy-bootstrap-v28.js')
          text = bootstrap.read_text(encoding='utf-8')
          old = './academy-access-recovery-v1.js?v=20260803-accessfix1'
          new = './academy-access-recovery-v1.js?v=20260821-buttons-hotfix1'
          if old not in text and new not in text:
              raise SystemExit('Access recovery asset reference not found')
          bootstrap.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('academy/index.html')
          text = index.read_text(encoding='utf-8')
          old = './academy-bootstrap-v28.js?v=20260820-loginfast2'
          new = './academy-bootstrap-v28.js?v=20260821-buttons-hotfix1'
          if old not in text and new not in text:
              raise SystemExit('Academy bootstrap reference not found')
          index.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/emergency-academy-cache-bust.yml').unlink()
      - name: Commit cache-bust
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kinecheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add academy/academy-bootstrap-v28.js academy/index.html .github/workflows/emergency-academy-cache-bust.yml
          git commit -m "Bust Academy cache after button hotfix"
          git push origin HEAD:main
