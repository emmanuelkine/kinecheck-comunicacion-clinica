name: Habilitar métricas de lanzamiento

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-launch-metrics-csp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enable-launch-metrics-csp
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cargar métricas en Academy de forma idempotente
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("academy/index.html")
          text = path.read_text(encoding="utf-8")
          metrics = '<script src="../metrics-v1.js?v=20260813-launch2" defer></script>'
          marker = '<script src="./academy-brand-identity.js?v=20260813-launch1" defer></script>'

          if metrics not in text:
              if marker not in text:
                  raise SystemExit("No se encontró el punto seguro de inserción de métricas en Academy")
              text = text.replace(marker, f"{metrics}\n  {marker}", 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validar métricas y CSP de Academy
        run: |
          grep -q 'src="../metrics-v1.js?v=20260813-launch2"' academy/index.html
          grep -q "connect-src 'self' https://\*.supabase.co" academy/index.html

      - name: Publicar parche
        run: |
          if git diff --quiet; then
            echo "Academy ya carga las métricas de lanzamiento."
            exit 0
          fi
          git config user.name "KineCheck Automation"
          git config user.email "actions@users.noreply.github.com"
          git add academy/index.html
          git commit -m "fix: load launch metrics in Academy"
          git push
