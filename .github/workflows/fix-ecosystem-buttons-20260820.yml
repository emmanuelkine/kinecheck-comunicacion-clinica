name: Fix ecosystem buttons and construction states

on:
  push:
    branches:
      - fix/ecosystem-buttons-20260820
    paths:
      - .github/workflows/fix-ecosystem-buttons-20260820.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecosystem-buttons-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch catalog, CTAs, explorer and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'academy/academy-bootstrap-v28.js',
              '''      accessMonths: 12,\n      status: "active",\n      url: "https://emmanuelkine.github.io/kinecheck-evidencia-aplicada/dolor-musculoesqueletico/?course=dolor-musculoesqueletico&v=20260818-active1"''',
              '''      accessMonths: 12,\n      commercialStatus: "preparing",\n      developmentLabel: "PRÓXIMAMENTE",\n      status: "active",\n      url: "https://emmanuelkine.github.io/kinecheck-evidencia-aplicada/dolor-musculoesqueletico/?course=dolor-musculoesqueletico&v=20260818-active1"'''
          )
          replace_once(
              'academy/academy-bootstrap-v28.js',
              '''      lessons: 13,\n      status: "active",\n      url: "../banderas-clinicas/?course=banderas-clinicas&v=20260820-owner1"''',
              '''      lessons: 13,\n      commercialStatus: "preparing",\n      developmentLabel: "EN CONSTRUCCIÓN",\n      status: "active",\n      url: "../banderas-clinicas/?course=banderas-clinicas&v=20260820-owner1"'''
          )

          replace_once(
              'academy/academy-v39.js',
              '''function courseActionLabel(course, access) {\n  if (access === "checking") return "Validando acceso…";\n  if (access === "preparing") return "Próximamente";\n  if (access !== "owned") return "No disponible en tu cuenta";\n  if (course.kind === "course") {''',
              '''function courseActionLabel(course, access) {\n  if (access === "checking") return "Validando acceso…";\n  if (access === "preparing") return "Próximamente";\n  if (course.commercialStatus === "preparing" && access !== "owned") {\n    return course.developmentLabel || "Próximamente";\n  }\n  if (access !== "owned") return "No disponible en tu cuenta";\n  if (course.developmentLabel === "EN CONSTRUCCIÓN") return "Abrir versión de revisión";\n  if (course.kind === "course") {'''
          )
          replace_once(
              'academy/academy-v39.js',
              '''  const status = owned && state.started && course.kind === "course"\n    ? "En progreso"\n    : accessBadge(access);\n  const productLabel = course.productId === "PROPIETARIO"\n    ? "Versión en desarrollo"\n    : (owned ? "Acceso verificado" : "Licencia asociada a la compra");''',
              '''  const status = course.developmentLabel\n    ? course.developmentLabel\n    : (owned && state.started && course.kind === "course"\n      ? "En progreso"\n      : accessBadge(access));\n  const productLabel = course.commercialStatus === "preparing"\n    ? "Próximo lanzamiento · contenido en desarrollo"\n    : (course.productId === "PROPIETARIO"\n      ? "Versión en desarrollo"\n      : (owned ? "Acceso verificado" : "Licencia asociada a la compra"));'''
          )
          replace_once(
              'academy/academy-v39.js',
              '''        <span class="status-badge ${owned ? "" : "preparing"}">${status}</span>''',
              '''        <span class="status-badge ${course.developmentLabel || !owned ? "preparing" : ""}">${status}</span>'''
          )

          replace_once(
              'academy/academy-owned-native-bridge-v1.js',
              '''    "dolor-musculoesqueletico",\n    "mas-alla-del-dolor",''',
              '''    "dolor-musculoesqueletico",\n    "banderas-clinicas",\n    "mas-alla-del-dolor",'''
          )
          p = Path('academy/academy-owned-native-bridge-v1.js')
          text = p.read_text(encoding='utf-8')
          start = text.find('  function decorateConstructionCards() {')
          if start >= 0:
              end = text.find('\n  function organizeLibraryProducts()', start)
              if end < 0:
                  raise SystemExit('Could not remove construction decorator')
              text = text[:start] + text[end:]
          text = text.replace('\n    decorateConstructionCards();\n', '\n')
          p.write_text(text, encoding='utf-8')

          p = Path('academy/academy-home-native-courses-v1.js')
          text = p.read_text(encoding='utf-8')
          insert_before = '''    {\n      slug: "pack-estudiante",'''
          additions = '''    {\n      slug: "dolor-lumbar-persistente",\n      icon: "DL",\n      title: "Dolor Lumbar Persistente",\n      audience: "Profesionales y estudiantes",\n      type: "Curso",\n      summary: "Curso aplicado para integrar razonamiento clínico, PROMs, evidencia, casos y progresión en dolor lumbar persistente.",\n      points: ["Razonamiento clínico", "PROMs y seguimiento", "Casos y progresión"],\n      detailUrl: "../productos/dolor-lumbar-persistente/",\n    },\n    {\n      slug: "dolor-musculoesqueletico",\n      icon: "DM",\n      title: "Dolor Musculoesquelético",\n      audience: "Profesionales y estudiantes",\n      type: "Curso · Próximamente",\n      availability: "preparing",\n      summary: "Curso en preparación sobre ciencia del dolor, fenotipos, evaluación, PROMs y razonamiento clínico aplicado.",\n      points: ["Fenotipos de dolor", "Evaluación y PROMs", "Decisión clínica"],\n      detailUrl: "../productos/dolor-musculoesqueletico/",\n    },\n    {\n      slug: "banderas-clinicas",\n      icon: "BC",\n      title: "KineCheck Banderas Clínicas",\n      audience: "Profesionales y estudiantes",\n      type: "Curso · En construcción",\n      availability: "preparing",\n      summary: "Curso en construcción para integrar banderas rojas, amarillas, naranjas, azules y negras en el razonamiento clínico musculoesquelético.",\n      points: ["Screening y riesgo", "Factores psicosociales y laborales", "Derivación y safety netting"],\n      detailUrl: "../productos/banderas-clinicas/",\n    },\n'''
          if 'slug: "dolor-lumbar-persistente"' not in text.split('const explorerState')[0]:
              if insert_before not in text:
                  raise SystemExit('Explorer insertion point not found')
              text = text.replace(insert_before, additions + insert_before, 1)
          old_price = '''  function productPrice(product) {\n    const record = explorerState.prices?.[product.slug];\n    if (!record) return { display: "Ver precio", term: "en la ficha del producto" };\n    return { display: record.display || "Ver precio", term: record.term || "Acceso según producto" };\n  }'''
          new_price = '''  function productPrice(product) {\n    if (product.availability === "preparing") {\n      return { display: "Próximamente", term: "En preparación" };\n    }\n    const record = explorerState.prices?.[product.slug];\n    if (!record) return { display: "Ver precio", term: "en la ficha del producto" };\n    return { display: record.display || "Ver precio", term: record.term || "Acceso según producto" };\n  }'''
          if old_price not in text:
              raise SystemExit('productPrice block not found')
          text = text.replace(old_price, new_price, 1)
          p.write_text(text, encoding='utf-8')

          candidates = list(Path('.').rglob('*healthcheck*.mjs'))
          if not candidates:
              raise SystemExit('Healthcheck script not found')
          p = candidates[0]
          text = p.read_text(encoding='utf-8')
          old = '''      status: block.match(/status:\\s*"([^\"]+)"/)?.[1],\n      url: block.match(/url:\\s*"([^\"]+)"/)?.[1],'''
          new = '''      status: block.match(/status:\\s*"([^\"]+)"/)?.[1],\n      commercialStatus: block.match(/commercialStatus:\\s*"([^\"]+)"/)?.[1] || "sale",\n      url: block.match(/url:\\s*"([^\"]+)"/)?.[1],'''
          if old not in text:
              raise SystemExit(f'Healthcheck parser block not found in {p}')
          text = text.replace(old, new, 1)
          old2 = '''  const activeProducts = academyProducts.filter((product) => product.status === "active");\n  const activeProductGroups = groupProductsById(activeProducts);'''
          new2 = '''  const activeProducts = academyProducts.filter((product) => product.status === "active");\n  const commercialActiveProducts = activeProducts.filter((product) => product.commercialStatus === "sale");\n  const activeProductGroups = groupProductsById(commercialActiveProducts);\n  activeProducts\n    .filter((product) => product.commercialStatus !== "sale")\n    .forEach((product) => logOk(`Producto activo en modo ${product.commercialStatus}: ${product.title}`));'''
          if old2 not in text:
              raise SystemExit(f'Healthcheck active group block not found in {p}')
          text = text.replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')

          replace_once(
              'tests/recommended-buttons.spec.mjs',
              '''const products = [\n  "mas-alla-del-dolor",\n  "traumatologia-ortopedia-clinica",\n  "comunicacion-clinica",\n  "evidencia-aplicada",\n];''',
              '''const products = [\n  "kinecheck-clinico-curso",\n  "comunicacion-clinica",\n  "mas-alla-del-dolor",\n  "evidencia-aplicada",\n  "traumatologia-ortopedia-clinica",\n  "dolor-lumbar-persistente",\n  "dolor-musculoesqueletico",\n  "banderas-clinicas",\n];'''
          )
          p = Path('tests/owned-buttons.spec.mjs')
          text = p.read_text(encoding='utf-8')
          anchor = '''        <button type="button" data-course="evidencia-aplicada">Evidencia</button>'''
          extra = '''        <button type="button" data-course="evidencia-aplicada">Evidencia</button>\n        <button type="button" data-course="dolor-lumbar-persistente">Dolor lumbar</button>\n        <button type="button" data-course="dolor-musculoesqueletico">Dolor musculoesquelético</button>\n        <button type="button" data-course="banderas-clinicas">Banderas</button>'''
          if 'data-course="banderas-clinicas"' not in text:
              if anchor not in text:
                  raise SystemExit('Owned buttons harness anchor not found')
              text = text.replace(anchor, extra, 1)
          test_anchor = '''test("Continuar usa el opener unificado sin alterar los botones nativos del catálogo", async ({ page }) => {'''
          new_test = '''test("los cursos nuevos conservan el controlador nativo de la Biblioteca", async ({ page }) => {\n  await installHarness(page);\n\n  for (const slug of ["dolor-lumbar-persistente", "dolor-musculoesqueletico", "banderas-clinicas"]) {\n    await page.locator(`#course-grid [data-course="${slug}"]`).click();\n  }\n\n  await expect.poll(async () => page.evaluate(() => window.__nativeGridClicks)).toEqual([\n    "dolor-lumbar-persistente",\n    "dolor-musculoesqueletico",\n    "banderas-clinicas",\n  ]);\n});\n\n'''
          if 'los cursos nuevos conservan el controlador nativo' not in text:
              if test_anchor not in text:
                  raise SystemExit('Owned buttons test insertion point not found')
              text = text.replace(test_anchor, new_test + test_anchor, 1)
          p.write_text(text, encoding='utf-8')

          Path('tests/catalog-product-matrix.test.mjs').write_text(r'''import test from "node:test";
import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";

const config = await readFile(new URL("../academy/academy-bootstrap-v28.js", import.meta.url), "utf8");
const opener = await readFile(new URL("../academy/academy-open-v6.js", import.meta.url), "utf8");
const academy = await readFile(new URL("../academy/academy-v39.js", import.meta.url), "utf8");

const blocks = (config.split("courses: [")[1]?.split("]\n});")[0] || "")
  .split(/\n\s*},\s*\n/)
  .map((block) => ({
    slug: block.match(/slug:\s*"([^"]+)"/)?.[1],
    status: block.match(/status:\s*"([^"]+)"/)?.[1],
    commercialStatus: block.match(/commercialStatus:\s*"([^"]+)"/)?.[1] || "sale",
    developmentLabel: block.match(/developmentLabel:\s*"([^"]+)"/)?.[1] || "",
  }))
  .filter((item) => item.slug);

test("todo producto activo tiene ruta de apertura conocida", () => {
  const active = blocks.filter((item) => item.status === "active");
  for (const product of active) {
    assert.equal(opener.includes(`"${product.slug}"`), true, `${product.slug} no está declarado en el opener unificado`);
  }
});

test("los productos en preparación comercial declaran etiqueta visible", () => {
  const preparing = blocks.filter((item) => item.commercialStatus === "preparing");
  assert.ok(preparing.some((item) => item.slug === "dolor-musculoesqueletico"));
  assert.ok(preparing.some((item) => item.slug === "banderas-clinicas"));
  for (const product of preparing) assert.ok(product.developmentLabel, `${product.slug} no tiene developmentLabel`);
  assert.match(academy, /course\.commercialStatus === "preparing"/);
  assert.match(academy, /Abrir versión de revisión/);
});
''', encoding='utf-8')

          template = '''<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>{title} · KineCheck</title>\n<meta name="description" content="{description}">\n<style>\n:root{{--brand:#176b5b;--brand2:#0c4d42;--bg:#f3f6f5;--text:#17302b;--muted:#687a74;--line:#dce6e2;--soft:#e8f3ef}}*{{box-sizing:border-box}}body{{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}}main{{width:min(760px,calc(100% - 32px));margin:0 auto;padding:48px 0 70px}}.hero{{padding:30px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 18px 50px rgba(12,77,66,.08)}}.mark{{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(150deg,var(--brand2),var(--brand));color:white;font-weight:900}}.eyebrow{{display:inline-flex;margin-left:10px;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:.76rem;font-weight:900;letter-spacing:.08em}}h1{{margin:24px 0 10px;font-size:clamp(2rem,7vw,3.6rem);line-height:1.02}}p{{color:var(--muted);font-size:1.05rem;line-height:1.65}}.notice{{margin:24px 0;padding:18px;border-radius:18px;background:var(--soft);color:var(--brand2);font-weight:750}}.actions{{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}}a{{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;text-decoration:none;font-weight:850}}.primary{{background:var(--brand);color:#fff}}.secondary{{border:1px solid var(--line);color:var(--brand2);background:#fff}}@media(max-width:540px){{main{{padding-top:24px}}.hero{{padding:22px;border-radius:22px}}.actions a{{width:100%}}}}\n</style>\n</head>\n<body><main><section class="hero"><div><span class="mark">{icon}</span><span class="eyebrow">{badge}</span></div><h1>{title}</h1><p>{description}</p><div class="notice">{notice}</div><div class="actions"><a class="primary" href="../../academy/">Abrir mi biblioteca KineCheck</a><a class="secondary" href="../../#productos">Volver al ecosistema</a></div></section></main></body></html>'''
          pages = {
              'productos/dolor-musculoesqueletico/index.html': dict(title='Dolor Musculoesquelético', icon='DM', badge='PRÓXIMAMENTE', description='Ciencia del dolor, fenotipos, evaluación, PROMs y razonamiento clínico aplicado.', notice='Este curso está en preparación comercial. Las cuentas que ya tengan acceso de revisión pueden abrirlo desde su Biblioteca KineCheck.'),
              'productos/banderas-clinicas/index.html': dict(title='KineCheck Banderas Clínicas', icon='BC', badge='EN CONSTRUCCIÓN', description='Screening, riesgo y toma de decisiones musculoesqueléticas.', notice='Este curso forma parte del ecosistema KineCheck y está actualmente en construcción. La versión de revisión está disponible solo para cuentas autorizadas.'),
          }
          for path, data in pages.items():
              pp = Path(path)
              pp.parent.mkdir(parents=True, exist_ok=True)
              pp.write_text(template.format(**data), encoding='utf-8')

      - name: Validate syntax and invariants
        run: |
          node --check academy/academy-bootstrap-v28.js
          node --check academy/academy-v39.js
          node --check academy/academy-owned-native-bridge-v1.js
          node --check academy/academy-home-native-courses-v1.js
          node --test tests/catalog-product-matrix.test.mjs
          grep -q 'commercialStatus: "preparing"' academy/academy-bootstrap-v28.js
          grep -q 'Abrir versión de revisión' academy/academy-v39.js
          grep -q 'banderas-clinicas' tests/recommended-buttons.spec.mjs
          test -f productos/banderas-clinicas/index.html
          test -f productos/dolor-musculoesqueletico/index.html

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run button suites in Chromium
        run: npx playwright test tests/recommended-buttons.spec.mjs tests/owned-buttons.spec.mjs --browser=chromium --reporter=line

      - name: Run button suites in WebKit
        run: npx playwright test tests/recommended-buttons.spec.mjs tests/owned-buttons.spec.mjs --browser=webkit --reporter=line

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ecosystem-buttons-20260820.yml
          git add -A
          git commit -m "Fix ecosystem product states and button coverage"
          git push origin HEAD:fix/ecosystem-buttons-20260820
