name: KineCheck Disaster Recovery v2

on:
  workflow_dispatch:
  schedule:
    - cron: "30 09 * * 0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/kinecheck-disaster-recovery-v2.yml"
      - "scripts/validate-disaster-recovery.mjs"
      - "docs/continuidad/plan-recuperacion-kinecheck.md"
      - "docs/continuidad/recuperacion-servicios-administrados.md"
  pull_request:
    paths:
      - ".github/workflows/kinecheck-disaster-recovery-v2.yml"
      - "scripts/validate-disaster-recovery.mjs"
      - "docs/continuidad/plan-recuperacion-kinecheck.md"
      - "docs/continuidad/recuperacion-servicios-administrados.md"

permissions:
  contents: read

concurrency:
  group: kinecheck-disaster-recovery
  cancel-in-progress: false

jobs:
  contract-check:
    name: Validate disaster-recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow and recovery documentation
        run: node scripts/validate-disaster-recovery.mjs

  backup-restore-verify:
    name: Encrypted public-schema backup and PostgreSQL 17 restore
    needs: contract-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore_validation_only
          POSTGRES_DB: kinecheck_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kinecheck_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      PGPASSWORD: restore_validation_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_URL"
            missing=1
          fi
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            echo "::error::Missing GitHub Actions secret BACKUP_ENCRYPTION_PASSPHRASE"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure both repository secrets before the external backup can run."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_DB_URL}"
          echo "::add-mask::${BACKUP_ENCRYPTION_PASSPHRASE}"

      - name: Create public-schema database dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p disaster-recovery
          docker run --rm \
            -e SUPABASE_DB_URL \
            -v "$PWD/disaster-recovery:/backup" \
            postgres:17 \
            bash -lc 'pg_dump "$SUPABASE_DB_URL" --format=custom --compress=9 --no-owner --no-acl --schema=public --file=/backup/kinecheck-public.dump'
          test -s disaster-recovery/kinecheck-public.dump
          sha256sum disaster-recovery/kinecheck-public.dump | tee disaster-recovery/kinecheck-public.dump.sha256

      - name: Inventory external dependencies in public dump
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/disaster-recovery:/backup" \
            postgres:17 \
            pg_restore \
              --schema-only \
              --no-owner \
              --no-acl \
              --file=/backup/kinecheck-public-schema.sql \
              /backup/kinecheck-public.dump

          docker run --rm \
            postgres:17 \
            psql "$SUPABASE_DB_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command="select nspname from pg_catalog.pg_namespace where nspname <> 'public' and nspname <> 'information_schema' and nspname !~ '^pg_' order by nspname" \
            > disaster-recovery/source-nonpublic-schemas.txt

          : > disaster-recovery/public-external-schema-references.txt
          while IFS= read -r schema; do
            if [[ ! "$schema" =~ ^[A-Za-z_][A-Za-z0-9_$]*$ ]]; then
              echo "::error::Unexpected schema identifier in source catalog"
              exit 1
            fi
            if grep -Eq "(^|[^[:alnum:]_])\"?${schema}\"?\." disaster-recovery/kinecheck-public-schema.sql; then
              printf '%s\n' "$schema" >> disaster-recovery/public-external-schema-references.txt
            fi
          done < disaster-recovery/source-nonpublic-schemas.txt
          sort -u -o disaster-recovery/public-external-schema-references.txt \
            disaster-recovery/public-external-schema-references.txt

          printf '%s\n' auth extensions > disaster-recovery/expected-external-schemas.txt
          if ! diff -u \
            disaster-recovery/expected-external-schemas.txt \
            disaster-recovery/public-external-schema-references.txt; then
            echo "::error::The public dump has an unreviewed external schema dependency"
            exit 1
          fi
          for reference in auth.jwt auth.users auth.uid extensions.digest; do
            if ! grep -Fq "$reference" disaster-recovery/kinecheck-public-schema.sql; then
              echo "::error::Missing reviewed external dependency ${reference}"
              exit 1
            fi
          done
          grep -Eo '\b(auth|extensions)\.[A-Za-z_][A-Za-z0-9_]*' \
            disaster-recovery/kinecheck-public-schema.sql \
            | sort -u \
            > disaster-recovery/public-external-object-references.txt
          printf '%s\n' auth.jwt auth.uid auth.users extensions.digest \
            > disaster-recovery/expected-external-objects.txt
          if ! diff -u \
            disaster-recovery/expected-external-objects.txt \
            disaster-recovery/public-external-object-references.txt; then
            echo "::error::The public dump has an unreviewed external object dependency"
            exit 1
          fi

          grep -Eio 'TO[[:space:]]+(anon|authenticated|service_role)' \
            disaster-recovery/kinecheck-public-schema.sql \
            | awk '{print tolower($2)}' \
            | sort -u \
            > disaster-recovery/restore-roles.txt
          test -s disaster-recovery/restore-roles.txt
          : > disaster-recovery/restore-role-stubs.sql
          while IFS= read -r role; do
            case "$role" in
              anon|authenticated|service_role) ;;
              *)
                echo "::error::Unreviewed role dependency ${role}"
                exit 1
                ;;
            esac
            printf 'CREATE ROLE "%s" NOLOGIN;\n' "$role" \
              >> disaster-recovery/restore-role-stubs.sql
          done < disaster-recovery/restore-roles.txt

          docker run --rm \
            postgres:17 \
            psql "$SUPABASE_DB_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator='|' \
              --command="
                select
                  src.relname,
                  src_att.attname,
                  ref_ns.nspname,
                  ref.relname,
                  ref_att.attname,
                  pg_catalog.format_type(ref_att.atttypid, ref_att.atttypmod),
                  pg_catalog.cardinality(c.conkey),
                  c.conname
                from pg_catalog.pg_constraint c
                join pg_catalog.pg_class src on src.oid = c.conrelid
                join pg_catalog.pg_namespace src_ns on src_ns.oid = src.relnamespace
                join pg_catalog.pg_class ref on ref.oid = c.confrelid
                join pg_catalog.pg_namespace ref_ns on ref_ns.oid = ref.relnamespace
                cross join lateral unnest(c.conkey) with ordinality as src_key(attnum, ord)
                join lateral unnest(c.confkey) with ordinality as ref_key(attnum, ord)
                  on ref_key.ord = src_key.ord
                join pg_catalog.pg_attribute src_att
                  on src_att.attrelid = src.oid and src_att.attnum = src_key.attnum
                join pg_catalog.pg_attribute ref_att
                  on ref_att.attrelid = ref.oid and ref_att.attnum = ref_key.attnum
                where c.contype = 'f'
                  and src_ns.nspname = 'public'
                  and ref_ns.nspname <> 'public'
                order by c.conname, src_key.ord
              " \
            > disaster-recovery/public-external-fks.tsv
          test -s disaster-recovery/public-external-fks.tsv

          while IFS='|' read -r source_table source_column target_schema target_table target_column target_type key_width constraint_name; do
            for identifier in "$source_table" "$source_column" "$constraint_name"; do
              if [[ ! "$identifier" =~ ^[A-Za-z_][A-Za-z0-9_$]*$ ]]; then
                echo "::error::Unsafe identifier in external FK inventory"
                exit 1
              fi
            done
            if [ "$target_schema" != "auth" ] || \
               [ "$target_table" != "users" ] || \
               [ "$target_column" != "id" ] || \
               [ "$target_type" != "uuid" ] || \
               [ "$key_width" != "1" ]; then
              echo "::error::Unsupported external FK ${constraint_name}: public.${source_table}.${source_column} -> ${target_schema}.${target_table}.${target_column} (${target_type}, width ${key_width})"
              exit 1
            fi
          done < disaster-recovery/public-external-fks.tsv

      - name: Restore dump into temporary PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/disaster-recovery:/backup" \
            postgres:17 \
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=kinecheck_restore \
              --set=ON_ERROR_STOP=1 \
              --file=/backup/restore-role-stubs.sql \
              --command='
                DROP SCHEMA IF EXISTS public CASCADE;
                CREATE SCHEMA auth;
                CREATE TABLE auth.users (id uuid PRIMARY KEY, email text);
                CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$ SELECT jsonb_build_object() $$;
                CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
                CREATE SCHEMA extensions;
                CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
              '

          for section in pre-data data; do
            docker run --rm --network host \
              -e PGPASSWORD="$PGPASSWORD" \
              -v "$PWD/disaster-recovery:/backup" \
              postgres:17 \
              pg_restore \
                --host=127.0.0.1 \
                --port=5432 \
                --username=postgres \
                --dbname=kinecheck_restore \
                --no-owner \
                --no-acl \
                --section="$section" \
                --exit-on-error \
                /backup/kinecheck-public.dump
          done

          : > disaster-recovery/auth-user-stub-seed.sql
          while IFS='|' read -r source_table source_column target_schema target_table target_column target_type key_width constraint_name; do
            printf 'INSERT INTO auth.users (id) SELECT DISTINCT "%s" FROM public."%s" WHERE "%s" IS NOT NULL ON CONFLICT DO NOTHING;\n' \
              "$source_column" "$source_table" "$source_column" \
              >> disaster-recovery/auth-user-stub-seed.sql
          done < disaster-recovery/public-external-fks.tsv
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/disaster-recovery:/backup" \
            postgres:17 \
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=kinecheck_restore \
              --set=ON_ERROR_STOP=1 \
              --file=/backup/auth-user-stub-seed.sql

          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/disaster-recovery:/backup" \
            postgres:17 \
            pg_restore \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=kinecheck_restore \
              --no-owner \
              --no-acl \
              --section=post-data \
              --exit-on-error \
              /backup/kinecheck-public.dump

          expected_external_fks=$(wc -l < disaster-recovery/public-external-fks.tsv | tr -d ' ')
          restored_external_fks=$(docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=kinecheck_restore \
              --tuples-only \
              --no-align \
              --command="
                select count(*)
                from pg_catalog.pg_constraint c
                join pg_catalog.pg_class src on src.oid = c.conrelid
                join pg_catalog.pg_namespace src_ns on src_ns.oid = src.relnamespace
                join pg_catalog.pg_class ref on ref.oid = c.confrelid
                join pg_catalog.pg_namespace ref_ns on ref_ns.oid = ref.relnamespace
                where c.contype = 'f'
                  and src_ns.nspname = 'public'
                  and ref_ns.nspname <> 'public'
                  and c.convalidated
              " | tr -d '[:space:]')
          test "$restored_external_fks" = "$expected_external_fks"

          copied_auth_rows=$(docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=kinecheck_restore \
              --tuples-only \
              --no-align \
              --command="select count(*) from auth.users where email is not null" \
            | tr -d '[:space:]')
          test "$copied_auth_rows" = "0"

      - name: Validate restored application structure
        shell: bash
        run: |
          set -euo pipefail
          required_tables=(
            course_access
            hotmart_product_grants
            hotmart_purchases
            hotmart_webhook_events
            kinecheck_access_policy
            platform_feature_flags
            platform_cases
            platform_user_preferences
            kinecheck_legal_acceptances
            kinecheck_support_requests
            kinecheck_restore_drills
          )
          for table in "${required_tables[@]}"; do
            result=$(psql -h 127.0.0.1 -U postgres -d kinecheck_restore -Atc "select to_regclass('public.${table}') is not null")
            if [ "$result" != "t" ]; then
              echo "::error::Missing restored table public.${table}"
              exit 1
            fi
          done

          required_functions=(
            process_hotmart_event
            deactivate_expired_course_access
            run_kinecheck_config_restore_drill
          )
          for fn in "${required_functions[@]}"; do
            result=$(psql -h 127.0.0.1 -U postgres -d kinecheck_restore -Atc "select exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='${fn}')")
            if [ "$result" != "t" ]; then
              echo "::error::Missing restored function public.${fn}"
              exit 1
            fi
          done

          psql -h 127.0.0.1 -U postgres -d kinecheck_restore -Atc "select json_build_object(
            'course_access', (select count(*) from public.course_access),
            'product_grants', (select count(*) from public.hotmart_product_grants),
            'purchases', (select count(*) from public.hotmart_purchases),
            'feature_flags', (select count(*) from public.platform_feature_flags),
            'legal_acceptances', (select count(*) from public.kinecheck_legal_acceptances)
          )" > disaster-recovery/restored-counts.json
          jq -e '
            type == "object" and
            ([.course_access, .product_grants, .purchases, .feature_flags, .legal_acceptances] | all(type == "number" and . >= 0))
          ' disaster-recovery/restored-counts.json > /dev/null

      - name: Build recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          checksum=$(cut -d' ' -f1 disaster-recovery/kinecheck-public.dump.sha256)
          counts=$(cat disaster-recovery/restored-counts.json)
          cat > disaster-recovery/manifest.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "scope": "public_schema",
            "postgres_version": "17",
            "dump_sha256": "${checksum}",
            "restore_validation": "passed",
            "restored_counts": ${counts},
            "storage_objects_included": false,
            "auth_users_included": false
          }
          EOF
          jq -e '
            .scope == "public_schema" and
            .postgres_version == "17" and
            .restore_validation == "passed" and
            .storage_objects_included == false and
            .auth_users_included == false and
            (.dump_sha256 | test("^[0-9a-f]{64}$")) and
            (.restored_counts | type == "object")
          ' disaster-recovery/manifest.json > /dev/null

      - name: Encrypt and verify recovery package
        shell: bash
        run: |
          set -euo pipefail
          verification_dump="${RUNNER_TEMP}/kinecheck-public.verify.dump"
          cleanup_plaintext() {
            rm -f \
              disaster-recovery/kinecheck-public.dump \
              disaster-recovery/kinecheck-public.dump.sha256 \
              disaster-recovery/kinecheck-public-schema.sql \
              disaster-recovery/source-nonpublic-schemas.txt \
              disaster-recovery/public-external-schema-references.txt \
              disaster-recovery/expected-external-schemas.txt \
              disaster-recovery/public-external-object-references.txt \
              disaster-recovery/expected-external-objects.txt \
              disaster-recovery/restore-roles.txt \
              disaster-recovery/restore-role-stubs.sql \
              disaster-recovery/public-external-fks.tsv \
              disaster-recovery/auth-user-stub-seed.sql \
              "$verification_dump"
          }
          trap cleanup_plaintext EXIT

          expected_checksum=$(cut -d' ' -f1 disaster-recovery/kinecheck-public.dump.sha256)
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in disaster-recovery/kinecheck-public.dump \
            -out disaster-recovery/kinecheck-public.dump.enc \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          test -s disaster-recovery/kinecheck-public.dump.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in disaster-recovery/kinecheck-public.dump.enc \
            -out "$verification_dump" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          actual_checksum=$(sha256sum "$verification_dump" | cut -d' ' -f1)
          test "$actual_checksum" = "$expected_checksum"
          docker run --rm \
            -v "${RUNNER_TEMP}:/verify:ro" \
            postgres:17 \
            pg_restore --list /verify/kinecheck-public.verify.dump > /dev/null

          sha256sum disaster-recovery/kinecheck-public.dump.enc > disaster-recovery/kinecheck-public.dump.enc.sha256

      - name: Confirm plaintext removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e disaster-recovery/kinecheck-public.dump
          test ! -e disaster-recovery/kinecheck-public.dump.sha256
          test ! -e disaster-recovery/kinecheck-public-schema.sql
          test ! -e disaster-recovery/source-nonpublic-schemas.txt
          test ! -e disaster-recovery/public-external-schema-references.txt
          test ! -e disaster-recovery/expected-external-schemas.txt
          test ! -e disaster-recovery/public-external-object-references.txt
          test ! -e disaster-recovery/expected-external-objects.txt
          test ! -e disaster-recovery/restore-roles.txt
          test ! -e disaster-recovery/restore-role-stubs.sql
          test ! -e disaster-recovery/public-external-fks.tsv
          test ! -e disaster-recovery/auth-user-stub-seed.sql
          test ! -e "${RUNNER_TEMP}/kinecheck-public.verify.dump"

      - name: Upload encrypted recovery package
        uses: actions/upload-artifact@v4
        with:
          name: kinecheck-disaster-recovery-${{ github.run_id }}
          path: |
            disaster-recovery/kinecheck-public.dump.enc
            disaster-recovery/kinecheck-public.dump.enc.sha256
            disaster-recovery/manifest.json
            disaster-recovery/restored-counts.json
          if-no-files-found: error
          retention-days: 30

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## KineCheck Disaster Recovery"
            echo
            if [ -s disaster-recovery/manifest.json ] && \
               [ -s disaster-recovery/kinecheck-public.dump.enc ] && \
               [ -s disaster-recovery/kinecheck-public.dump.enc.sha256 ]; then
              echo "External encrypted database backup: **created**"
              echo
              echo "Temporary PostgreSQL restore: **passed**"
              echo
              echo "Scope: public schema. Supabase Storage objects and Auth users require separate recovery procedures."
            else
              echo "Backup package was not created. Review the failed step and required repository secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plaintext recovery material
        if: always()
        shell: bash
        run: |
          rm -f \
            disaster-recovery/kinecheck-public.dump \
            disaster-recovery/kinecheck-public.dump.sha256 \
            disaster-recovery/kinecheck-public-schema.sql \
            disaster-recovery/source-nonpublic-schemas.txt \
            disaster-recovery/public-external-schema-references.txt \
            disaster-recovery/expected-external-schemas.txt \
            disaster-recovery/public-external-object-references.txt \
            disaster-recovery/expected-external-objects.txt \
            disaster-recovery/restore-roles.txt \
            disaster-recovery/restore-role-stubs.sql \
            disaster-recovery/public-external-fks.tsv \
            disaster-recovery/auth-user-stub-seed.sql \
            "${RUNNER_TEMP}/kinecheck-public.verify.dump"
