name: KineCheck healthcheck

on:
  push:
    branches: [main]
    paths:
      - "academy/**"
      - "kinecheck/**"
      - "scripts/healthcheck.mjs"
      - ".github/workflows/kinecheck-healthcheck.yml"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  end-to-end-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Academy, App and SSO integration
        run: node academy/verify-kinecheck-access.mjs

      - name: Wait for GitHub Pages deployment
        if: github.event_name == 'push'
        run: sleep 75

      - name: Test KineCheck, Hotmart and Supabase flow
        id: healthcheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/healthcheck.mjs 2>&1 | tee healthcheck-output.txt
          status=${PIPESTATUS[0]}
          warnings=$(grep -c '^::warning::' healthcheck-output.txt || true)
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "warnings=$warnings" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish healthcheck report
        uses: actions/github-script@v7
        env:
          HEALTHCHECK_EXIT_CODE: ${{ steps.healthcheck.outputs.exit_code }}
          HEALTHCHECK_WARNINGS: ${{ steps.healthcheck.outputs.warnings }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('healthcheck-output.txt')
              ? fs.readFileSync('healthcheck-output.txt', 'utf8').slice(-55000)
              : 'No se generó salida del healthcheck.';
            const failed = process.env.HEALTHCHECK_EXIT_CODE !== '0';
            const warnings = Number(process.env.HEALTHCHECK_WARNINGS || 0);
            const perfect = !failed && warnings === 0;
            const stateLabel = failed
              ? '❌ REQUIERE REVISIÓN'
              : warnings > 0
                ? `⚠️ CORRECTO CON ${warnings} ADVERTENCIA(S)`
                : '✅ CORRECTO';
            const title = 'KineCheck · informe automático del flujo Hotmart';
            const body = [
              `## Estado: ${stateLabel}`,
              '',
              `- Ejecución: ${new Date().toISOString()}`,
              `- Commit: \`${context.sha}\``,
              `- Evento: \`${context.eventName}\``,
              '',
              '### Resultado técnico',
              '```text',
              output,
              '```',
              '',
              '> Este informe comprueba disponibilidad de la página pública, Academy, páginas posventa, enlaces de checkout, productos activos y funciones de Supabase. No realiza un cobro real.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: perfect ? 'closed' : 'open',
              });
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              if (perfect) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: created.number,
                  state: 'closed',
                });
              }
            }

      - name: Fail workflow when healthcheck fails
        if: steps.healthcheck.outputs.exit_code != '0'
        run: exit 1
