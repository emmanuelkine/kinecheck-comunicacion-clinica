name: Library feedback isolation and browser tests
on:
  pull_request:
    paths:
      - 'functions/api/library-feedback.js'
      - 'assets/library-feedback-v1.js'
      - 'admin/**'
      - 'gratis/index.html'
      - 'gratis/pacientes/index.html'
      - 'gratis/profesionales/index.html'
      - 'tests/library-feedback*'
      - 'package*.json'
      - '.github/workflows/library-feedback.yml'
permissions:
  contents: read
jobs:
  synthetic-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEEDBACK_QA_DIR: /tmp/feedback-qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:feedback
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:feedback:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: library-feedback-synthetic-qa
          path: /tmp/feedback-qa
          if-no-files-found: ignore
          retention-days: 7
