name: Marcar Banderas Clinicas en construccion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/banderas-construction-label
      - name: Add construction state without blocking owner access
        shell: python
        run: |
          from pathlib import Path

          bootstrap = Path('academy/academy-bootstrap-v28.js')
          text = bootstrap.read_text(encoding='utf-8')
          marker = '      slug: "banderas-clinicas",'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('No se encontro banderas-clinicas en Academy')
          end = text.find('\n    },', start)
          block = text[start:end]
          if 'developmentLabel:' not in block:
              needle = '      subtitle: "Screening, riesgo y toma de decisiones musculoesqueléticas.",\n'
              if needle not in block:
                  raise SystemExit('No se encontro el subtitulo esperado de Banderas Clinicas')
              block = block.replace(needle, needle + '      developmentLabel: "EN CONSTRUCCIÓN",\n', 1)
              text = text[:start] + block + text[end:]
              bootstrap.write_text(text, encoding='utf-8')

          academy = Path('academy/academy-v39.js')
          js = academy.read_text(encoding='utf-8')
          old_status = '''  const status = owned && state.started && course.kind === "course"
    ? "En progreso"
    : accessBadge(access);'''
          new_status = '''  const status = course.developmentLabel
    ? course.developmentLabel
    : (owned && state.started && course.kind === "course"
      ? "En progreso"
      : accessBadge(access));'''
          if old_status in js:
              js = js.replace(old_status, new_status, 1)
          elif 'const status = course.developmentLabel' not in js:
              raise SystemExit('No se encontro el bloque de status esperado')

          old_product = '''  const productLabel = course.productId === "PROPIETARIO"
    ? "Versión en desarrollo"
    : (owned ? "Acceso verificado" : "Licencia asociada a la compra");'''
          new_product = '''  const productLabel = course.developmentLabel
    ? "Próximo lanzamiento · contenido en desarrollo"
    : (course.productId === "PROPIETARIO"
      ? "Versión en desarrollo"
      : (owned ? "Acceso verificado" : "Licencia asociada a la compra"));'''
          if old_product in js:
              js = js.replace(old_product, new_product, 1)
          elif 'Próximo lanzamiento · contenido en desarrollo' not in js:
              raise SystemExit('No se encontro el bloque productLabel esperado')

          old_badge = '''        <span class="status-badge ${owned ? "" : "preparing"}">${status}</span>'''
          new_badge = '''        <span class="status-badge ${course.developmentLabel || !owned ? "preparing" : ""}">${status}</span>'''
          if old_badge in js:
              js = js.replace(old_badge, new_badge, 1)
          elif 'course.developmentLabel || !owned' not in js:
              raise SystemExit('No se encontro la clase del badge esperada')
          academy.write_text(js, encoding='utf-8')
      - name: Validate Academy JavaScript
        run: |
          node --check academy/academy-bootstrap-v28.js
          node --check academy/academy-v39.js
          grep -q 'developmentLabel: "EN CONSTRUCCIÓN"' academy/academy-bootstrap-v28.js
          grep -q 'Próximo lanzamiento · contenido en desarrollo' academy/academy-v39.js
      - name: Commit generated change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mark-banderas-en-construccion.yml
          git add academy/academy-bootstrap-v28.js academy/academy-v39.js
          git commit -m "Mark Banderas Clínicas as en construcción"
          git push origin HEAD:feat/banderas-construction-label
