name: One-off private premium asset migration

on:
  push:
    branches:
      - ops/private-course-assets-20260902
    paths:
      - .github/workflows/migrate-premium-assets-20260902.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy current premium assets into private Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --request POST \
            'https://eqhcdclyeoapmqtlduwf.supabase.co/functions/v1/migrate-premium-assets-20260902')"
          printf '%s\n' "$response"
          RESULT="$response" node - <<'NODE'
          const result = JSON.parse(process.env.RESULT || '{}');
          if (!result.ok || !Array.isArray(result.results) || result.results.length !== 4) {
            console.error('Premium asset migration did not complete all four objects.');
            process.exit(1);
          }
          for (const item of result.results) {
            if (!item.sha256 || !item.bytes || !['uploaded', 'already-exists'].includes(item.status)) {
              console.error('Invalid migration verification result:', item);
              process.exit(1);
            }
            console.log(`${item.target} ${item.status} ${item.bytes}B sha256=${item.sha256}`);
          }
NODE
