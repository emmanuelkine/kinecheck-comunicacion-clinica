name: One-off private premium asset migration

on:
  push:
    branches:
      - ops/private-course-assets-20260902
    paths:
      - .github/workflows/migrate-premium-assets-20260902.yml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy current premium assets into private Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --request POST 'https://eqhcdclyeoapmqtlduwf.supabase.co/functions/v1/migrate-premium-assets-20260902')"
          printf '%s\n' "$response"
          RESULT="$response" node -e 'const r=JSON.parse(process.env.RESULT||"{}"); if(!r.ok||!Array.isArray(r.results)||r.results.length!==4) process.exit(1); for(const i of r.results){if(!i.sha256||!i.bytes||!["uploaded","already-exists"].includes(i.status)) process.exit(1); console.log(`${i.target} ${i.status} ${i.bytes}B sha256=${i.sha256}`)}'
