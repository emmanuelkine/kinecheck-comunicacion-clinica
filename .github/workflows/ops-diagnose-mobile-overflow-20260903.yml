name: One-off mobile overflow diagnosis 2026-09-03

on:
  push:
    branches:
      - fix/audit-regressions-20260903
    paths:
      - .github/workflows/ops-diagnose-mobile-overflow-20260903.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Find elements crossing mobile viewport
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, locale:'es-CL'});
            await page.goto('https://kinecheck-comunicacion-clinica.pages.dev/productos/mas-alla-del-dolor/?qa=overflow-diagnosis', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(1000);
            const result = await page.evaluate(() => {
              const viewport = document.documentElement.clientWidth;
              const offenders = [...document.querySelectorAll('body *')].map((el) => {
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                return {
                  tag: el.tagName.toLowerCase(),
                  cls: typeof el.className === 'string' ? el.className : '',
                  text: (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,100),
                  left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width),
                  display: cs.display, position: cs.position, whiteSpace: cs.whiteSpace,
                  minWidth: cs.minWidth, paddingLeft: cs.paddingLeft, paddingRight: cs.paddingRight
                };
              }).filter(x => x.right > viewport + 3 || x.left < -3).sort((a,b)=>b.right-a.right);
              return {viewport, scrollWidth:document.documentElement.scrollWidth, offenders:offenders.slice(0,30)};
            });
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
