name: One-off multidispositivo audit 2026-09-02

on:
  push:
    branches:
      - ops/hotmart-public-audit-20260902
    paths:
      - .github/workflows/ops-multidevice-audit-20260902.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browsers
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
      - name: Test public production surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium, webkit, devices } = require('playwright');
          (async () => {
            const pages = [
              'https://kinecheck.cl/',
              'https://kinecheck.cl/profesionales/',
              'https://kinecheck.cl/estudiantes/',
              'https://kinecheck.cl/academy/',
              'https://kinecheck.cl/kinecheck-clinico-curso/',
              'https://kinecheck.cl/academy/dolor-lumbar-persistente/'
            ];
            const profiles = [
              {name:'desktop-chromium', engine:chromium, context:{viewport:{width:1440,height:900}}},
              {name:'desktop-webkit', engine:webkit, context:{viewport:{width:1440,height:900}}},
              {name:'iphone-13-webkit', engine:webkit, context:{...devices['iPhone 13']}},
              {name:'pixel-7-chromium', engine:chromium, context:{...devices['Pixel 7']}},
            ];
            const output = {checkedAt:new Date().toISOString(), profiles:{}};
            let failures=0;
            for (const profile of profiles) {
              const browser=await profile.engine.launch({headless:true});
              const context=await browser.newContext(profile.context);
              output.profiles[profile.name]={};
              for (const url of pages) {
                const page=await context.newPage();
                const errors=[];
                page.on('pageerror', e=>errors.push(String(e.message||e)));
                try {
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  await page.waitForTimeout(1200);
                  const status=response?.status() ?? null;
                  const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,title:document.title}));
                  const overflow=metrics.scrollWidth > metrics.clientWidth + 8;
                  output.profiles[profile.name][url]={status,overflow,errors,title:metrics.title};
                  console.log(`${profile.name} ${status} overflow=${overflow} errors=${errors.length} ${url}`);
                  if (status !== 200 || overflow) failures++;
                } catch(e) {
                  output.profiles[profile.name][url]={error:String(e.message||e)};
                  failures++;
                  console.error(`${profile.name} ERROR ${url}: ${e.message||e}`);
                } finally { await page.close(); }
              }
              await browser.close();
            }
            fs.writeFileSync('multidevice-public-audit-2026-09-02.json',JSON.stringify(output,null,2));
            if (failures) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Upload multidispositivo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multidispositivo-public-audit-2026-09-02
          path: multidevice-public-audit-2026-09-02.json
          if-no-files-found: warn
          retention-days: 14
