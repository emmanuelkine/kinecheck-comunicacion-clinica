name: KineCheck Commercial QA

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"
  pull_request:
    paths:
      - "index.html"
      - "home.js"
      - "home.css"
      - "catalog-professional.css"
      - "productos/**"
      - "platform/**"
      - "legal/**"
      - "beta/**"
      - "scripts/qa-commercial-post-privacy.mjs"
      - ".github/workflows/qa-commercial.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home.js"
      - "home.css"
      - "catalog-professional.css"
      - "productos/**"
      - "platform/**"
      - "legal/**"
      - "beta/**"
      - "scripts/qa-commercial-post-privacy.mjs"
      - ".github/workflows/qa-commercial.yml"

permissions:
  contents: read

jobs:
  certify-public-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Wait for Cloudflare Pages propagation
        if: github.event_name == 'push'
        run: sleep 45

      - name: Run commercial QA post-privacy
        env:
          BASE_URL: https://kinecheck.cl
        run: node scripts/qa-commercial-post-privacy.mjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kinecheck-commercial-qa-${{ github.run_id }}
          path: qa-commercial-report.json
          retention-days: 14
          if-no-files-found: warn
