name: Quality Impact security and educational QA
on:
  pull_request:
    paths: ['academy/**','functions/api/quality/**','functions/_shared/quality-*','supabase/**','tests/quality-*','tests/helpers/quality-*','package*.json','_headers','.github/workflows/quality-impact.yml']
  push:
    branches: [main,feat/quality-impact-20261028]
    paths: ['academy/**','functions/api/quality/**','functions/_shared/quality-*','supabase/**','tests/quality-*','tests/helpers/quality-*','package*.json','_headers','.github/workflows/quality-impact.yml']
permissions: {contents: read}
jobs:
  quality-unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: node scripts/validate-academy-integrity.mjs
      - run: node scripts/validate-academy-ui-contracts.mjs
      - run: node scripts/audit-brand-integrity.mjs
  quality-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/quality-impact-browser.mjs
      - run: node tests/campus-browser.mjs
      - run: node tests/exercise-app-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: quality-impact-browser-evidence, path: 'qa-quality-browser/', retention-days: 30}
