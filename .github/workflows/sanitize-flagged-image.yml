name: Sanitize KineCheck image metadata
on:
  push:
    branches: [audit/public-and-binary-assets-20261023]
permissions:
  contents: write
jobs:
  scrub-single-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/public-and-binary-assets-20261023
          persist-credentials: true
      - name: Strip metadata only from flagged clinical-room image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl
          exiftool -all= -overwrite_original assets/clinical-room-no-people-20260924.png
          git diff --check
          if ! git diff --quiet -- assets/clinical-room-no-people-20260924.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/clinical-room-no-people-20260924.png
            git commit -m "fix: strip external creator metadata from KineCheck image"
            git push origin HEAD:audit/public-and-binary-assets-20261023
          fi
