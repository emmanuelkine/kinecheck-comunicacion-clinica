name: KineCheck Security Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"
  push:
    branches: [main]
    paths:
      - "_headers"
      - "platform/**"
      - "legal/**"
      - "scripts/security-baseline.mjs"
      - ".github/workflows/security-baseline.yml"

permissions:
  contents: read

concurrency:
  group: kinecheck-security-baseline
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run security baseline
        run: node scripts/security-baseline.mjs

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kinecheck-security-baseline-${{ github.run_id }}
          path: security-baseline-report.json
          if-no-files-found: warn
          retention-days: 30
