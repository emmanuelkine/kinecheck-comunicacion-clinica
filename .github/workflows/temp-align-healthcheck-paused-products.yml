name: Temporary align healthcheck paused products

on:
  pull_request:
    paths:
      - ".github/workflows/temp-align-healthcheck-paused-products.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Align healthcheck with intentional Estudiante sales pause
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/healthcheck.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '{ label: "KineCheck Estudiante", url: "https://pay.hotmart.com/G106801166S", keywords: ["kinecheck estudiante"] },',
              '{ label: "KineCheck Estudiante", url: "https://pay.hotmart.com/G106801166S", keywords: ["kinecheck estudiante"], publiclyActive: false },',
          )
          text = text.replace(
              '{ label: "Pack KineCheck Estudiante", url: "https://pay.hotmart.com/Q106891608M", keywords: ["pack kinecheck estudiante", "kinecheck estudiante"] },',
              '{ label: "Pack KineCheck Estudiante", url: "https://pay.hotmart.com/Q106891608M", keywords: ["pack kinecheck estudiante", "kinecheck estudiante"], publiclyActive: false },',
          )
          marker = '''const NON_COMMERCIAL_ACTIVE_SLUGS = new Set([\n  "dolor-musculoesqueletico",\n  "banderas-clinicas",\n  "ejercicio-terapeutico",\n]);\n'''
          replacement = marker + '''\nconst PAUSED_COMMERCIAL_PRODUCT_IDS = new Set([\n  "8154796", // KineCheck Estudiante: acceso vigente permitido, nuevas ventas pausadas.\n]);\n'''
          if 'PAUSED_COMMERCIAL_PRODUCT_IDS' not in text:
              text = text.replace(marker, replacement)
          text = text.replace(
              'const commercialActiveProducts = activeProducts.filter((product) => !NON_COMMERCIAL_ACTIVE_SLUGS.has(product.slug));',
              'const commercialActiveProducts = activeProducts.filter((product) => !NON_COMMERCIAL_ACTIVE_SLUGS.has(product.slug) && !PAUSED_COMMERCIAL_PRODUCT_IDS.has(product.productId));',
          )
          anchor = '''  const recuperaIsPaused = /próximamente/i.test(recoveryPage)\n    && !recoveryPage.includes("$9.990 CLP")\n    && !recoveryPage.includes(recuperaCheckout)\n    && !publicCommerce.includes(recuperaCheckout);\n'''
          paused_check = '''  const studentCheckout = CHECKOUT_EXPECTATIONS.find((item) => item.label === "KineCheck Estudiante")?.url || "";\n  const studentPackCheckout = CHECKOUT_EXPECTATIONS.find((item) => item.label === "Pack KineCheck Estudiante")?.url || "";\n  const estudianteSalesPaused = /próximamente|en revisión|ventas pausadas/i.test(studentPage)\n    && !studentPage.includes(studentCheckout)\n    && !studentPage.includes(studentPackCheckout)\n    && !publicCommerce.includes(studentCheckout)\n    && !publicCommerce.includes(studentPackCheckout);\n  if (!estudianteSalesPaused) {\n    logFail("KineCheck Estudiante y Pack deben mantener nuevas ventas pausadas mientras el E2E autenticado siga pendiente.");\n  } else {\n    logOk("KineCheck Estudiante y Pack mantienen nuevas ventas pausadas sin bloquear accesos vigentes.");\n  }\n\n'''
          if 'const estudianteSalesPaused' not in text:
              text = text.replace(anchor, paused_check + anchor)
          p.write_text(text, encoding='utf-8')
          PY

          node --check scripts/healthcheck.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/healthcheck.mjs
          git commit -m "QA: model intentional Estudiante sales pause"
          git push origin HEAD:${{ github.head_ref }}
