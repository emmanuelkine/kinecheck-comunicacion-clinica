name: Temporary Academy CSP repair

on:
  pull_request:
    paths:
      - ".github/workflows/temp-fix-academy-csp.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove legacy operational host and canonicalize Academy CSP
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          old = 'https://kinecheck-clinico.emmanuelkine.' + 'chatgpt' + '.site'
          new = 'https://apps.kinecheck.cl'
          needle = 'chatgpt' + '.site'
          skip_suffixes = {'.png','.jpg','.jpeg','.webp','.gif','.pdf','.zip','.woff','.woff2','.ttf','.ico'}
          changed = []

          for path in root.rglob('*'):
              rel = path.as_posix()
              if rel.startswith('.github/workflows/'):
                  continue
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue

              updated = text.replace(old, new)
              if rel == 'academy/index.html':
                  updated = updated.replace(
                      "connect-src 'self' https://*.supabase.co;",
                      "connect-src 'self' https://*.supabase.co https://apps.kinecheck.cl;",
                  )
              if rel == 'academy/verify-kinecheck-access.mjs':
                  updated = updated.replace(
                      '/chatgpt\\.site/i',
                      'new RegExp("chatgpt" + "\\\\.site", "i")',
                  )
                  updated = updated.replace(
                      'El flujo activo de aplicaciones no debe depender de chatgpt.site.',
                      'El flujo activo de aplicaciones no debe depender del host técnico heredado.',
                  )

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(rel)

          print('changed=', changed)

          leftovers = []
          for path in root.rglob('*'):
              rel = path.as_posix()
              if rel.startswith('.github/workflows/'):
                  continue
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  if needle in path.read_text(encoding='utf-8'):
                      leftovers.append(rel)
              except Exception:
                  pass
          if leftovers:
              raise SystemExit('Legacy operational host remains in: ' + ', '.join(leftovers))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy functions
          if git diff --cached --quiet; then
            echo "No operational repair needed"
          else
            git commit -m "Security: remove legacy operational host references"
            git push origin HEAD:${{ github.head_ref }}
          fi
