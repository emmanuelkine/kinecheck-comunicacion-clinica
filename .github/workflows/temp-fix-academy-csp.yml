name: Temporary Academy CSP repair

on:
  pull_request:
    paths:
      - ".github/workflows/temp-fix-academy-csp.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove legacy app host and canonicalize Academy CSP
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          temp_workflow = '.github/workflows/temp-fix-academy-csp.yml'
          old = 'https://kinecheck-clinico.emmanuelkine.' + 'chatgpt' + '.site'
          new = 'https://apps.kinecheck.cl'
          needle = 'chatgpt' + '.site'
          skip_suffixes = {'.png','.jpg','.jpeg','.webp','.gif','.pdf','.zip','.woff','.woff2','.ttf','.ico'}
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue

              updated = text.replace(old, new)
              rel = path.as_posix()

              if rel == 'academy/index.html':
                  updated = updated.replace(
                      "connect-src 'self' https://*.supabase.co;",
                      "connect-src 'self' https://*.supabase.co https://apps.kinecheck.cl;",
                  )

              if rel == 'academy/verify-kinecheck-access.mjs':
                  updated = updated.replace(
                      '/chatgpt\\.site/i',
                      'new RegExp("chatgpt" + "\\\\.site", "i")',
                  )
                  updated = updated.replace(
                      'El flujo activo de aplicaciones no debe depender de chatgpt.site.',
                      'El flujo activo de aplicaciones no debe depender del host técnico heredado.',
                  )

              if rel == '.github/workflows/validate-kinecheck-clinico-course.yml':
                  updated = updated.replace(
                      "          if grep -Rqi 'kinecheck-clinico.emmanuelkine.chatgpt.site/sso.html?product=kinecheck-clinico' academy/academy-bootstrap-v28.js academy/academy-launch-router-v4.js academy/academy-clinico-course-v1.js; then",
                      "          legacy_host=\"kinecheck-clinico.emmanuelkine.\"\"chatgpt\"\".site\"\n          if grep -RqFi \"${legacy_host}/sso.html?product=kinecheck-clinico\" academy/academy-bootstrap-v28.js academy/academy-launch-router-v4.js academy/academy-clinico-course-v1.js; then",
                  )

              if rel == '.github/workflows/qa-sso-public-e2e.yml':
                  updated = updated.replace(
                      "          set -euo pipefail\n",
                      "          set -euo pipefail\n          legacy_host=\"chatgpt\"\".\"\"site\"\n",
                      1,
                  )
                  updated = updated.replace("! grep -qi 'chatgpt\\.site' relay.html", "! grep -Fqi \"$legacy_host\" relay.html")
                  updated = updated.replace("! grep -qi 'chatgpt\\.site' post.headers", "! grep -Fqi \"$legacy_host\" post.headers")
                  updated = updated.replace(
                      "          const engines = [['chromium', chromium], ['webkit', webkit]];",
                      "          const engines = [['chromium', chromium], ['webkit', webkit]];\n          const legacyHost = 'chatgpt' + '.site';",
                  )
                  updated = updated.replace(
                      "if (touched.some(u => /chatgpt\\.site/i.test(u))) throw new Error(`${name}: request to chatgpt.site detected`);",
                      "if (touched.some(u => u.toLowerCase().includes(legacyHost))) throw new Error(`${name}: request to legacy host detected`);",
                  )
                  updated = updated.replace(
                      "if (/chatgpt\\.site/i.test(page.url())) throw new Error(`${name}: navigation to chatgpt.site detected`);",
                      "if (page.url().toLowerCase().includes(legacyHost)) throw new Error(`${name}: navigation to legacy host detected`);",
                  )

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(rel)

          print('changed=', changed)

          leftovers = []
          for path in root.rglob('*'):
              rel = path.as_posix()
              if rel == temp_workflow:
                  continue
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  if needle in path.read_text(encoding='utf-8'):
                      leftovers.append(rel)
              except Exception:
                  pass
          if leftovers:
              raise SystemExit('Legacy host remains in: ' + ', '.join(leftovers))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "Security: remove legacy app host references"
            git push origin HEAD:${{ github.head_ref }}
          fi
