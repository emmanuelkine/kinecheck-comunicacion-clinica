name: Tester Visual Audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-public-v1.css'
      - 'kinecheck/**'
      - 'profesionales/**'
      - 'estudiantes/**'
      - 'productos/**'
      - 'recursos/**'
      - 'demo/**'
      - 'academy/**'
      - 'tests/tester-visual-audit.spec.mjs'
      - '.github/workflows/tester-visual-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'home-public-v1.css'
      - 'kinecheck/**'
      - 'profesionales/**'
      - 'estudiantes/**'
      - 'productos/**'
      - 'recursos/**'
      - 'demo/**'
      - 'academy/**'
      - 'tests/tester-visual-audit.spec.mjs'
      - '.github/workflows/tester-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve exact checkout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kinecheck-http.log 2>&1 &
          echo $! > /tmp/kinecheck-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/academy/ > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/kinecheck-http.log
          exit 1
      - name: Audit exact checkout visual contracts
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          npx playwright test tests/tester-visual-audit.spec.mjs --browser=${{ matrix.browser }} --reporter=line 2>&1 | tee visual-audit-${{ matrix.browser }}.log
      - name: Upload visual audit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-audit-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            visual-audit-${{ matrix.browser }}.log
            test-results/**
          if-no-files-found: warn
          retention-days: 7
