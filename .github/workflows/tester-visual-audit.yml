name: Tester Visual Audit

on:
  pull_request:
    paths:
      - 'academy/**'
      - 'tests/tester-visual-audit.spec.mjs'
      - '.github/workflows/tester-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Audit production Academy visual contracts
        env:
          BASE_URL: https://kinecheck.cl
        run: npx playwright test tests/tester-visual-audit.spec.mjs --browser=${{ matrix.browser }}
