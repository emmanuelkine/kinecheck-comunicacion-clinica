name: Temporary navigation dedupe

on:
  push:
    branches:
      - fix/academy-navegacion-estable-clean

permissions:
  contents: write

jobs:
  patch-navigation:
    if: ${{ !contains(github.event.head_commit.message, '[nav-dedupe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/academy-navegacion-estable-clean

      - name: Apply deterministic navigation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('academy/academy-kinecheck-v4.js')
          source = path.read_text(encoding='utf-8')

          old_state = '  let suppressNextHashEvent = false;'
          if source.count(old_state) != 1:
              raise SystemExit('Expected navigation state declaration was not found exactly once.')
          source = source.replace(old_state, '  let lastHandledLocation = "";', 1)

          def replace_between(text, start_marker, end_marker, replacement):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Start marker not found: {start_marker}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'End marker not found: {end_marker}')
              return text[:start] + replacement + text[end:]

          source = replace_between(
              source,
              '  function applyHash(next, historyMode = "replace") {',
              '  function activateView(view, options = {}) {',
              '''  function currentLocationKey() {
            return `${location.pathname}${location.search}${location.hash}`;
          }

          function markLocationHandled() {
            lastHandledLocation = currentLocationKey();
          }

          function applyHash(next, historyMode = "replace") {
            const targetHash = `#${next}`;
            if (location.hash === targetHash) {
              markLocationHandled();
              return;
            }
            if (historyMode === "push") {
              history.pushState(null, "", targetHash);
            } else {
              history.replaceState(null, "", targetHash);
            }
            markLocationHandled();
          }

          ''',
          )

          source = replace_between(
              source,
              '  function restoreViewFromLocation(options = {}) {',
              '  function markEvidenceSection() {',
              '''  function restoreViewFromLocation(options = {}) {
            const currentHash = String(location.hash || "");
            if (isAuthFragment(currentHash)) {
              markLocationHandled();
              return;
            }

            const raw = currentHash.replace(/^#/, "").toLowerCase();
            const legacyAliases = new Set(["productos", "recursos", "evidencia-semanal", "mis-cursos", "cuenta", "mi-cuenta"]);
            const isValidHash = VIEW_NAMES.has(raw) || legacyAliases.has(raw);

            if (!isValidHash) {
              if (location.hash !== "#inicio") {
                history.replaceState(null, "", "#inicio");
              }
              activateView("inicio", { ...options, updateHash: false, historyMode: options.historyMode || "replace" });
              markLocationHandled();
              return;
            }

            const next = normalizedView(currentHash);
            const targetHash = `#${next}`;
            if (location.hash !== targetHash) {
              history.replaceState(null, "", targetHash);
            }

            activateView(next, { ...options, updateHash: false, historyMode: options.historyMode || "replace" });
            markLocationHandled();
          }

          function handleLocationNavigation(source) {
            if (currentLocationKey() === lastHandledLocation) return;
            if (!parseRecoveryCallback()) {
              restoreViewFromLocation({ updateHash: false, source });
            } else {
              markLocationHandled();
            }
          }

          ''',
          )

          source = replace_between(
              source,
              '    window.addEventListener("hashchange", () => {',
              '    $("#kc-home-continue")?.addEventListener("click", () => {',
              '''    window.addEventListener("hashchange", () => {
              handleLocationNavigation("hashchange");
            });

            window.addEventListener("popstate", () => {
              handleLocationNavigation("popstate");
            });

          ''',
          )

          if 'suppressNextHashEvent' in source:
              raise SystemExit('Legacy suppression flag remains after patch.')
          for required in ('lastHandledLocation', 'handleLocationNavigation("hashchange")', 'handleLocationNavigation("popstate")'):
              if required not in source:
                  raise SystemExit(f'Required navigation safeguard missing: {required}')

          path.write_text(source, encoding='utf-8')
          PY

          node --check academy/academy-kinecheck-v4.js

      - name: Commit patched navigation
        shell: bash
        run: |
          if git diff --quiet -- academy/academy-kinecheck-v4.js; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy/academy-kinecheck-v4.js
          git commit -m "fix(academy): deduplicar eventos de historial [nav-dedupe]"
          git push origin HEAD:fix/academy-navegacion-estable-clean
