name: Temporary access validator update

on:
  push:
    branches:
      - test/actualizar-validadores-acceso-final5

permissions:
  contents: write

jobs:
  update-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[validator-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/actualizar-validadores-acceso-final5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update final release expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-ecosystem-access.mjs')
          source = path.read_text(encoding='utf-8')
          old = 'check("Opener publica rutas final4", /20260806-final4/.test(opener));'
          new = 'check("Opener publica rutas final5", /20260806-final5/.test(opener));'
          if source.count(old) != 1:
              raise SystemExit('Expected final4 validator was not found exactly once.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run Academy access healthcheck
        run: node academy/verify-kinecheck-access.mjs

      - name: Run ecosystem access policy
        run: node scripts/validate-ecosystem-access.mjs

      - name: Commit validated test updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy/verify-kinecheck-access.mjs scripts/validate-ecosystem-access.mjs
          git commit -m "test(access): alinear validadores con opener final5 [validator-update]"
          git push origin HEAD:test/actualizar-validadores-acceso-final5
