name: Validar precios y respaldo comercial

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "profesionales/index.html"
      - "estudiantes/index.html"
      - "recupera/index.html"
      - "commercial-prices-cl.json"
      - ".github/workflows/validate-commercial-pricing.yml"
  pull_request:
    paths:
      - "index.html"
      - "profesionales/index.html"
      - "estudiantes/index.html"
      - "recupera/index.html"
      - "commercial-prices-cl.json"
      - ".github/workflows/validate-commercial-pricing.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar fuente comercial histórica de Chile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const prices = JSON.parse(fs.readFileSync('commercial-prices-cl.json', 'utf8'));
          const expected = {
            'kinecheck-clinico': { price: 39990, display: '$39.990', term: '12 meses' },
            'kinecheck-estudiante': { price: 14990, display: '$14.990', term: '12 meses' },
            'kinecheck-recupera': { price: 9990, display: '$9.990', term: '3 meses' },
            'comunicacion-clinica': { price: 19900, display: '$19.900', term: '12 meses' },
            'mas-alla-del-dolor': { price: 39990, display: '$39.990', term: '12 meses' },
            'evidencia-aplicada': { price: 29990, display: '$29.990', term: '12 meses' },
            'traumatologia-ortopedia-clinica': { price: 35900, display: '$35.900', term: '12 meses' },
            'dolor-lumbar-persistente': { price: 39990, display: '$39.990', term: '12 meses' },
            'pack-estudiante': { price: 49900, display: '$49.900', term: '12 meses' },
          };
          if (prices.country !== 'Chile' || prices.currency !== 'CLP') throw new Error('País o moneda incorrectos.');
          const rows = prices.products || {};
          if (Object.keys(rows).length !== 9) throw new Error('Deben existir exactamente nueve productos en la fuente comercial histórica.');
          for (const [slug, expectedRow] of Object.entries(expected)) {
            const row = rows[slug];
            if (!row) throw new Error(`Falta ${slug} en commercial-prices-cl.json.`);
            for (const [field, value] of Object.entries(expectedRow)) {
              if (row[field] !== value) throw new Error(`${field} incorrecto para ${slug}.`);
            }
          }
          if (rows['pack-estudiante']?.saving !== 5080 || rows['pack-estudiante']?.discountPercent !== 9.2) {
            throw new Error('El ahorro verificado del pack es incorrecto.');
          }
          console.log('Fuente comercial histórica: 9/9 productos CLP verificados. Recupera no se expone públicamente mientras esté pausado.');
          NODE

      - name: Validar precios visibles y Recupera pausado
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pages = {
            home: fs.readFileSync('index.html', 'utf8'),
            profesionales: fs.readFileSync('profesionales/index.html', 'utf8'),
            estudiantes: fs.readFileSync('estudiantes/index.html', 'utf8'),
            recupera: fs.readFileSync('recupera/index.html', 'utf8'),
          };

          // La portada no duplica precios. Recupera tampoco debe mostrar precio ni
          // checkout mientras permanezca Próximamente por revisión de privacidad.
          const expectedCounts = { home: 0, profesionales: 5, estudiantes: 4, recupera: 0 };
          for (const [pageName, expected] of Object.entries(expectedCounts)) {
            const blocks = (pages[pageName].match(/class="price"/g) || []).length;
            if (blocks !== expected) throw new Error(`${pageName}: se esperaban ${expected} bloques de precio y hay ${blocks}.`);
          }

          const products = [
            ['profesionales', 'KineCheck Clínico', '$39.990 CLP', 'Acceso por 12 meses', 'L106791841D'],
            ['profesionales', 'Dolor Lumbar Persistente', '$39.990 CLP', 'Acceso por 12 meses', 'W107198798E'],
            ['profesionales', 'Comunicación Clínica', '$19.900 CLP', 'Acceso por 12 meses', 'T106883983U'],
            ['profesionales', 'Más allá del Dolor', '$39.990 CLP', 'Acceso por 12 meses', 'W106888386Q'],
            ['profesionales', 'Evidencia Aplicada', '$29.990 CLP', 'Acceso por 12 meses', 'F106921972I'],
            ['profesionales', 'Traumatología y Ortopedia Clínica', '$35.900 CLP', 'Acceso por 12 meses', 'B106913952R'],
            ['estudiantes', 'KineCheck Estudiante', '$14.990 CLP', 'Acceso por 12 meses', 'G106801166S'],
            ['estudiantes', 'Pack KineCheck Estudiante', '$49.900 CLP', 'Acceso por 12 meses', 'Q106891608M'],
            ['estudiantes', 'Dolor Lumbar Persistente', '$39.990 CLP', 'Acceso por 12 meses', 'W107198798E'],
            ['estudiantes', 'Comunicación Clínica', '$19.900 CLP', 'Acceso por 12 meses', 'T106883983U'],
            ['estudiantes', 'Evidencia Aplicada', '$29.990 CLP', 'Acceso por 12 meses', 'F106921972I'],
          ];

          for (const [pageName, product, price, term, checkoutId] of products) {
            const html = pages[pageName];
            for (const token of [product, price, term, checkoutId]) {
              if (!html.includes(token)) throw new Error(`${pageName}: falta ${token} para ${product}.`);
            }
          }

          const recovery = pages.recupera;
          if (!recovery.includes('PRÓXIMAMENTE')) throw new Error('Recupera no está marcado como Próximamente.');
          if (!recovery.includes('No se encuentra disponible para compra ni para registro de datos.')) {
            throw new Error('Recupera no declara el bloqueo de compra/registro.');
          }
          for (const forbidden of ['$9.990', 'Acceso por 3 meses', 'P106806251E', 'Comprar en Hotmart']) {
            if (recovery.includes(forbidden)) throw new Error(`Recupera expone contenido comercial prohibido mientras está pausado: ${forbidden}`);
          }

          if (Object.values(pages).some((html) => html.includes('$59.900'))) {
            throw new Error('Se conserva el precio anterior del pack.');
          }
          console.log('Precios visibles verificados; Recupera permanece fuera de comercio público.');
          NODE

      - name: Validar correcciones de auditoría pública
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['index.html', 'profesionales/index.html', 'estudiantes/index.html', 'recupera/index.html'];
          const pages = Object.fromEntries(files.map((file) => [file, fs.readFileSync(file, 'utf8')]));

          for (const [file, html] of Object.entries(pages)) {
            if (html.includes('?v=20260806-final5')) throw new Error(`${file}: conserva parámetro interno de Academy.`);
            if (html.includes('kinecheck-mark.svg" alt=""')) throw new Error(`${file}: conserva logo sin texto alternativo.`);
            if (!html.includes('alt="KineCheck"')) throw new Error(`${file}: falta alt="KineCheck".`);
          }

          if (!pages['index.html'].includes('href="mailto:soporte.kinecheck@gmail.com"')) {
            throw new Error('La home no contiene el enlace de soporte funcional.');
          }
          if (pages['index.html'].includes('href="#" data-support-email')) {
            throw new Error('La home conserva el enlace de soporte roto.');
          }
          for (const file of ['profesionales/index.html', 'estudiantes/index.html']) {
            if (pages[file].includes('>Ver curso<')) throw new Error(`${file}: conserva CTA “Ver curso” hacia checkout.`);
          }
          if (!pages['estudiantes/index.html'].includes('<span class="tag">RECOMENDADO</span>')) {
            throw new Error('Estudiantes no usa el badge unificado RECOMENDADO.');
          }
          for (const file of ['profesionales/index.html', 'estudiantes/index.html', 'recupera/index.html']) {
            if (!pages[file].includes('<small>SALUD MUSCULOESQUELÉTICA</small>')) throw new Error(`${file}: footer de marca no unificado.`);
          }
          if (!pages['recupera/index.html'].includes('PRÓXIMAMENTE')) {
            throw new Error('Recupera debe permanecer Próximamente.');
          }
          console.log('Hallazgos de auditoría pública cubiertos por CI.');
          NODE

      - name: Impedir prueba social cuantitativa inventada
        run: |
          ! grep -Eqi 'usado por [0-9]+|más de [0-9]+ usuarios|testimonio ficticio' index.html profesionales/index.html estudiantes/index.html recupera/index.html
