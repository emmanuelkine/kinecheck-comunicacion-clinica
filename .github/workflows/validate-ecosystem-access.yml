name: Validate Ecosystem Access

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * *"
  push:
    branches: [main]
    paths:
      - "academy/**"
      - "auth-gate.js"
      - "auth.css"
      - "comunicacion-clinica.html"
      - "secure-index.html"
      - "traumatologia/**"
      - "kinecheck-clinico-curso/**"
      - "kinecheck-clinico-guia/**"
      - "supabase/functions/course-key/**"
      - "scripts/validate-ecosystem-access-v2.mjs"
      - ".github/workflows/validate-ecosystem-access.yml"

permissions:
  contents: read

concurrency:
  group: validate-ecosystem-access
  cancel-in-progress: true

jobs:
  access-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ecosystem repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate current course and application access routes
        run: node scripts/validate-ecosystem-access-v2.mjs

      - name: Upload access evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kinecheck-ecosystem-access-${{ github.run_id }}
          path: ecosystem-access-report.json
          if-no-files-found: warn
          retention-days: 30
