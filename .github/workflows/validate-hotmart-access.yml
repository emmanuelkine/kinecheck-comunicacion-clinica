name: Validate Hotmart access consistency

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seeds/**"
      - "supabase/functions/hotmart-webhook/**"
      - "docs/hotmart/**"
      - "tests/hotmart-access-regression.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-hotmart-access.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/seeds/**"
      - "supabase/functions/hotmart-webhook/**"
      - "docs/hotmart/**"
      - "tests/hotmart-access-regression.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-hotmart-access.yml"

permissions:
  contents: read

jobs:
  hotmart-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:hotmart
