name: Validate KineCheck Clinico Course

on:
  workflow_dispatch:
  push:
    paths:
      - 'kinecheck-clinico-curso/**'
      - 'kinecheck-clinico-guia/**'
      - 'supabase/functions/protected-course-key/**'
      - 'academy/academy-bootstrap-v28.js'
      - 'academy/academy-clinico-course-v1.js'
      - 'academy/academy-launch-router-v4.js'
      - 'academy/academy-open-v6.js'
      - 'academy/academy-enhancements.js'
      - 'productos/product-clinico-reposition-v1.js'
      - '_headers'
      - '.github/workflows/validate-kinecheck-clinico-course.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public JavaScript syntax
        run: |
          node --check kinecheck-clinico-curso/config.js
          node --check kinecheck-clinico-guia/config.js
          node --check kinecheck-clinico-guia/guide.js
          node --check kinecheck-clinico-guia/gate.js
          node --check academy/academy-clinico-course-v1.js
          node --check academy/academy-bootstrap-v28.js
          node --check academy/academy-launch-router-v4.js
          node --check academy/academy-open-v6.js
          node --check academy/academy-enhancements.js
          node --check productos/product-clinico-reposition-v1.js
      - name: Validate private premium-content boundary
        run: |
          test ! -e kinecheck-clinico-curso/course-data.js
          test ! -e kinecheck-clinico-curso/renderer.js
          grep -q 'courseKeyFunction: "protected-course-key"' kinecheck-clinico-curso/config.js
          grep -q 'kinecheck-clinico-curso/course-data.js' supabase/functions/protected-course-key/index.ts
          grep -q 'kinecheck-clinico-curso/renderer.js' supabase/functions/protected-course-key/index.ts
          grep -q 'from("course-assets")' supabase/functions/protected-course-key/index.ts
          if grep -Rqs 'https://kinecheck.cl/kinecheck-clinico-curso/course-data.js' supabase/functions; then
            echo 'A public Clinico payload URL is still referenced by server functions.' >&2
            exit 1
          fi
      - name: Validate guide positioning and privacy
        run: |
          grep -q 'No reemplaces tu ficha clínica' kinecheck-clinico-guia/index.html
          grep -q 'No ingreses nombre, RUT' kinecheck-clinico-guia/index.html
          grep -q 'No constituye ficha clínica' kinecheck-clinico-guia/index.html
          grep -q 'sessionStorage' kinecheck-clinico-guia/gate.js
          grep -q 'courseSlug: CONFIG.accessSlug' kinecheck-clinico-guia/gate.js
          legacy_host="kinecheck-clinico.emmanuelkine.""chatgpt"".site"
          if grep -RqFi "${legacy_host}/sso.html?product=kinecheck-clinico" academy/academy-bootstrap-v28.js academy/academy-launch-router-v4.js academy/academy-clinico-course-v1.js; then
            echo 'Legacy Clinico route is still active' >&2
            exit 1
          fi
          if grep -qi 'APLICACIÓN CLÍNICA' academy/academy-enhancements.js; then
            echo 'Residual application label remains for Clinico' >&2
            exit 1
          fi
          grep -q 'GUÍA COMPLEMENTARIA' academy/academy-enhancements.js
          grep -q 'CURSO PROFESIONAL' academy/academy-enhancements.js
          grep -q '/kinecheck-clinico-guia/' academy/academy-open-v6.js
          grep -q '/kinecheck-clinico-guia/' _headers
      - name: Validate public shells
        run: |
          for attempt in 1 2 3 4 5; do
            course_status=$(curl -sS -o /tmp/course.html -w '%{http_code}' https://kinecheck.cl/kinecheck-clinico-curso/ || true)
            guide_status=$(curl -sS -o /tmp/guide.html -w '%{http_code}' https://kinecheck.cl/kinecheck-clinico-guia/ || true)
            if [ "$course_status" = '200' ] && [ "$guide_status" = '200' ]; then break; fi
            sleep 12
          done
          test "$course_status" = '200'
          test "$guide_status" = '200'
          grep -q 'El curso es el centro del producto' /tmp/course.html
          grep -q 'Guía complementaria de análisis clínico' /tmp/guide.html
