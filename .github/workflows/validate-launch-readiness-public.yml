name: Validar preparación pública multidispositivo

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "home-public-v1.css"
      - "kinecheck/**"
      - "profesionales/index.html"
      - "estudiantes/index.html"
      - "recupera/index.html"
      - "ayuda/**"
      - "bienvenida/**"
      - "beta/**"
      - "soporte/**"
      - "legal/**"
      - "404.html"
      - "site.webmanifest"
      - "home.js"
      - "metrics-v1.js"
      - "productos/**"
      - "academy/**"
      - "platform/**"
      - "tests/public-home-source-regression.test.mjs"
      - "tests/recupera-commerce-state.test.mjs"
      - "tests/public-internal-markers.test.mjs"
      - "tests/public-canonical-readiness.spec.mjs"
      - "tests/product-overflow-diagnostic.mjs"
      - ".github/workflows/validate-launch-readiness-public.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home-public-v1.css"
      - "kinecheck/**"
      - "profesionales/index.html"
      - "estudiantes/index.html"
      - "recupera/index.html"
      - "ayuda/**"
      - "bienvenida/**"
      - "beta/**"
      - "soporte/**"
      - "legal/**"
      - "404.html"
      - "site.webmanifest"
      - "home.js"
      - "metrics-v1.js"
      - "productos/**"
      - "academy/**"
      - "platform/**"
      - "tests/public-home-source-regression.test.mjs"
      - "tests/recupera-commerce-state.test.mjs"
      - "tests/public-internal-markers.test.mjs"
      - "tests/public-canonical-readiness.spec.mjs"
      - "tests/product-overflow-diagnostic.mjs"
      - ".github/workflows/validate-launch-readiness-public.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-launch-readiness-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar contratos y regresiones públicas de lanzamiento
        run: |
          node --test \
            tests/public-home-source-regression.test.mjs \
            tests/recupera-commerce-state.test.mjs \
            tests/public-internal-markers.test.mjs
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Validar PR contra el checkout exacto
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kinecheck-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node tests/product-overflow-diagnostic.mjs
          NO_JS=1 BASE_URL=http://127.0.0.1:4173 node tests/product-overflow-diagnostic.mjs
          BASE_URL=http://127.0.0.1:4173 node tests/public-canonical-readiness.spec.mjs
      - name: Validar origen directo de Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://kinecheck-comunicacion-clinica.pages.dev
        run: |
          for attempt in $(seq 1 12); do
            echo "Cloudflare Pages intento ${attempt}/12"
            if node tests/public-canonical-readiness.spec.mjs; then
              echo "Origen directo de Cloudflare Pages aprobado." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Diagnosticar overflow móvil del dominio público
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://kinecheck.cl
        run: |
          node tests/product-overflow-diagnostic.mjs
          NO_JS=1 node tests/product-overflow-diagnostic.mjs
      - name: Esperar publicación y validar dominio kinecheck.cl
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://kinecheck.cl
        run: |
          for attempt in $(seq 1 12); do
            echo "Dominio kinecheck.cl intento ${attempt}/12"
            if node tests/public-canonical-readiness.spec.mjs; then
              echo "QA pública canónica multidispositivo aprobada en kinecheck.cl." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
