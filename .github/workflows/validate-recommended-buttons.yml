name: Validate Academy Product Buttons

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'metrics-v1.js'
      - 'academy/academy-open-v6.js'
      - 'academy/academy-owned-native-bridge-v1.js'
      - 'academy/academy-recommended-buttons-fix.js'
      - 'academy/academy-brand-identity.js'
      - 'academy/academy-learning-path-v4.js'
      - 'academy/academy-kinecheck-v4.js'
      - 'academy/academy-v39.js'
      - 'academy/app-sso-relay.html'
      - 'academy/app-sso-relay.js'
      - 'academy/mi-kinecheck-v1.js'
      - 'academy/mi-kinecheck-simplify-v2.js'
      - 'tests/recommended-buttons.spec.mjs'
      - 'tests/owned-buttons.spec.mjs'
      - 'tests/live-academy-runtime.spec.mjs'
      - 'tests/app-sso-relay.spec.mjs'
      - '.github/workflows/validate-recommended-buttons.yml'
  push:
    branches: [main]
    paths:
      - 'metrics-v1.js'
      - 'academy/academy-open-v6.js'
      - 'academy/academy-owned-native-bridge-v1.js'
      - 'academy/academy-recommended-buttons-fix.js'
      - 'academy/academy-brand-identity.js'
      - 'academy/academy-learning-path-v4.js'
      - 'academy/academy-kinecheck-v4.js'
      - 'academy/academy-v39.js'
      - 'academy/app-sso-relay.html'
      - 'academy/app-sso-relay.js'
      - 'academy/mi-kinecheck-v1.js'
      - 'academy/mi-kinecheck-simplify-v2.js'
      - 'tests/recommended-buttons.spec.mjs'
      - 'tests/owned-buttons.spec.mjs'
      - 'tests/live-academy-runtime.spec.mjs'
      - 'tests/app-sso-relay.spec.mjs'
      - '.github/workflows/validate-recommended-buttons.yml'

permissions:
  contents: read

concurrency:
  group: validate-academy-product-buttons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-buttons:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Serve exact pull request checkout
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kinecheck-http.log 2>&1 &
          echo $! >/tmp/kinecheck-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/academy/ >/dev/null

      - name: Wait for production deployment
        if: github.event_name == 'push'
        run: sleep 60

      - name: Test recommendation and owned product buttons
        run: npx playwright test tests/recommended-buttons.spec.mjs tests/owned-buttons.spec.mjs --reporter=line

      - name: Test Academy runtime and app relay in Chromium
        id: chromium_gate
        if: always()
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://kinecheck.cl' }}
        run: npx playwright test tests/live-academy-runtime.spec.mjs tests/app-sso-relay.spec.mjs --browser=chromium --reporter=line

      - name: Test Academy runtime and app relay in WebKit
        id: webkit_gate
        if: always()
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://kinecheck.cl' }}
        run: npx playwright test tests/live-academy-runtime.spec.mjs tests/app-sso-relay.spec.mjs --browser=webkit --reporter=line

      - name: Enforce Chromium and WebKit gates
        if: always()
        env:
          CHROMIUM_OUTCOME: ${{ steps.chromium_gate.outcome }}
          WEBKIT_OUTCOME: ${{ steps.webkit_gate.outcome }}
        run: |
          echo "Chromium: ${CHROMIUM_OUTCOME}"
          echo "WebKit: ${WEBKIT_OUTCOME}"
          test "${CHROMIUM_OUTCOME}" = "success"
          test "${WEBKIT_OUTCOME}" = "success"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-product-buttons-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
