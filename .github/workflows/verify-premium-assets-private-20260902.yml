name: One-off verify private premium assets

on:
  push:
    branches:
      - ops/private-course-assets-20260902
    paths:
      - .github/workflows/verify-premium-assets-private-20260902.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production boundary
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            'https://kinecheck.cl/kinecheck-clinico-curso/course-data.js'
            'https://kinecheck.cl/kinecheck-clinico-curso/renderer.js'
            'https://kinecheck.cl/academy/dolor-lumbar-persistente/data-v6.js'
            'https://kinecheck.cl/academy/dolor-lumbar-persistente/app-v6.js'
          )
          shells=(
            'https://kinecheck.cl/kinecheck-clinico-curso/'
            'https://kinecheck.cl/academy/dolor-lumbar-persistente/'
          )

          ok=0
          for attempt in $(seq 1 12); do
            echo "Attempt $attempt"
            ok=1
            for url in "${assets[@]}"; do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              echo "asset $code $url"
              if [ "$code" = '200' ] || [ "$code" = '000' ]; then ok=0; fi
            done
            for url in "${shells[@]}"; do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              echo "shell $code $url"
              if [ "$code" != '200' ]; then ok=0; fi
            done
            clinico_edge=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST 'https://eqhcdclyeoapmqtlduwf.supabase.co/functions/v1/protected-course-key' -H 'content-type: application/json' --data '{"courseSlug":"kinecheck-clinico-curso"}' || true)
            dlp_edge=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST 'https://eqhcdclyeoapmqtlduwf.supabase.co/functions/v1/dolor-lumbar-course-key' -H 'content-type: application/json' --data '{"courseSlug":"dolor-lumbar-persistente"}' || true)
            echo "protected-course-key unauthenticated: $clinico_edge"
            echo "dolor-lumbar-course-key unauthenticated: $dlp_edge"
            case "$clinico_edge" in 401|403) ;; *) ok=0;; esac
            case "$dlp_edge" in 401|403) ;; *) ok=0;; esac
            if [ "$ok" = '1' ]; then break; fi
            sleep 10
          done
          test "$ok" = '1'
