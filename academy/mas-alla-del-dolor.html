<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#11152b">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://emmanuelkine.github.io; connect-src 'self' https://eqhcdclyeoapmqtlduwf.supabase.co; img-src 'self' data: blob: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'">
  <title>Más allá del dolor | KineCheck</title>
  <link rel="stylesheet" href="https://emmanuelkine.github.io/mas-alla-del-dolor/assets/course.css?v=20260811-sameorigin1">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17162a;color:#f7f8ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(64,208,207,.12),transparent 34%),linear-gradient(180deg,#202238 0%,#141321 100%)}
    [hidden]{display:none!important}.kc-access{min-height:100vh;display:grid;place-items:center;padding:28px 18px}.kc-card{width:min(760px,100%);padding:34px;border:1px solid rgba(64,208,207,.28);border-radius:28px;background:#090f25;box-shadow:0 30px 80px rgba(0,0,0,.28)}
    .kc-brand{display:flex;align-items:center;gap:14px;margin-bottom:52px}.kc-mark{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#ff8f76,#ffd25d);color:#10152b;font-size:25px;font-weight:900}.kc-brand strong{display:block;font-size:24px}.kc-brand span{display:block;margin-top:3px;color:#aab6d8;font-size:17px;font-weight:700}
    .kc-eyebrow{color:#ee91ce;font-size:15px;font-weight:900;letter-spacing:.2em}.kc-card h1{margin:20px 0 12px;font-size:clamp(42px,8vw,68px);line-height:1.02;font-weight:500}.kc-subtitle{margin:0;color:#b9c4e4;font-size:clamp(20px,4vw,29px);line-height:1.35}
    .kc-status{display:grid;justify-items:center;gap:18px;margin:70px 0 30px;text-align:center;color:#c5d0ed;font-size:20px}.kc-spinner{width:28px;height:28px;border-radius:50%;border:4px solid rgba(70,213,211,.18);border-top-color:#46d5d3;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .kc-error{margin-top:38px;padding:22px;border:1px solid rgba(255,96,142,.48);border-radius:18px;background:rgba(155,29,76,.18);color:#ffdce8;line-height:1.55}.kc-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.kc-button{min-height:50px;padding:0 20px;border:0;border-radius:14px;text-decoration:none;display:inline-grid;place-items:center;background:linear-gradient(90deg,#43d5cf,#5ea0ff);color:#071428;font-weight:900}.kc-button.secondary{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff}
    .kc-rule{margin:36px 0 0;text-align:center;color:#909cbd;font-size:14px;line-height:1.55}
    #root{min-height:100vh}
    @media(max-width:600px){.kc-access{padding:18px}.kc-card{padding:26px 22px;border-radius:22px}.kc-brand{margin-bottom:42px}.kc-card h1{font-size:46px}.kc-status{margin-top:56px}}
  </style>
  <script type="module" src="./mas-alla-del-dolor-shell-v1.js?v=20260811-sameorigin1"></script>
</head>
<body>
  <main id="kc-access" class="kc-access">
    <section class="kc-card" aria-labelledby="kc-title">
      <div class="kc-brand"><span class="kc-mark" aria-hidden="true">K</span><div><strong>KineCheck</strong><span>Curso protegido</span></div></div>
      <div class="kc-eyebrow">CURSO INTERACTIVO</div>
      <h1 id="kc-title">Más allá del dolor</h1>
      <p class="kc-subtitle">Evaluación musculoesquelética integral</p>
      <div id="kc-status" class="kc-status" role="status" aria-live="polite"><span class="kc-spinner" aria-hidden="true"></span><span id="kc-status-copy">Validando tu acceso dentro de KineCheck…</span></div>
      <div id="kc-error" class="kc-error" hidden aria-live="assertive"></div>
      <div id="kc-actions" class="kc-actions" hidden>
        <a class="kc-button" href="./#biblioteca">Volver a mi biblioteca</a>
        <button id="kc-retry" class="kc-button secondary" type="button">Reintentar</button>
      </div>
      <p class="kc-rule">Tu sesión permanece en kinecheck.cl. La licencia se valida en servidor antes de cargar el contenido.</p>
    </section>
  </main>
  <div id="root" hidden></div>
  <noscript>Necesitas activar JavaScript para acceder al curso.</noscript>
</body>
</html>
