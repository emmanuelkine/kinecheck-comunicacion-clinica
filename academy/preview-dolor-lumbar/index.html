<style>
:root{--bg:#07101d;--panel:#0e1930;--txt:#f8faff;--mut:#a8b6d0;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.065);--a:#55e6ce;--b:#6cc8ff;--v:#7c73ff;--p:#ff6fae;--o:#ffb85c;--g:#70e3a2;--shadow:0 24px 70px rgba(0,0,0,.35)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,#17335f 0,transparent 27%),radial-gradient(circle at 100% 0,#421940 0,transparent 25%),linear-gradient(145deg,#07101d,#091426 58%,#090b20);min-height:100vh;overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:330px;height:330px;border-radius:50%;filter:blur(100px);opacity:.13;z-index:-1;animation:float 12s ease-in-out infinite alternate}body:before{left:-120px;top:45%;background:var(--a)}body:after{right:-120px;bottom:-80px;background:var(--v);animation-delay:-3s}@keyframes float{to{transform:translate(80px,30px) scale(1.14)}}button,input{font:inherit}.shell{max-width:1280px;margin:auto;padding:22px 24px 96px}.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:13px 0;background:linear-gradient(to bottom,rgba(7,16,29,.96),rgba(7,16,29,.65),transparent);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;cursor:pointer}.logo{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 180deg,var(--a),var(--b),var(--v),var(--p),var(--o),var(--a));position:relative}.logo:after{content:"K";position:absolute;inset:4px;border-radius:11px;background:#091320;display:grid;place-items:center}.brand small{display:block;color:var(--mut);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.actions{display:flex;gap:8px}.btn,.primary,.choice,.step,.casebtn{border:1px solid var(--line);background:var(--glass);color:var(--txt);border-radius:15px;padding:10px 14px;cursor:pointer;transition:.2s;backdrop-fil lock}.sidehead small{color:var(--mut)}.lessonlink{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:14px;color:#bac5dd;cursor:pointer}.lessonlink:hover{background:rgba(255,255,255,.06)}.lessonlink.active{background:linear-gradient(135deg,rgba(85,230,206,.14),rgba(124,115,255,.09));border:1px solid rgba(85,230,206,.16);color:white}.dot{min-width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:10px;font-weight:900}.lessonlink.done .dot{background:var(--g);color:#061019}.lessonlink span{font-size:12px;line-height:1.35}.lesson{padding:29px}.crumb{color:var(--a);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:900}.lesson h1{font-size:clamp(37px,4.6vw,60px);line-height:.98;letter-spacing:-.055em;margin:11px 0 13px}.lead{max-width:850px;color:#c4cee2;font-size:17px;line-height:1.65}.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:23px 0}.goal{padding:15px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.045);font-size:12px;color:#d4dced;line-height:1.45}.goal b{display:block;color:white;margin-bottom:4px}.block{margin:26px 0}.block h2{font-size:24px;letter-spacing:-.03em}.callout{border-left:3px solid var(--cc);padding:17px 19px;border-radius:0 16px 16px 0;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:#cad4e7;line-height:1.65}.callout b{display:block;color:white;margin-bottom:5px}.check{margin:25px 0;padding:20px;border-radius:21px;border:1px solid rgba(124,115,255,.27);background:linear-gradient(135deg,rgba(124,115,255,.12),rgba(255,111,174,.055))}.check h3{margin-top:10px}.choice{display:block;width:100%;text-align:left;margin:7px 0;background:rgba(255,255,255,.04)}.choice.correct{border-color:var(--g);background:rgba(112,227,162,.11)}.choice.wrong{border-color:var(--p);background:rgba(255,111,174,.1)}.feedback{min-height:17px;color:#d7dfef;font-size:12px;margin-top:8px}.lessonnav{display:flex;justify-content:space-between;gap:10px;margin-top:32px;padding-top:19px;border-top:1px solid var(--line)}.stepper{display:grid;grid-template-columns:repeat(11,minmax(82px,1fr));gap:7px;overflow:auto;padding:5px 0 10px}.step{min-width:82px;padding:11px 8px}.step.active{transform:translateY(-3px);background:linear-gradient(135deg,rgba(85,230,206,.2),rgba(124,115,255,.16));border-color:rgba(85,230,206,.45)}.step b{display:block;font-size:18px}.step small{font-size:9px;color:var(--mut)}.stepdetail{padding:19px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.045);min-height:120px}.stepdetail h3{margin:0 0 6px}.stepdetail p{margin:0;color:#c6d0e3;line-height:1.6}.case{display:grid;grid-template-columns:.85fr 1.15fr;gap:12px}.patient,.casepanel{padding:19px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04)}.avatar{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--b),var(--v));display:grid;place-items:center;color:#061019;font-size:35px;margin-bottom:14px}.patient p,.caseresult{color:var(--mut);font-size:13px;line-height:1.55}.casebtn{display:block;width:100%;text-align:left;margin:6px 0;background:rgba(255,255,255,.04)}.foot{margin-top:40px;padding-top:17px;border-top:1px solid var(--line);color:#8491aa;font-size:11px}.modal{position:fixed;inset:0;z-index:90;background:rgba(2,7,17,.76);backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px}.modalcard{width:min(760px,100%);max-height:82vh;overflow:auto;background:#101a32;border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:var(--shadow)}.search{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:white;border-radius:14px;padding:14px;outline:none}.result{padding:11px;border-radius:13px;background:rgba(255,255,255,.04);margin-top:7px;cursor:pointer}.result:hover{background:rgba(255,255,255,.08)}.result small{display:block;color:var(--mut);margin-top:2px}.mobile{display:none}@media(max-width:950px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:repeat(2,1fr)}.course{grid-template-columns:1fr}.sidebar{display:none}.goals{grid-template-columns:1fr}.case{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:12px 13px 86px}.brand .words{display:none}.actions .searchbtn{display:none}.hero{padding-top:21px}.hero-main{padding:24px}.hero h1{font-size:46px}.hero p{font-size:15px}.grid,.tools{grid-template-columns:1fr}.lesson{padding:20px}.lesson h1{font-size:39px}.mobile{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;padding:8px;border-radius:19px;background:rgba(12,22,48,.91);border:1px solid var(--line);backdrop-filter:blur(18px);justify-content:space-around;box-shadow:var(--shadow)}.mobile button{background:none;border:0;color:#c4cde1;font-size:11px;padding:8px}}

<body><div id="app"></div><div id="toast" style="position:fixed;right:18px;bottom:18px;z-index:120;background:white;color:#07101d;padding:12px 15px;border-radius:13px;font-weight:900;box-shadow:0 20px 60px rgba(0,0,0,.3);opacity:0;transform:translateY(80px);transition:.3s"></div>
<script>
const C={a:'#55e6ce',b:'#6cc8ff',v:'#7c73ff',p:'#ff6fae',o:'#ffb85c',g:'#70e3a2'};
const M=[
['Reencuadrar el dolor lumbar',C.a,'Dolor, función, historia y contexto antes de reducir el problema a una estructura.',[
['Más que una estructura','Integra historia, función y contexto para comprender el problema más allá de una etiqueta diagnóstica.',['Distinguir diagnóstico y pronóstico','Reconstruir la historia','Relacionar dolor y función'],['El diagnóstico no explica por sí solo la evolución.','Las actividades perdidas y evitadas ayudan a definir la prioridad clínica.','Recurrencias, mejorías y cambios de actividad forman parte de la hipótesis.']],
['Modelo biopsicosocial aplicado','Biología, cogniciones, emociones y contexto se combinan para decidir qué variables son modificables.',['Integrar dominios','Evitar dicotomías','Traducir factores a decisiones'],['Capacidad, carga, sueño y respuesta al movimiento siguen importando.','Creencias, miedo, expectativas y confianza pueden modificar conducta.','Trabajo, roles y apoyo pueden facilitar o dificultar recuperación.']],
['Curso y evolución','La trayectoria se entiende como un proceso dinámico que necesita seguimiento.',['Construir línea de tiempo','Reconocer recurrencia','Definir seguimiento'],['Registrar episodios y estrategias previas ayuda a comprender el curso.','Dos personas con diagnósticos similares pueden tener trayectorias diferentes.','Reevaluar exige decidir qué variable debería cambiar si el plan funciona.']]]],
['Historia, pronóstico y riesgo',C.b,'Entrevista clínica, triage, factores pronósticos y variables modificables.',[
['Entrevista con dirección','La entrevista debe producir hipótesis y prioridades, no una acumulación de preguntas.',['Ordenar anamnesis','Explorar expectativas','Elegir qué examinar'],['Qué podía hacer y qué evita ahora suele ser más útil que aislar el dolor.','Los tratamientos y mensajes previos ayudan a entender la conducta actual.','Una meta útil se expresa en actividades o roles relevantes.']],
['Triage y seguridad','Antes de intervenir, discrimina situaciones que requieren una ruta distinta.',['Priorizar seguridad','Interpretar banderas','Comunicar riesgo'],['Una bandera clínica no debería interpretarse como regla aislada.','Su peso depende de la combinación entre historia, examen y evolución.','Investigar riesgo no obliga a usar lenguaje alarmista.']],
['Factores pronósticos','El pronóstico orienta seguimiento e identifica variables potencialmente modificables.',['Separar riesgo de destino','Detectar barreras','Planificar seguimiento'],['Un factor pronóstico modifica probabilidades; no sentencia el futuro.','Miedo, baja autoeficacia, expectativas y pérdida funcional pueden ser relevantes.','El factor importa cuando cambia educación, exposición, dosis o derivación.']]]],
['Evaluación estructurada',C.v,'Entrevista, medidas de resultado, observación, examen físico y síntesis.',[
['Arquitectura de evaluación','Cada etapa agrega información y evita una batería indiscriminada.',['Usar secuencia','Seleccionar por hipótesis','Cerrar con síntesis'],['Entrevista: historia, prioridades, riesgo y preguntas clínicas.','Medidas: línea basal de función o riesgo cuando corresponda.','Examen: seleccionado por su capacidad de responder preguntas.']],
['Medidas de resultado','Las escalas apoyan seguimiento, pero no reemplazan razonamiento ni conversación.',['Definir línea basal','Evitar medir por medir','Interpretar cambio'],['Los apuntes incorporan Oswestry como medida funcional.','También aparece STarT Back como apoyo para perfilar riesgo.','Una puntuación es útil cuando se conecta con objetivos y evolución.']],
['Examen físico con propósito','El examen responde preguntas generadas por la historia y se relaciona con capacidad y función.',['Definir pregunta','Relacionar con función','Evitar sobrediagnóstico'],['Movimiento: tolerancia, rango, estrategia y variabilidad.','Capacidad: fuerza, resistencia y tareas vinculadas con demandas reales.','Un hallazgo importa cuando modifica hipótesis, conducta o dosificación.']]]],
['Razonamiento y clasificación',C.o,'Niveles local, regional y global; sensibilidad y construcción de hipótesis.',[
['Local · regional · global','Amplía el análisis cuando una explicación local no alcanza.',['Usar niveles','Evitar reduccionismo','Elegir lo relevante'],['Local: respuesta y capacidad lumbar.','Regional: cadera, tronco y distribución de carga.','Global: condición física, sueño, actividad, trabajo, estrés y contexto.']],
['Sensibilidad y modulación','El dolor persistente puede acompañarse de una respuesta protectora aumentada.',['Diferenciar dolor y daño','Reconocer sensibilidad','Usar lenguaje seguro'],['El sistema puede responder más ante estímulos antes tolerables.','Sueño, estrés, experiencias y expectativas pueden modular la experiencia.','La explicación debe abrir opciones de acción, no crear fragilidad.']],
['De hallazgos a hipótesis','La síntesis debe ser breve, defendible y orientar una intervención verificable.',['Jerarquizar','Construir hipótesis','Definir criterios'],['Separa hallazgos que cambian conducta de los que solo describen.','Explica qué parece mantener la limitación y qué puede modificarse.','Una buena hipótesis genera una intervención y una forma de reevaluarla.']]]],
['Dolor persistente y conducta',C.p,'Protección, miedo, evitación, confianza, autoeficacia y lenguaje clínico.',[
['Dolor no equivale a daño','El dolor es real, pero su intensidad no es una medida directa de daño estructural.',['Comunicar sin minimizar','Reducir amenaza','Conectar con movimiento'],['Validar no obliga a reforzar fragilidad.','La respuesta protectora puede aumentar sin una relación lineal con daño.','La educación debe facilitar movimiento y participación.']],
['Miedo, evitación y autoeficacia','La anticipación de daño puede restringir movimiento y actividad.',['Explorar miedo','Identificar evitación','Crear éxitos'],['El miedo se pregunta; no se presume.','La evitación puede ser útil a corto plazo y restrictiva si se mantiene.','Pequeños logros medibles pueden aumentar control y confianza.']],
['Lenguaje clínico','Las palabras del profesional modifican cómo la persona interpreta su espalda.',['Evitar fragilizar','Explicar incertidumbre','Promover autonomía'],['Expresiones alarmistas pueden aumentar amenaza.','Reasegurar significa explicar qué se sabe y cómo se manejará la incertidumbre.','La mejor explicación termina en una acción aplicable.']]]],
['Comunicación y educación',C.a,'Alianza terapéutica, expectativas, objetivos compartidos y educación que cambia conducta.',[
['Alianza terapéutica','Escuchar, validar, acordar metas y explicar el plan forman parte de la intervención.',['Alinear expectativas','Definir metas','Aumentar participación'],['La explicación responde a las preguntas reales de la persona.','La meta describe qué actividad o rol quiere recuperar.','El plan se negocia según preferencias, recursos, barreras y respuesta.']],
['Educación que cambia conducta','La educación vale cuando mejora decisiones y facilita acciones útiles.',['Vincular con acción','Evitar clase magistral','Comprobar comprensión'],['Prioriza mensajes que modifiquen la conducta inmediata.','Pedir que la persona explique qué entendió permite detectar errores.','Cada mensaje debería conectarse con una acción concreta.']],
['Metas y expectativas','Explora explícitamente qué significará progreso.',['Explorar expectativas','Acordar éxito','Planificar reevaluación'],['Pregunta qué tendría que ocurrir para considerar útil el proceso.','Dolor puede ser una variable, pero también función, confianza y participación.','Definir cuándo reevaluar evita repetir una estrategia ineficaz.']]]],
['Intervención activa',C.g,'Movimiento, fuerza, capacidad, exposición y progresión individualizada.',[
['Movimiento como herramienta','El movimiento se utiliza para recuperar tolerancia, opciones y confianza.',['Elegir tareas','Dosificar exposición','Registrar respuesta'],['La tarea debe relacionarse con lo que la persona necesita recuperar.','Se puede graduar rango, carga, velocidad, volumen, apoyo o complejidad.','La progresión se decide por respuesta y recuperación.']],
['Fuerza y capacidad','El entrenamiento amplía capacidad física y puede reducir percepción de fragilidad.',['Construir capacidad','Progresar','Evitar ejercicios mágicos'],['Cadera, tronco y condición física global pueden participar.','La carga se ajusta a objetivos, experiencia, síntomas y recuperación.','No existe una única forma obligatoria de moverse.']],
['Exposición progresiva','Una jerarquía graduada puede organizar el retorno a actividades temidas.',['Identificar tarea','Crear jerarquía','Consolidar seguridad'],['Ordena tareas desde más tolerables a más desafiantes.','La exposición permite aprender que la tarea puede realizarse dentro de un margen aceptable.','La dificultad puede aumentar antes de que el dolor desaparezca si existe control y tolerancia.']]]],
['Terapias y dosificación',C.o,'Ubicar estrategias pasivas dentro de un plan activo y ajustar la dosis según respuesta.',[
['Terapia manual como adjunto','Las estrategias pasivas pueden ayudar, pero no deberían ser la explicación central.',['Definir objetivo','Conectar con actividad','Preservar autonomía'],['Una técnica tiene sentido si facilita movimiento, confianza o tolerancia.','El efecto debería conectarse con una tarea activa.','El plan pierde valor si genera dependencia de una corrección externa.']],
['Dosificación individual','Carga, volumen, frecuencia y complejidad se ajustan a respuesta y contexto.',['Dosificar','Considerar recuperación','Evitar recetas'],['Repeticiones, duración, intensidad y frecuencia son variables deliberadas.','La respuesta posterior informa si la dosis fue apropiada.','Tiempo, preferencias, equipo y adherencia cambian el programa real.']],
['Reevaluar para progresar','El ciclo clínico se cierra con evaluar → intervenir → medir → decidir.',['Usar pocos indicadores','Mantener o ajustar','Comunicar progreso'],['Pocas variables relevantes suelen ser más útiles que una batería enorme.','El cambio debe tener significado para la persona.','Si no hay progreso, revisa hipótesis, dosis, barreras, expectativas y seguridad.']]]],
['Integración clínica',C.v,'Los 11 pasos del abordaje, caso integrador y cierre del sistema.',[
['Los 11 pasos del abordaje','Convierte el contenido del curso en una ruta clínica reproducible.',['Integrar evaluación e intervención','Mantener seguridad','Cerrar con progresión'],['El eje es un cuidado centrado en la persona.','La evaluación integra seguridad, factores psicosociales, examen dirigido y medidas.','La intervención se individualiza y se revisa según progreso.'],'steps'],
['Caso integrador','Persona con dolor lumbar persistente, reducción de actividad, miedo a flexionarse y preocupación por una imagen previa.',['Priorizar información','Justificar decisiones','Evitar automatismos'],['Recorre triage, creencias, función, exposición y dosificación.','No se busca la técnica más sofisticada sino la decisión que mejor organiza el problema.','El objetivo es convertir la hipótesis en un plan verificable.'],'case'],
['Cierre: de apuntes a sistema','Transforma información dispersa en una forma de pensar, decidir y reevaluar.',['Sintetizar','Definir ruta propia','Transferir a práctica'],['Antes: foco principal en estructura dolorosa.','Durante: historia, riesgo, función, contexto, sensibilidad, capacidad y metas se integran.','Después: el plan se mide, ajusta y busca recuperar opciones y autonomía.']]]]
];
const KEY='kc_dlp_preview_v1';function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify([...S.done]))}catch(e){}}const S={m:0,l:0,done:new Set(load()),search:false};const app=document.getElementById('app');const flat=()=>M.flatMap((m,mi)=>m[3].map((l,li)=>({m,mi,l,li,id:`${mi}-${li}`})));const prog=()=>Math.round(S.done.size/flat().length*100);const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;e.style.transform='none';setTimeout(()=>{e.style.opacity=0;e.style.transform='translateY(80px)'},1700)}
function top(){return `<div class="top"><div class="brand" onclick="home()"><div class="logo"></div><div class="words">KineCheck<small>Preview · Formación clínica</small></div></div><div class="actions"><button class="btn searchbtn" onclick="searchOpen()">⌕ Buscar</button><button class="btn" onclick="home()">⌂</button></div></div>`}function mobile(){return `<div class="mobile"><button onclick="home()">⌂<br>Inicio</button><button onclick="resume()">▶<br>Continuar</button><button onclick="searchOpen()">⌕<br>Buscar</button></div>`}
function home(){const p=prog();app.innerHTML=`<main class="shell">${top()}<section class="hero"><div class="glass hero-main"><div class="eyebrow">● Preview privado · KineCheck</div><h1>Dolor lumbar<br><span>persistente.</span></h1><p>Razonamiento clínico, pronóstico, evaluación estructurada, comunicación, exposición, ejercicio y progresión convertidos en una aplicación educativa dinámica.</p><div class="ctas"><button class="primary" onclick="resume()">${S.done.size?'Continuar curso':'Comenzar curso'} →</button><button class="btn" onclick="openL(8,0)">Explorar los 11 pasos</button></div></div><aside class="glass side"><div class="ring" style="--p:${p}"><b>${p}%</b><small>progreso</small></div><div class="metric"><strong>9</strong><span>módulos</span></div><div class="metric"><strong>27</strong><span>microlecciones</span></div><div class="metric"><strong>${S.done.size}</strong><span>completadas</span></div></aside></section><div class="head"><div><h2>Ruta de aprendizaje</h2><p>Avanza en secuencia o entra al tema que necesites.</p></div><span class="tag">Progreso guardado</span></div><section class="grid">${M.map((m,i)=>card(m,i)).join('')}</section><div class="head"><div><h2>Herramientas rápidas</h2><p>Accesos directos a las decisiones clínicas clave.</p></div></div><section class="tools"><article class="glass tool" onclick="openL(2,0)"><div class="ico">🧭</div><b>Ruta de evaluación</b><p>Entrevista → medidas → examen → síntesis.</p></article><article class="glass tool" onclick="openL(1,1)"><div class="ico">🚦</div><b>Triage</b><p>Seguridad y banderas interpretadas en contexto.</p></article><article class="glass tool" onclick="openL(7,1)"><div class="ico">⚙️</div><b>Dosificación</b><p>Carga, volumen, frecuencia y recuperación.</p></article><article class="glass tool" onclick="openL(8,1)"><div class="ico">🧠</div><b>Caso integrador</b><p>Decide y recibe feedback inmediato.</p></article></section><div class="foot">Versión de prueba aislada. No modifica el Academy de producción ni habilita compras o licencias.</div>${mobile()}</main>`;scrollTo(0,0)}
function card(m,mi){const ids=m[3].map((_,li)=>`${mi}-${li}`),n=ids.filter(x=>S.done.has(x)).length,p=Math.round(n/ids.length*100);return `<article class="glass module" style="--mc:${m[1]}" onclick="openL(${mi},0)"><small>Módulo ${String(mi+1).padStart(2,'0')}</small><h3>${m[0]}</h3><p>${m[2]}</p><div class="mfoot"><div class="bar"><i style="width:${p}%"></i></div><span class="tag">${n}/${ids.length}</span></div></article>`}
function openL(mi,li){S.m=mi;S.l=li;render();scrollTo(0,0)}function render(){const m=M[S.m],l=m[3][S.l],id=`${S.m}-${S.l}`;app.innerHTML=`<main class="shell">${top()}<div class="course"><aside class="glass sidebar"><div class="sidehead"><b>${m[0]}</b><small>Módulo ${S.m+1} · ${m[3].length} lecciones</small></div>${m[3].map((x,i)=>`<div class="lessonlink ${i===S.l?'active':''} ${S.done.has(`${S.m}-${i}`)?'done':''}" onclick="openL(${S.m},${i})"><div class="dot">${S.done.has(`${S.m}-${i}`)?'✓':i+1}</div><span>${x[0]}</span></div>`).join('')}</aside><article class="glass lesson"><div class="crumb">Módulo ${S.m+1} · Lección ${S.l+1}</div><h1>${l[0]}</h1><p class="lead">${l[1]}</p><div class="goals">${l[2].map((g,i)=>`<div class="goal"><b>0${i+1}</b>${g}</div>`).join('')}</div>${l[3].map((p,i)=>`<section class="block"><h2>${['Idea clave','En la práctica','Decisión clínica'][i]}</h2><div class="callout" style="--cc:${m[1]}"><b>${['Comprender','Aplicar','Integrar'][i]}</b>${p}</div></section>`).join('')}${l[4]==='steps'?steps():''}${l[4]==='case'?caseW():''}${quiz(S.m,S.l)}<div class="lessonnav"><button class="btn" onclick="prev()">← Anterior</button><button class="primary" onclick="complete('${id}')">${S.done.has(id)?'Siguiente':'Completar y continuar'} →</button></div></article></div>${mobile()}</main>`}
const Q=[['¿Qué caracteriza mejor la lógica del curso?',['Buscar una única estructura responsable','Integrar historia, función, contexto y examen','Usar solo una escala de dolor'],1,'La propuesta integra información para construir una hipótesis clínica útil.'],['¿Cómo debe interpretarse una bandera clínica?',['Como regla automática','En combinación con historia, examen y evolución','Solo según intensidad de dolor'],1,'El razonamiento contextual evita convertir una señal aislada en una conclusión absoluta.'],['¿Para qué sirve principalmente una medida de resultado?',['Para reemplazar la entrevista','Para objetivar línea basal y seguir cambio','Para decidir por sí sola el diagnóstico'],1,'La medida aporta seguimiento cuando se vincula con función, metas y evolución.'],['¿Qué hace útil a un hallazgo del examen?',['Que sea sofisticado','Que cambie hipótesis, conducta o dosificación','Que confirme siempre una lesión'],1,'El examen se selecciona por su capacidad de modificar decisiones.'],['¿Qué mensaje es más coherente?',['Dolor significa necesariamente daño','El dolor es real y puede estar modulado por protección y contexto','Los factores físicos no importan'],1,'La explicación integra variables físicas y contextuales sin equiparar dolor con daño.'],['¿Cuál es el objetivo de la educación?',['Entregar mucha información','Cambiar comprensión y facilitar acciones útiles','Convencer de que no tiene nada'],1,'La educación tiene valor cuando mejora decisiones y participación.'],['¿Cómo se progresa un ejercicio?',['Con receta idéntica para todos','Según tolerancia, objetivo y recuperación','Solo cuando dolor es cero'],1,'La progresión es individual y se ajusta a respuesta y función.'],['¿Cuál es un rol razonable de una estrategia pasiva?',['Ser el centro permanente','Facilitar el plan activo sin generar dependencia','Reemplazar la exposición'],1,'Una estrategia complementaria debería apoyar autonomía y progresión.'],['¿Qué resume mejor el cierre?',['Encontrar la técnica perfecta','Construir hipótesis, intervenir, medir y ajustar','Aplicar protocolo idéntico'],1,'La ruta final es iterativa, centrada en la persona e individualizada.']];
function quiz(mi,li){const q=Q[mi],id=`q${mi}${li}`;return `<section class="check"><div class="eyebrow">Checkpoint</div><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="choice" onclick="ans(this,${i},${q[2]},'${id}')">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div class="feedback" id="${id}" data-fb="${encodeURIComponent(q[3])}"></div></section>`}function ans(btn,i,ok,id){const w=btn.closest('.check');w.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===ok)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.getElementById(id);f.textContent=(i===ok?'Correcto. ':'Revisa la lógica. ')+decodeURIComponent(f.dataset.fb)}function complete(id){S.done.add(id);save();toast('Lección completada');next()}function next(){let m=S.m,l=S.l+1;if(l>=M[m][3].length){m++;l=0}if(m>=M.length){toast('Curso completado');home();return}openL(m,l)}function prev(){let m=S.m,l=S.l-1;if(l<0){m--;if(m<0){home();return}l=M[m][3].length-1}openL(m,l)}function resume(){const x=flat().find(x=>!S.done.has(x.id))||flat()[0];openL(x.mi,x.li)}
const ST=[['Centrar el cuidado en la persona','Objetivos, contexto, preferencias y aquello que necesita recuperar orientan la ruta.'],['Detectar probabilidad de patología seria','Realiza triage y decide si existen hallazgos que cambian el itinerario clínico.'],['Explorar factores psicosociales','Creencias, miedo, expectativas, estrés y barreras pueden modificar el curso.'],['Evitar explicaciones amenazantes','No conviertas hallazgos inespecíficos o imágenes en sentencias de fragilidad.'],['Realizar examen físico dirigido','Elige pruebas que respondan preguntas concretas y se conecten con función.'],['Usar medidas de resultado','Define línea basal y variables simples para seguir el cambio.'],['Entregar información útil','Explica de manera breve, verificable y conectada con decisiones.'],['Prescribir actividad y ejercicio','Construye un plan activo, relevante y graduado.'],['Usar terapia manual como adjunto','Si se utiliza, debe facilitar actividad y no dependencia.'],['Ajustar la dosis','Modifica carga, volumen, frecuencia y complejidad según respuesta.'],['Facilitar retorno y progresión','El cierre es recuperar participación, capacidad y autonomía.']];function steps(){return `<section class="block"><h2>Ruta interactiva de 11 pasos</h2><div class="stepper">${ST.map((s,i)=>`<button class="step ${i===0?'active':''}" onclick="stepShow(${i},this)"><b>${i+1}</b><small>${s[0].split(' ').slice(0,3).join(' ')}</small></button>`).join('')}</div><div class="stepdetail" id="stepd"><h3>1. ${ST[0][0]}</h3><p>${ST[0][1]}</p></div></section>`}function stepShow(i,e){document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('stepd').innerHTML=`<h3>${i+1}. ${ST[i][0]}</h3><p>${ST[i][1]}</p>`}
function caseW(){return `<section class="block"><h2>Simulador clínico</h2><div class="case"><div class="patient"><div class="avatar">◒</div><b>Paciente virtual</b><p>Dolor lumbar persistente. Ha reducido actividad, teme flexionarse y atribuye el problema a una imagen previa. Quiere volver a entrenar y trabajar con confianza.</p><span class="tag">Objetivo: retorno funcional</span></div><div class="casepanel"><h3>¿Qué priorizas primero?</h3><button class="casebtn" onclick="caseA(0)">A. Repetir una batería extensa de pruebas estructurales</button><button class="casebtn" onclick="caseA(1)">B. Confirmar seguridad, explorar creencias y función, y acordar una hipótesis</button><button class="casebtn" onclick="caseA(2)">C. Indicar reposo hasta que el dolor desaparezca</button><div class="caseresult" id="caseR">Selecciona una opción.</div></div></div></section>`}function caseA(i){const r=['Una batería extensa solo sirve si cada prueba responde una pregunta. Primero organiza seguridad, historia, función y variables que cambiarán conducta.','Buena decisión. Integra triage, significado del dolor, función y objetivos antes de escoger la intervención.','El reposo como estrategia central no responde a pérdida de capacidad ni miedo. La ruta necesita exposición y progresión individualizadas.'];document.getElementById('caseR').textContent=r[i]}
function searchOpen(){S.search=true;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal" onclick="if(event.target.id==='modal')searchClose()"><div class="modalcard"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Buscar en el curso</h2><button class="btn" onclick="searchClose()">✕</button></div><input class="search" id="search" placeholder="Ej.: pronóstico, ejercicio, triage..." oninput="doSearch(this.value)"><div id="results">${results('')}</div></div></div>`);setTimeout(()=>document.getElementById('search').focus(),20)}function searchClose(){document.getElementById('modal')?.remove();S.search=false}function results(t){t=t.toLowerCase().trim();return flat().filter(x=>!t||(`${x.m[0]} ${x.l[0]} ${x.l[1]}`).toLowerCase().includes(t)).slice(0,15).map(x=>`<div class="result" onclick="searchClose();openL(${x.mi},${x.li})"><b>${x.l[0]}</b><small>${x.m[0]}</small></div>`).join('')||'<p style="color:var(--mut)">Sin coincidencias.</p>'}function doSearch(v){document.getElementById('results').innerHTML=results(v)}window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.search?searchClose():searchOpen()}if(e.key==='Escape'&&S.search)searchClose()});home();
</script>
