<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Panel docente | KineCheck</title><style>body{background:#071d22;color:#edfffd;font:16px system-ui;margin:0}header{padding:20px;background:#12373b}main{max-width:1150px;margin:24px auto;padding:0 16px}input,button{font:inherit;border-radius:8px;padding:11px}input{background:#123137;color:#fff;border:1px solid #548c8d}button{cursor:pointer;border:0;background:#67e3d6;color:#062626;font-weight:700}section{background:#123035;border:1px solid #396468;border-radius:12px;padding:18px;margin:17px 0}table{border-collapse:collapse;min-width:900px;width:100%}th,td{border-bottom:1px solid #375659;padding:9px;text-align:left}div.scroll{overflow:auto}a{color:#8ff3e3}.muted{color:#b7d2d0}details{margin:6px 0}summary{cursor:pointer}code{white-space:pre-wrap}</style></head><body><header><strong>KineCheck · Panel docente cardiorrespiratorio</strong></header><main><section><h1>Resultados de las parejas</h1><p class="muted">Acceso exclusivo docente. La clave no se almacena en este navegador. Los resultados provienen de las respuestas recibidas y corregidas por el servidor.</p><label>Clave docente <input type="password" id="key" autocomplete="off"></label> <button id="load">Consultar resultados</button> <button id="export" disabled>Exportar CSV / Excel</button><p id="status" role="status"></p><label>Buscar pareja o sección <input id="filter" type="search" placeholder="Filtrar" aria-label="Buscar pareja o sección"></label></section><section><p id="stats"></p><div class="scroll"><table><thead><tr><th>Fecha</th><th>Estudiante 1</th><th>Estudiante 2</th><th>Curso</th><th>Cardio</th><th>Resp.</th><th>Total</th><th>Nota</th><th>Detalle</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let records=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const texts=['FC en reposo','Presión arterial','Anamnesis de palpitaciones','Examen del pulso','Seguridad antes del esfuerzo','Frecuencia respiratoria','Sibilancias','Inspección torácica','Percusión pulmonar','Seguridad antes del ejercicio'];const correct=[1,2,0,1,2,0,1,0,2,1];const feedback=['Interpretar FC con síntomas y contexto.','Repetir PA y considerar técnica; una toma aislada no es diagnóstico.','Explorar síntomas de alarma y desencadenantes.','Valorar frecuencia, ritmo, amplitud y simetría.','Pesquisar alarmas antes de una prueba de esfuerzo.','FR elevada en reposo requiere verificación y contexto.','Las sibilancias no diagnostican por sí solas una enfermedad.','Inspeccionar simetría, esfuerzo y músculos accesorios.','Percusión orienta la densidad subyacente.','Evaluar gravedad y posible derivación antes de ejercicio.'];
function visible(){let s=$('filter').value.toLowerCase();return records.filter(r=>[r.student1,r.student2,r.course].some(v=>(v||'').toLowerCase().includes(s)))}
function render(){let a=visible();$('stats').textContent=a.length+' registros'+(a.length?' · Promedio de nota: '+(a.reduce((s,r)=>s+r.grade,0)/a.length).toFixed(2).replace('.',','):'');$('rows').innerHTML=a.map(r=>'<tr><td>'+esc(new Date(r.date).toLocaleString('es-CL'))+'</td><td>'+esc(r.student1)+'</td><td>'+esc(r.student2)+'</td><td>'+esc(r.course)+'</td><td>'+r.score1+'/20</td><td>'+r.score2+'/20</td><td>'+r.total+'/40</td><td>'+r.grade.toFixed(1).replace('.',',')+'</td><td><details><summary>Ver corrección</summary>'+r.answers.map((x,i)=>'<p><b>'+(i+1)+'. '+texts[i]+'</b>: opción '+(x+1)+' · '+r.points[i]+'/4<br>'+feedback[i]+'</p>').join('')+'</details></td></tr>').join('')}
$('filter').oninput=render;
$('load').onclick=async()=>{const key=$('key').value;$('status').textContent='Cargando…';try{const res=await fetch('/api/cardio/results',{headers:{Authorization:'Bearer '+key},cache:'no-store'});const d=await res.json();if(!res.ok)throw Error(d.error||'Error');records=d.records;$('key').value='';$('export').disabled=!records.length;$('status').textContent='Resultados cargados'+(d.hasMore?' · ADVERTENCIA: hay más de 10.000 registros y la consulta es parcial.':'');render()}catch(e){records=[];$('export').disabled=true;$('status').textContent=e.message;render()}};
$('export').onclick=()=>{const headers=['Fecha','Estudiante 1','Estudiante 2','Curso','Cardio /20','Respiratoria /20','Total /40','Porcentaje','Nota',...texts.map((t,i)=>'P'+(i+1)+' puntos'),...texts.map((t,i)=>'P'+(i+1)+' respuesta (opción)')];const cells=r=>[r.date,r.student1,r.student2,r.course,r.score1,r.score2,r.total,r.percentage,String(r.grade).replace('.',','),...r.points,...r.answers.map(n=>n+1)];const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\uFEFF'+[headers,...visible().map(cells)].map(row=>row.map(quote).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='kinecheck-notas-cardiorrespiratorias.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
