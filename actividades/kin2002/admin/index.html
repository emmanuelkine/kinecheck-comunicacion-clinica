<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KIN2002 · Panel docente</title><style>body{font-family:system-ui;background:#07161c;color:#eef8fa;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:#0d2932;border:1px solid #28515d;border-radius:12px;padding:18px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #3d6c77;background:#0a2229;color:#fff}button{cursor:pointer;background:#1d7d6b}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar input{flex:1;min-width:240px}.wrap{overflow:auto}table{width:100%;min-width:780px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #28515d;text-align:left;vertical-align:top}th{color:#70dfca}.good{color:#70dfca}.bad{color:#ffb1a5}.err{color:#ffb1a5}.small{font-size:.85rem;color:#abc4ca}</style></head><body><main id="app"><h1>Panel KIN2002 · Sección 1</h1><p>Las entregas aparecen aquí aunque el correo haya fallado.</p><section><label>Clave del panel <input id="token" type="password"></label> <button id="go">Abrir</button><p id="err" class="err"></p></section></main><script>
var app=document.getElementById("app"),token=document.getElementById("token"),err=document.getElementById("err");
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function load(){var t=token.value.trim();if(!t){err.textContent="Ingresa la clave.";return}sessionStorage.setItem("k2admin",t);try{var r=await fetch("/api/kin2002-submissions",{headers:{authorization:"Bearer "+t}}),d=await r.json();if(!r.ok)throw new Error(d.error||"No autorizado");render(d.records)}catch(e){err.textContent=e.message}}
function render(rows){app.innerHTML='<h1>'+rows.length+' entregas KIN2002</h1><p>El estado de correo es independiente del guardado.</p><section><div class="bar"><input id="q" placeholder="Buscar estudiante, caso o código"><button id="refresh">Actualizar</button></div><div id="table"></div></section>';document.getElementById("q").oninput=function(){draw(rows)};document.getElementById("refresh").onclick=function(){location.reload()};draw(rows)}
function draw(rows){var q=(document.getElementById("q").value||"").toLowerCase(),f=rows.filter(function(r){return (r.name+" "+r.caseTitle+" "+r.id).toLowerCase().includes(q)});document.getElementById("table").innerHTML='<div class="wrap"><table><thead><tr><th>Fecha</th><th>Estudiante</th><th>Caso</th><th>Resultado</th><th>Correo</th><th>Respuestas</th></tr></thead><tbody>'+f.map(function(r){return '<tr><td>'+esc(new Date(r.createdAt).toLocaleString("es-CL"))+'</td><td><b>'+esc(r.name)+'</b><br><span class="small">'+esc(r.id)+'</span></td><td>'+String(r.caseId).padStart(2,"0")+' · '+esc(r.caseTitle)+'</td><td>'+(r.feedback?'<b>'+r.feedback.total+'/20</b><br>'+esc(r.feedback.level):'Guardada')+'</td><td class="'+(r.emailSent?'good':'bad')+'">'+(r.emailSent?'Enviado':'Pendiente / falló')+'</td><td><details><summary>Ver</summary><ol><li>'+esc(r.answers?.initialDecision)+'</li><li>'+esc(r.answers?.safety)+'</li><li>'+esc(r.answers?.newData)+'</li><li>'+esc(r.answers?.plan)+'</li><li>'+esc(r.answers?.observerFeedback)+'</li></ol></details></td></tr>'}).join("")+'</tbody></table></div>'}
document.getElementById("go").onclick=load;var s=sessionStorage.getItem("k2admin");if(s){token.value=s;load()}
</script></body></html>
