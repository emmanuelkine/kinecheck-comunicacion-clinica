<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>KIN2002 · Laboratorio S1</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf8fa;background:#07161c;line-height:1.55}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#10303a,#07161c 480px)}main{width:min(900px,100%);margin:auto;padding:24px 14px 60px}h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.05;margin:.4rem 0 1rem}h2{font-size:1.2rem}header{padding:20px 0}.ey{color:#70dfca;font-size:.78rem;font-weight:800;letter-spacing:.13em}.lead{color:#c4d9de}.box{background:#0d2932;border:1px solid #28515d;border-radius:14px;padding:20px;margin:16px 0}.list{display:grid;gap:10px}.case{display:flex;gap:16px;align-items:center;padding:16px;border-radius:12px;border:1px solid #28515d;background:#0b242c;color:inherit;text-decoration:none}.num{font-size:1.8rem;color:#70dfca;font-weight:850}.case h2,.case p{margin:0}.case p{color:#adc7cd}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button,.btn{min-height:48px;padding:11px 15px;border:1px solid #3d6c77;border-radius:9px;background:#12343e;color:#fff;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#1d7d6b;border-color:#39a38f}.secondary{margin-left:8px}.notice{padding:12px 14px;background:#302813;border-left:4px solid #e1b451;border-radius:8px}.ok{padding:12px 14px;background:#123a30;border-left:4px solid #70dfca;border-radius:8px}.small{font-size:.88rem;color:#a7c0c7}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-weight:700}.form input,.form textarea{width:100%;font:inherit;color:#eef8fa;background:#061a20;border:1px solid #3a6671;border-radius:9px;padding:11px}.form textarea{min-height:105px;resize:vertical}.error{color:#ffb1a5;font-weight:700;min-height:1.3em}.criteria{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.crit{background:#0a2229;border:1px solid #28515d;border-radius:10px;padding:12px}.crit b{color:#70dfca}.score{font-size:3rem;color:#70dfca;font-weight:850}.hide{position:absolute;left:-10000px}@media(max-width:620px){.roles,.criteria{grid-template-columns:1fr}.secondary{margin:9px 0 0;width:100%}.primary{width:100%}}
</style>
</head>
<body><main id="app"></main>
<script>
var cases=[
{id:1,title:'Volver a agacharse',focus:'Creencias, exposición y educación',person:'Camila, 34 años, auxiliar de cocina',history:'Dolor lumbar de 7 meses. 3/10 al iniciar el día y 6/10 tras 25 minutos de pie. No refiere trauma, fiebre, cambios esfinterianos ni síntomas en piernas si se pregunta.',function:'Camina 12 minutos. Evita recoger un objeto liviano desde una mesa baja por temor.',belief:'Si me agacho, se desgasta más la columna.',goal:'Preparar alimentos sin pedir ayuda.',constraint:'10 minutos al día; prefiere una tarea.',twist:'Probé caminar el doble y al día siguiente no pude completar el turno.'},
{id:2,title:'Conducir y recuperar pausas',focus:'Contexto laboral y plan factible',person:'Felipe, 46 años, conductor',history:'Dolor lumbar de 9 meses; 5/10 después de 45 minutos sentado. Duerme 5 horas por turnos. No refiere trauma, fiebre ni cambios esfinterianos.',function:'Camina 15 minutos en día libre y permanece sentado hasta 90 minutos en turno.',belief:'Necesito una postura perfecta.',goal:'Terminar el turno sin rechazar viajes.',constraint:'Tiene dos pausas autorizadas y un descanso al cambiar de turno.',twist:'El test mejoró, pero sigo rechazando los últimos viajes.'},
{id:3,title:'El informe de imágenes',focus:'Incertidumbre y decisión compartida',person:'Teresa, 38 años, administrativa',history:'Dolor lumbar de 10 meses, 2–6/10. Informe menciona cambios degenerativos sin correlación clínica adjunta. No refiere síntomas sistémicos, trauma reciente ni cambios esfinterianos.',function:'Camina 8 minutos y dejó de subir dos pisos por temor.',belief:'Mi espalda es de una persona de 80 años.',goal:'Subir las escaleras de su oficina con más confianza.',constraint:'Solicita terapia pasiva y duda del ejercicio.',twist:'Si no me garantiza que no dolerá, no voy a hacer la tarea.'},
{id:4,title:'La dosis que no encaja',focus:'Dosificación y reevaluación',person:'Mauricio, 29 años, estudiante y trabajador',history:'Dolor lumbar de 6 meses, 4/10 habitual. Trabaja de pie y estudia de noche. Falta preguntar síntomas neurológicos y esfinterianos.',function:'Tolera 30 minutos de pie y caminar 10. Plan previo: seis ejercicios sin dosis clara.',belief:'Mientras más ejercicio haga, más rápido se arregla.',goal:'Asistir al trabajo y a clases.',constraint:'12 minutos, tres días por semana, sin equipamiento.',twist:'Hice todos los ejercicios ayer, pero hoy no pude ir a clases.'},
{id:5,title:'La pregunta que cambia la prioridad',focus:'Seguridad y derivación',person:'Daniela, 41 años, vendedora',history:'Dolor lumbar de 3 meses, 7/10, irradiado a pierna derecha. Desde hoy dificultad para iniciar micción y adormecimiento perineal nuevo. Si preguntan por seguridad, informarlo de inmediato.',function:'Le cuesta caminar. No hay evaluación médica de los síntomas nuevos.',belief:'Quizás solo necesito un masaje.',goal:'Saber qué debe hacer ahora.',constraint:'Pregunta si puede esperar hasta mañana.',twist:'Desde hoy me cuesta orinar y tengo una zona adormecida entre las piernas.'}
];
var app=document.getElementById('app'),role=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function current(){var m=location.hash.match(/^#caso-(\d{2})$/);return m?cases.find(function(c){return c.id===Number(m[1])}):null}
function home(){role=null;var cards=cases.map(function(c){return '<a class="case" href="#caso-'+String(c.id).padStart(2,'0')+'"><span class="num">'+String(c.id).padStart(2,'0')+'</span><div><h2>'+esc(c.title)+'</h2><p>'+esc(c.focus)+'</p></div></a>'}).join('');app.innerHTML='<header><p class="ey">UOH · KIN2002 · SECCIÓN 1</p><h1>Casos de laboratorio</h1><p class="lead">Cinco casos ficticios de dolor lumbar. Roten kinesiólogo, paciente y observador.</p></header><div class="box"><b>Ronda de 12 minutos:</b> 2 lectura · 6 consulta · 2 feedback · 2 repetición.<p class="small">La respuesta se guarda primero en KineCheck. Si el correo falla, la entrega no se pierde. El formulario también conserva un borrador en el dispositivo.</p></div><div class="list">'+cards+'</div>';scrollTo(0,0)}
function showCase(){var c=current();if(!c){home();return}role=null;app.innerHTML='<a href="#" class="btn">← Casos</a><header><p class="ey">CASO '+String(c.id).padStart(2,'0')+' · S1</p><h1>'+esc(c.title)+'</h1><p class="lead">'+esc(c.focus)+'</p></header><div class="box"><ol><li>Formen un trío y elijan rol.</li><li>Lean su tarjeta máximo 2 minutos y guarden el celular.</li><li>Consulta 6 minutos. Al minuto 4, el observador activa el dato nuevo si no apareció.</li><li>Feedback 2 minutos: una fortaleza y una mejora.</li><li>Repitan 2 minutos el segmento elegido.</li><li>Solo quien actuó como kinesiólogo completa el registro.</li></ol><p class="notice">No representen dolor, caídas ni maniobras de riesgo. Nunca oculten un dato de seguridad si fue preguntado.</p></div><div class="box"><h2>Elige únicamente tu rol</h2><div class="roles"><button data-role="kine">Kinesiólogo</button><button data-role="paciente">Paciente</button><button data-role="observador">Observador</button></div></div>';document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){role=b.dataset.role;showRole()}});scrollTo(0,0)}
function showRole(){var c=current(),body='';if(!c||!role)return;if(role==='kine')body='<h2>Motivo de consulta</h2><p><b>'+esc(c.person)+'</b></p><p>Explora función, seguridad, preocupación y prioridad. Selecciona una evaluación con propósito, formula una síntesis provisional y explica tu decisión. Ante el dato nuevo, revisa tu conducta. No inventes hallazgos.</p>';if(role==='paciente')body='<h2>Representa a '+esc(c.person)+'</h2><p>'+esc(c.history)+'</p><h2>Función</h2><p>'+esc(c.function)+'</p><h2>Creencia</h2><p>'+esc(c.belief)+'</p><h2>Prioridad y contexto</h2><p>'+esc(c.goal)+' '+esc(c.constraint)+'</p><h2>Dato nuevo</h2><p class="notice">'+esc(c.twist)+'</p>';if(role==='observador')body='<h2>Observa</h2><p>Consentimiento, preguntas de seguridad, evaluación con propósito, síntesis, objetivo, comunicación y respuesta al dato nuevo.</p><h2>Dato nuevo</h2><p class="notice">'+esc(c.twist)+'</p><p>Entrega una fortaleza y una mejora concreta; pide repetir el segmento elegido.</p>';app.innerHTML='<header><p class="ey">CASO '+String(c.id).padStart(2,'0')+' · TU ROL</p><h1>'+(role==='kine'?'Kinesiólogo':role==='paciente'?'Paciente':'Observador')+'</h1></header><div class="box">'+body+'<button class="primary" id="put">Ya leí · Guardar celular</button><button class="secondary" id="back">Volver</button></div>';document.getElementById('put').onclick=putAway;document.getElementById('back').onclick=showCase}
function putAway(){app.innerHTML='<header><p class="ey">CONSULTA CARA A CARA</p><h1>Celulares guardados.</h1></header><div class="box"><p>6 min consulta · 2 min feedback · 2 min repetición.</p><button class="primary" id="done">Terminamos la ronda</button><button class="secondary" id="read">Releer tarjeta</button></div>';document.getElementById('read').onclick=showRole;document.getElementById('done').onclick=closeRound}
function closeRound(){var isKine=role==='kine';app.innerHTML='<header><p class="ey">CIERRE DE RONDA</p><h1>'+(isKine?'Fundamenta tu decisión.':'Rota de rol.')+'</h1></header><div class="box"><p>Conversen: ¿qué dato sostuvo la decisión?, ¿qué cambió con el dato nuevo?, ¿qué mejoró al repetir?</p>'+(isKine?'<p><b>Tu ronda como kinesiólogo termina con registro individual.</b> Se guarda primero y luego se corrige y notifica.</p><button class="primary" id="formBtn">Responder · guardar · corregir</button>':'<p>No envíes todavía. Rota hasta actuar como kinesiólogo.</p>')+'<a class="btn secondary" href="#">Elegir otro caso</a></div>';if(isKine)document.getElementById('formBtn').onclick=formView}
function key(c){return 'kin2002:draft:s1:'+c.id}
function formView(){var c=current(),saved=JSON.parse(localStorage.getItem(key(c))||'{}'),submission=saved.submission||crypto.randomUUID();app.innerHTML='<header><p class="ey">REGISTRO INDIVIDUAL · CASO '+String(c.id).padStart(2,'0')+'</p><h1>Explica cómo razonaste.</h1></header><div class="box"><form id="f" class="form"><label>Nombre y apellido<input id="name" required maxlength="120"></label><p class="small">Se registra nombre, caso, respuestas, retroalimentación y estado del correo para revisión del equipo docente.</p><label>1. Decisión inicial e hipótesis<textarea id="a1" required></textarea></label><label>2. Seguridad y conducta<textarea id="a2" required></textarea></label><label>3. ¿Qué cambió con el dato nuevo?<textarea id="a3" required></textarea></label><label>4. Objetivo y plan<textarea id="a4" required></textarea></label><label>5. Feedback del observador y qué repetirías distinto<textarea id="a5" required></textarea></label><label class="hide">Web<input id="website"></label><p id="err" class="error"></p><button class="primary" type="submit" id="send">Guardar · corregir · enviar</button></form></div>';var ids=['name','a1','a2','a3','a4','a5'];ids.forEach(function(id){var el=document.getElementById(id);el.value=saved[id]||'';el.oninput=save});function save(){var d={submission:submission};ids.forEach(function(id){d[id]=document.getElementById(id).value});localStorage.setItem(key(c),JSON.stringify(d))}document.getElementById('f').onsubmit=async function(e){e.preventDefault();save();var vals=ids.map(function(id){return document.getElementById(id).value.trim()}),err=document.getElementById('err'),btn=document.getElementById('send');if(vals[0].length<3||vals.slice(1).some(function(v){return v.length<4})){err.textContent='Completa nombre y las cinco respuestas.';return}btn.disabled=true;btn.textContent='Guardando primero…';err.textContent='';try{var r=await fetch('/api/kin2002-submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clientSubmissionId:submission,name:vals[0],section:'S1',caseId:c.id,role:'kine',answers:{initialDecision:vals[1],safety:vals[2],newData:vals[3],plan:vals[4],observerFeedback:vals[5]},website:document.getElementById('website').value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo registrar.');localStorage.removeItem(key(c));feedback(d)}catch(x){err.textContent=(x.message||'No fue posible enviar.')+' Tu borrador sigue guardado en este dispositivo.';btn.disabled=false;btn.textContent='Reintentar envío'}}}
function criterion(label,x){return '<div class="crit"><b>'+esc(label)+' · '+x.score+'/4</b><p>'+esc(x.comment)+'</p></div>'}
function feedback(d){var f=d.feedback;app.innerHTML='<header><p class="ey">ENTREGA REGISTRADA</p><div class="score">'+f.total+'/20</div><h1>'+esc(f.level)+'</h1><p class="lead">Puntaje formativo; no es una nota oficial.</p></header><div class="box">'+(d.emailSent?'<p class="ok"><b>Guardado y notificado.</b> El equipo docente recibió la entrega.</p>':'<p class="notice"><b>Guardado correctamente.</b> El correo no salió, pero tu respuesta quedó registrada. No necesitas volver a escribirla.</p>')+'<p class="small">Código: <b>'+esc(d.id)+'</b></p><div class="criteria">'+criterion('Información clínica',f.information)+criterion('Seguridad',f.safety)+criterion('Dato nuevo',f.adaptation)+criterion('Objetivo y plan',f.plan)+criterion('Reflexión',f.reflection)+'</div><h2>Fortaleza</h2><p>'+esc(f.strength)+'</p><h2>A mejorar</h2><p>'+esc(f.improvement)+'</p><h2>Próximo intento</h2><p>'+esc(f.nextStep)+'</p><a class="btn primary" href="#">Rotar y elegir otro caso</a></div>'}
window.addEventListener('hashchange',showCase);showCase();
</script></body></html>
