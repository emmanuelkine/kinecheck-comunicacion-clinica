<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satisfacción biblioteca | KineCheck Admin</title><link rel="icon" href="/assets/brand/kinecheck-3d-favicon.png"><style>body{background:#071d22;color:#e5f7f6;font:16px/1.55 system-ui;margin:0}.wrap{max-width:1120px;margin:auto;padding:24px}a{color:#8cece6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#10343c;border:1px solid #427b82;border-radius:13px;padding:17px}.number{font-size:2rem;font-weight:800;color:#8af0e7}button{background:#8af0e7;border:0;border-radius:9px;padding:11px 17px;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{text-align:left;border-bottom:1px solid #345a60;padding:9px;overflow-wrap:anywhere}th{color:#9be8e3}.muted{color:#bacfd0}#results[hidden]{display:none}</style></head><body><div class="wrap"><a href="/admin/">← Volver al panel</a><h1>Experiencia de la biblioteca gratuita</h1><p class="muted">Encuesta voluntaria · últimos 30 días. Los resultados pueden tener sesgo de participación.</p><button id="load">Consultar resultados</button><p id="status" role="status"></p><div id="results" hidden><div class="cards"><div class="card">Respuestas<div class="number" id="count">—</div></div><div class="card">Promedio<div class="number" id="average">—</div></div><div class="card">Valoraciones 4–5<div class="number" id="positive">—</div></div></div><h2>Aspectos que mejorarían</h2><div class="cards" id="areas"></div><h2>Comentarios recientes</h2><table><thead><tr><th>Fecha</th><th>Nota</th><th>Sección</th><th>Comentario</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>(()=>{"use strict";const $=x=>document.querySelector(x);$("#load").onclick=async()=>{let session;try{session=JSON.parse(sessionStorage.getItem("kinecheck_admin_session_v1")||"null")}catch{}if(!session?.access_token){$("#status").textContent="Inicia sesión primero en /admin/ desde esta misma pestaña.";return}$("#status").textContent="Consultando…";try{const r=await fetch("/api/library-feedback",{headers:{Authorization:"Bearer "+session.access_token},cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.message||"Error");$("#count").textContent=d.count;$("#average").textContent=d.average===null?"Sin datos":d.average+"/5";$("#positive").textContent=d.count?Math.round((d.distribution[3]+d.distribution[4])*100/d.count)+"%":"—";const names={contenido:"Más contenidos",navegacion:"Navegación",diseno:"Diseño",descargas:"PDF",nada:"Sin cambios",otro:"Otras ideas"};for(const [key,node] of [["areas",d.areas],["rows",d.records]])$(key).replaceChildren();Object.entries(d.areas).forEach(([k,v])=>{const c=document.createElement("div");c.className="card";c.textContent=(names[k]||k)+": "+v;$("#areas").append(c)});d.records.forEach(x=>{const tr=document.createElement("tr");[new Date(x.createdAt).toLocaleDateString("es-CL"),x.rating+"/5",x.page,x.comment||"Sin comentario"].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});$("#rows").append(tr)});$("#results").hidden=false;$("#status").textContent="Actualizado. "+(d.truncated?"Mostrando últimos 400 comentarios.":"");}catch(err){$("#status").textContent=err.message}}})();</script></body></html>
