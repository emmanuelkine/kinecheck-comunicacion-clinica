<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Rehabilitación musculoesquelética personalizada</title><desc id="desc">Infografía con tres pasos conectados: comprender el mecanismo, identificar características individuales y adaptar la intervención.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102e45"/><stop offset="1" stop-color="#282b55"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27d9c0"/><stop offset="1" stop-color="#6ca8ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1100" height="560" rx="34" fill="url(#bg)"/><circle cx="540" cy="270" r="225" fill="none" stroke="#65dcd6" stroke-opacity=".12" stroke-width="2"/><circle cx="540" cy="270" r="180" fill="none" stroke="#a799ff" stroke-opacity=".15" stroke-width="2"/>
<g stroke="#89eee5" stroke-width="4" fill="none" opacity=".9"><path d="M342 276h100"/><path d="m421 264 18 12-18 12"/><path d="M660 276h100"/><path d="m739 264 18 12-18 12"/></g>
<g filter="url(#glow)"><circle cx="220" cy="276" r="105" fill="#12535f" stroke="#63e5db" stroke-width="3"/><circle cx="550" cy="276" r="105" fill="#302d63" stroke="#a89bff" stroke-width="3"/><circle cx="880" cy="276" r="105" fill="#31513c" stroke="#b8e77a" stroke-width="3"/></g>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#f0ffff"><text x="220" y="208" font-size="23" font-weight="800">01</text><text x="220" y="260" font-size="25" font-weight="800">Mecanismo</text><text x="220" y="296" font-size="17">¿Qué podría cambiar?</text><text x="220" y="322" font-size="15" fill="#bfe9ec">Hipótesis que se evalúa</text>
<text x="550" y="208" font-size="23" font-weight="800">02</text><text x="550" y="260" font-size="25" font-weight="800">Persona</text><text x="550" y="296" font-size="17">¿Qué influye en su respuesta?</text><text x="550" y="322" font-size="15" fill="#d7d1ff">Características y contexto</text>
<text x="880" y="208" font-size="23" font-weight="800">03</text><text x="880" y="260" font-size="25" font-weight="800">Intervención</text><text x="880" y="296" font-size="25" font-weight="800">+ seguimiento</text><text x="880" y="322" font-size="15" fill="#d9f5b5">Adaptar según evolución</text></g>
<rect x="138" y="443" width="824" height="55" rx="18" fill="#071d22" stroke="#579da4"/><text x="550" y="478" fill="#e6ffff" font-family="system-ui,sans-serif" text-anchor="middle" font-size="20" font-weight="700">Individualizar no es adivinar: formular, medir, revisar y ajustar.</text></svg>