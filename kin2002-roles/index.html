<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#f4f6f8" />
  <title>KIN2002 · Tarjeta de rol</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d7dde7;--bg:#f4f6f8;--card:#fff;--accent:#1b5e7a;--soft:#eaf3f7;--warn:#fff6df}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{min-height:100vh;padding:16px;display:flex;align-items:flex-start;justify-content:center}
    .card{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.08);overflow:hidden}
    .head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
    .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
    h1{font-size:24px;line-height:1.15;margin:6px 0 0}.sub{margin-top:8px;color:var(--muted);font-size:14px}
    .body{padding:20px 22px 24px}.section{margin:0 0 18px}.section h2{font-size:15px;margin:0 0 8px;color:var(--accent)}
    p{margin:0 0 10px;line-height:1.5}.box{background:var(--soft);padding:14px 15px;border-radius:10px;border:1px solid #d7e7ee}
    ul{padding-left:20px;margin:8px 0 0}li{margin:7px 0;line-height:1.45}
    .reveal{display:none;margin-top:12px;background:var(--warn);border:1px solid #ecd999;padding:14px;border-radius:10px}
    button{width:100%;border:0;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
    .foot{font-size:12px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
    .bad{padding:28px;text-align:center}.bad h1{font-size:22px}.role{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#eef2f6;color:#344054;font-size:12px;font-weight:700}
  </style>
</head>
<body>
<div class="wrap"><main class="card" id="app"></main></div>
<script>
const cards={
  'a4p7m2':{station:'Estación 1 · Dolor lumbar',role:'PACIENTE',name:'Andrea, 43 años',intro:'Trabajas como conductora. Tienes dolor lumbar persistente desde hace 4 meses.',say:'Al comenzar di: “Me duele la espalda hace meses. Trato de moverme poco porque siento que me estoy desgastando los discos”. Dolor habitual 4/10.',hidden:['No tienes fiebre.','No has bajado de peso sin explicación.','No hubo un trauma importante.','No presentas debilidad progresiva.','Duermes mal.','Evitas cargar a tu hijo porque te da miedo empeorar.'],newlabel:'Revelar dato nuevo cuando lo indique el docente',newdata:'Di: “Con el ejercicio subió a 6/10, pero en 30 minutos volvió a 4/10. ¿Me hice daño?”'},
  'k8r2d5':{station:'Estación 1 · Dolor lumbar',role:'KINESIÓLOGO/A',name:'Andrea, 43 años',intro:'Andrea consulta por dolor lumbar persistente de 4 meses. Trabaja como conductora. Su meta es caminar 30 minutos y volver a cargar a su hijo.',tasks:['Realiza un screening breve de seguridad.','Explora factores que puedan influir en el cuadro.','Explica el problema en lenguaje simple, sin catastrofizar.','Enseña un ejercicio inicial.','Acuerda cómo controlar la respuesta durante las próximas 24 horas.'],note:'No conoces toda la información. Pregunta antes de decidir.'},
  'f3n9q6':{station:'Estación 2 · MSK periférico',role:'PACIENTE',name:'Parte 1 · Felipe, 38 años',intro:'Trabajas instalando luminarias y llevas 7 semanas con dolor lateral de hombro.',say:'Al comenzar di: “Puedo levantar el brazo, pero después de varias tareas arriba empieza a doler”.',hidden:['Dolor 3/10 en reposo.','Tras una jornada exigente puede llegar a 6/10.','No hubo trauma agudo.','No has perdido completamente el movimiento.','Si te indican reposo total pregunta: “¿Cómo sigo trabajando?”'],newlabel:'Minuto 15 · cambiar a Paula',newdata:'Ahora eres PAULA, 31 años. Di: “Subí mi trote de 10 a 25 km por semana y ahora me duele delante de la rodilla al bajar escaleras”. Responde solo lo que te pregunten.'},
  'h5v1s8':{station:'Estación 2 · MSK periférico',role:'KINESIÓLOGO/A',name:'Parte 1 · Felipe, 38 años',intro:'Felipe instala luminarias. Presenta dolor lateral de hombro hace 7 semanas, mayor después de trabajar sobre la cabeza. Su meta es tolerar media jornada.',tasks:['Pregunta lo necesario para decidir.','Modifica una tarea sobre la cabeza sin eliminarla por completo.','Demuestra una progresión de 2 niveles.','Define cómo controlarás la respuesta a la carga.'],newlabel:'Minuto 15 · abrir segunda parte',newdata:'Caso breve de rodilla: Paula, 31 años, aumentó su trote de 10 a 25 km por semana y presenta dolor anterior de rodilla al bajar escaleras. Ajusta tu razonamiento a esta nueva demanda.'},
  'p6c4x1':{station:'Estación 3 · Traumatología y ortopedia',role:'PACIENTE',name:'Parte 1 · Daniela, 26 años',intro:'Estás en la semana 4 posterior a reconstrucción de LCA.',say:'Al comenzar di: “Me da miedo soltar la muleta demasiado pronto”.',hidden:['Tienes edema leve.','La extensión está casi completa.','Flexión aproximada de 105°.','Usas una muleta fuera de casa.','En casa haces trayectos cortos sin ella.'],newlabel:'Minuto 15 · cambiar de paciente',newdata:'Ahora eres un HOMBRE de 58 años, semana 6 después de reparación de manguito rotador. Di: “Ya casi no me duele. Quiero fortalecer fuerte desde hoy”. Si te preguntan por el protocolo responde: “No traje el informe”.'},
  't2b7e9':{station:'Estación 3 · Traumatología y ortopedia',role:'KINESIÓLOGO/A',name:'Parte 1 · Daniela, 26 años',intro:'Daniela está en semana 4 posterior a reconstrucción de LCA. Tiene permitida carga según tolerancia y progresión de movilidad. Su meta es volver a estudiar y caminar 15 minutos con confianza.',tasks:['Identifica la prioridad de esta fase.','Revisa precauciones antes de progresar.','Demuestra una carga razonable para hoy.','Explica qué observarías para retirar una ayuda técnica.'],newlabel:'Minuto 15 · abrir segunda parte',newdata:'Segundo paciente: hombre de 58 años, semana 6 posterior a reparación de manguito rotador. Quiere “fortalecer fuerte” porque se siente mejor. Decide qué información necesitas antes de progresar y cómo equilibrar protección, movilidad y expectativas.'},
  'm9g3u4':{station:'Estación 4 · Integración MSK',role:'PACIENTE',name:'Parte 1 · Mauricio, 47 años',intro:'Tienes dolor de hombro desde hace 3 meses y dificultad para trabajar con herramientas por sobre el hombro.',say:'Al comenzar di: “Al final del día me cuesta usar herramientas arriba del hombro”.',hidden:['Puedes elevar el brazo casi completo.','Tienes dolor entre 80° y 130°.','No hubo trauma agudo.','No presentas signos sistémicos.','Si te preguntan por tu prioridad: quieres trabajar 6 horas sin cambiar todas tus tareas.'],newlabel:'Minuto 15 · cambiar a Sofía',newdata:'Ahora eres SOFÍA, 35 años. Estás 8 semanas después de una fractura estable de tobillo ya consolidada según control médico. Di: “Camino rígida porque todavía siento que si cargo mucho se puede volver a romper”. Tu principal problema es la rigidez y el miedo.'},
  'w4j8l2':{station:'Estación 4 · Integración MSK',role:'KINESIÓLOGO/A',name:'Parte 1 · Mauricio, 47 años',intro:'Mauricio, 47 años, presenta dolor de hombro desde hace 3 meses, arco doloroso entre 80° y 130° y rotación externa resistida dolorosa. Su meta es trabajar 6 horas con menos modificaciones.',tasks:['Formula un diagnóstico kinésico funcional.','Plantea un objetivo SMART-CIF.','Define una prioridad de intervención.','Entrega un mensaje educativo breve.','Selecciona 2 indicadores de reevaluación.'],newlabel:'Minuto 15 · abrir caso Sofía',newdata:'Sofía, 35 años, 8 semanas posterior a fractura estable de tobillo, consolidada según control médico. Camina con rigidez y miedo. Replantea diagnóstico funcional, objetivo y plan inicial.'}
};
const qs=new URLSearchParams(location.search);const code=qs.get('r');const c=cards[code];const app=document.getElementById('app');
if(!c){app.innerHTML='<div class="bad"><div class="eyebrow">KIN2002</div><h1>Tarjeta no encontrada</h1><p>Escanea nuevamente el QR asignado por el docente.</p></div>'}
else{
 const hidden=c.hidden?`<div class="section"><h2>Solo si te preguntan</h2><ul>${c.hidden.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
 const tasks=c.tasks?`<div class="section"><h2>Tu tarea clínica</h2><ul>${c.tasks.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
 const say=c.say?`<div class="section"><h2>Cómo comienzas</h2><div class="box"><p>${c.say}</p></div></div>`:'';
 const note=c.note?`<div class="section"><div class="box"><p>${c.note}</p></div></div>`:'';
 const reveal=c.newdata?`<div class="section"><button id="btn">${c.newlabel||'Revelar segunda parte'}</button><div class="reveal" id="new"><strong>Segunda parte</strong><p style="margin-top:6px">${c.newdata}</p></div></div>`:'';
 app.innerHTML=`<div class="head"><div class="eyebrow">KIN2002 · Tarjeta de rol</div><h1>${c.station}</h1><div class="role">ROL: ${c.role}</div><div class="sub">${c.name}</div></div><div class="body"><div class="section"><h2>Contexto</h2><p>${c.intro}</p></div>${say}${hidden}${tasks}${note}${reveal}<div class="foot">Lee solo tu tarjeta. No muestres la pantalla al otro rol. No entregues información que no corresponda todavía.</div></div>`;
 const btn=document.getElementById('btn');if(btn){btn.onclick=()=>{document.getElementById('new').style.display='block';btn.style.display='none'}}
}
</script>
</body>
</html>
