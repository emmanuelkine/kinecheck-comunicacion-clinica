<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>KIN2002 · Tarjeta de rol</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d7dde7;--bg:#f4f6f8;--card:#fff;--accent:#1b5e7a;--soft:#eaf3f7;--warn:#fff6df}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{min-height:100vh;padding:18px;display:flex;align-items:flex-start;justify-content:center}
    .card{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.08);overflow:hidden}
    .head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
    .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
    h1{font-size:24px;line-height:1.15;margin:6px 0 0}.sub{margin-top:8px;color:var(--muted);font-size:14px}
    .body{padding:20px 22px 24px}.section{margin:0 0 18px}.section h2{font-size:15px;margin:0 0 8px;color:var(--accent)}
    p{margin:0 0 10px;line-height:1.5}.box{background:var(--soft);padding:14px 15px;border-radius:10px;border:1px solid #d7e7ee}
    ul{padding-left:20px;margin:8px 0 0}li{margin:7px 0;line-height:1.45}
    .reveal{display:none;margin-top:12px;background:var(--warn);border:1px solid #ecd999;padding:14px;border-radius:10px}
    button{width:100%;border:0;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
    .foot{font-size:12px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
    .bad{padding:28px;text-align:center}.bad h1{font-size:22px}.role{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#eef2f6;color:#344054;font-size:12px;font-weight:700}
  </style>
</head>
<body>
<div class="wrap"><main class="card" id="app"></main></div>
<script>
const cards={
  'a4p7m2':{station:'Estación 1 · Dolor lumbar',role:'PACIENTE',name:'Andrea, 43 años',intro:'Trabajas como conductora. Desde hace 4 meses tienes dolor lumbar y has reducido mucho tu actividad física porque temes “desgastar los discos”.',say:'Al comenzar, di: “Me duele hace meses y trato de moverme lo menos posible porque siento que me estoy desgastando la espalda.”',hidden:['Dolor habitual 4/10.','Te cuesta levantar objetos desde el suelo y evitas cargar a tu hijo de 5 años.','Duermes irregularmente y estás preocupada por recaer.','No tienes fiebre, pérdida de peso, trauma importante ni síntomas neurológicos progresivos.','Si te preguntan por síntomas de cauda equina: no presentas alteraciones esfinterianas ni anestesia en silla de montar.'],newdata:'Después del primer ejercicio, di: “El dolor me subió de 4 a 6, pero volvió a 4 en unos 30 minutos. ¿Eso significa que me hice más daño?”'},
  'k8r2d5':{station:'Estación 1 · Dolor lumbar',role:'KINESIÓLOGO/A',name:'Consulta de Andrea, 43 años',intro:'Andrea consulta por dolor lumbar persistente de 4 meses. Trabaja como conductora y quiere volver a caminar 30 minutos y cargar a su hijo con confianza.',tasks:['Realiza un screening breve de seguridad.','Explora al menos un factor psicosocial relevante.','Explícale su problema en lenguaje comprensible, sin catastrofizar.','Selecciona y demuestra un ejercicio inicial.','Indica una dosis y qué respuesta observarás después de la sesión.']},
  'f3n9q6':{station:'Estación 2 · Hombro',role:'PACIENTE',name:'Felipe, 38 años',intro:'Trabajas instalando luminarias y llevas 7 semanas con dolor lateral de hombro.',say:'Al comenzar, di: “Puedo levantar el brazo, pero después de un rato trabajando arriba empieza a doler bastante.”',hidden:['No hubo trauma agudo.','Dolor 3/10 en reposo y hasta 6/10 tras jornadas exigentes.','No has perdido completamente el movimiento.','Tu meta es completar media jornada sin un aumento importante de síntomas.','Si te preguntan por signos sistémicos o neurológicos: no refieres ninguno.'],newdata:'Cuando el docente indique, di: “Necesito seguir trabajando. No puedo simplemente dejar de usar el brazo. ¿Qué hago entonces?”'},
  'h5v1s8':{station:'Estación 2 · Hombro',role:'KINESIÓLOGO/A',name:'Consulta de Felipe, 38 años',intro:'Felipe trabaja instalando luminarias y presenta dolor lateral de hombro de 7 semanas, especialmente con tareas por sobre la cabeza.',tasks:['Pregunta por irritabilidad y exposición a carga.','Modifica una tarea sobre la cabeza sin eliminar completamente el objetivo funcional.','Demuestra una progresión de ejercicio en 2 niveles.','Define cómo dosificarás la carga.','Explica qué respuesta a las 24–48 h considerarás para mantener, progresar o reducir.']},
  'p6c4x1':{station:'Estación 3 · Rodilla post LCA',role:'PACIENTE',name:'Daniela, 26 años',intro:'Estás en la semana 4 posterior a reconstrucción de LCA. La indicación médica permite carga según tolerancia y progresión de movilidad.',say:'Al comenzar, di: “Todavía uso la muleta porque me da miedo que la rodilla falle.”',hidden:['Edema leve.','Extensión casi completa y flexión aproximada de 105°.','Usas una muleta fuera de casa.','Tu meta es volver a estudiar presencialmente y caminar 15 minutos sin inseguridad.','No refieres dolor punzante ni episodios claros de inestabilidad.'],newdata:'Cuando el docente indique, di: “En la casa camino sin muleta y no me duele. ¿Entonces ya puedo dejarla?”'},
  't2b7e9':{station:'Estación 3 · Rodilla post LCA',role:'KINESIÓLOGO/A',name:'Consulta de Daniela, 26 años',intro:'Daniela está en semana 4 posterior a reconstrucción de LCA, con carga según tolerancia y progresión de movilidad permitidas.',tasks:['Define el objetivo prioritario de esta fase.','Revisa precauciones antes de progresar.','Demuestra una carga razonable para hoy.','Explica qué criterios usarías para retirar la ayuda técnica.','Indica qué hallazgo te haría detener o retroceder.']},
  'm9g3u4':{station:'Estación 4 · Integración clínica',role:'PACIENTE',name:'Mauricio, 47 años',intro:'Tienes dolor de hombro desde hace 3 meses y dificultad para trabajar con herramientas por sobre el hombro.',say:'Al comenzar, di: “Puedo mover el brazo casi completo, pero al final del día trabajando arriba me duele bastante.”',hidden:['No hubo trauma agudo.','No presentas signos sistémicos.','El dolor aparece especialmente entre 80° y 130° de elevación.','La rotación externa es dolorosa.','Tu meta es volver a trabajar 6 horas sin tener que modificar todas tus tareas.'],newdata:'Cuando el docente indique, di: “Me preocupa que esto sea algo roto. ¿Necesito una resonancia antes de seguir cargando?”'},
  'w4j8l2':{station:'Estación 4 · Integración clínica',role:'KINESIÓLOGO/A',name:'Consulta de Mauricio, 47 años',intro:'Mauricio presenta dolor de hombro de 3 meses, con limitación funcional en tareas laborales sobre la cabeza.',tasks:['Realiza preguntas breves orientadas al problema funcional y seguridad.','Formula verbalmente un diagnóstico kinésico funcional.','Plantea un objetivo SMART-CIF.','Demuestra una prioridad de intervención y su dosis inicial.','Entrega un mensaje educativo breve y define 2 indicadores de reevaluación.']}
};
const qs=new URLSearchParams(location.search);const code=qs.get('r');const c=cards[code];const app=document.getElementById('app');
if(!c){app.innerHTML='<div class="bad"><div class="eyebrow">KIN2002</div><h1>Tarjeta no encontrada</h1><p>Escanea nuevamente el QR asignado por el docente.</p></div>'}
else{
 const hidden=c.hidden?`<div class="section"><h2>Información que solo entregas si te la preguntan</h2><ul>${c.hidden.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
 const tasks=c.tasks?`<div class="section"><h2>Durante la consulta</h2><ul>${c.tasks.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
 const say=c.say?`<div class="section"><h2>Cómo comienzas</h2><div class="box"><p>${c.say}</p></div></div>`:'';
 const reveal=c.newdata?`<div class="section"><button id="btn">Revelar dato nuevo cuando lo indique el docente</button><div class="reveal" id="new"><strong>Dato nuevo:</strong><p style="margin-top:6px">${c.newdata}</p></div></div>`:'';
 app.innerHTML=`<div class="head"><div class="eyebrow">KIN2002 · Intervención Kinésica de Moderada Complejidad</div><h1>${c.station}</h1><div class="role">ROL: ${c.role}</div><div class="sub">${c.name}</div></div><div class="body"><div class="section"><h2>Contexto</h2><p>${c.intro}</p></div>${say}${hidden}${tasks}${reveal}<div class="foot">Lee solo tu tarjeta. No muestres la pantalla al otro rol. La información se entrega durante el juego de rol, no toda al inicio.</div></div>`;
 const btn=document.getElementById('btn'); if(btn){btn.onclick=()=>{document.getElementById('new').style.display='block';btn.style.display='none'}}
}
</script>
</body>
</html>
