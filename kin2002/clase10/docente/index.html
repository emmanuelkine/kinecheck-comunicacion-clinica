<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Registro docente KIN2002 · Clase 10</title><style>body{font:16px/1.5 system-ui;background:#f1f6f4;color:#102e34;max-width:1000px;margin:30px auto;padding:16px}section{background:white;padding:25px;border-radius:15px;margin:20px 0}button,input{font:inherit;padding:11px;border-radius:8px;border:1px solid #8faeae}input{width:min(100%,500px)}button{background:#145e63;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:.89rem}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}h1{font-family:Georgia,serif}</style></head><body><h1>KIN2002 · Registro docente</h1><p>Clase 10 · Actividad de integración, sin calificación. Cada registro corresponde a un estudiante, incluso cuando entrega en dupla.</p><section><label for="token">Clave docente de consulta</label><p><input id="token" type="password" autocomplete="off" placeholder="Clave de acceso"> <button id="load">Consultar entregas</button></p><p id="status" role="status"></p></section><section><h2>Participación registrada</h2><p id="stats">Aún no consultada.</p><button id="export" disabled>Exportar CSV de estudiantes y respuestas</button><div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Estudiante</th><th>Identificador</th><th>Dupla</th><th>Recibo</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>
let records=[];const status=document.getElementById("status");document.getElementById("load").onclick=async()=>{records=[];status.textContent="Consultando…";try{const token=document.getElementById("token").value;if(!token)throw Error("Ingresa la clave docente");const res=await fetch("/api/kin2002-clase10",{headers:{"authorization":"Bearer "+token},cache:"no-store"});const data=await res.json();if(!res.ok)throw Error(data.error||"No se pudo consultar");records=data.records||[];document.getElementById("stats").textContent=records.length+" estudiantes registrados en "+data.groups+" entregas de equipo. Meta de capacidad: 70 estudiantes.";const rows=document.getElementById("rows");rows.replaceChildren();for(const r of records){const tr=document.createElement("tr");[r.timestamp,r.name,r.identifier,(r.partners||[]).join(" / "),r.groupId].forEach(v=>{const td=document.createElement("td");td.textContent=v||"";tr.appendChild(td)});rows.appendChild(tr);}document.getElementById("export").disabled=!records.length;status.textContent="Consulta completada. La lista puede tardar unos segundos en reflejar nuevas entregas.";}catch(e){status.textContent=e.message;}};
document.getElementById("export").onclick=()=>{const cols=["timestamp","groupId","name","identifier","partners","individualSynthesis","hypotheses","plan","roleNotes","unlocked"];const esc=x=>'"'+String(x==null?"":Array.isArray(x)?x.join(" | "):x).replaceAll('"','""')+'"';const csv="\ufeff"+cols.map(esc).join(",")+"\r\n"+records.map(r=>cols.map(k=>esc(r[k])).join(",")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const link=document.createElement("a");link.href=url;link.download="KIN2002_Clase10_Entregas_Individuales.csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
