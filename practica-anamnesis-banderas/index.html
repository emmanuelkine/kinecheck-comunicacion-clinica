<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Anamnesis y banderas clínicas</title><style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937}.wrap{max-width:780px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d9dee6;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.06);overflow:hidden}.head{padding:20px 22px 16px;border-bottom:1px solid #e5e7eb}.ey{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#667085;font-weight:700}h1{font-size:24px;margin:6px 0 4px}.sub{font-size:14px;color:#667085}.body{padding:20px 22px 24px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.section{margin:0 0 18px}.section h2{font-size:15px;margin:0 0 8px;color:#1f5c78}p{line-height:1.48;margin:0 0 10px}ul{padding-left:20px;margin:8px 0}li{margin:7px 0;line-height:1.44}.box{background:#edf5f8;border:1px solid #d5e8ef;border-radius:10px;padding:14px}.warn{background:#fff5df;border-color:#ecd99a}.tag{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:700}button{width:100%;border:0;border-radius:10px;padding:14px 12px;background:#243447;color:#fff;font-size:14px;font-weight:700;cursor:pointer}button.alt{background:#eef2f6;color:#243447;border:1px solid #cfd7e3}button.obs{background:#1f5c78}.new{display:none;margin-top:10px}.foot{margin-top:18px;padding-top:12px;border-top:1px solid #e5e7eb;color:#667085;font-size:12px;line-height:1.4}@media(max-width:620px){.roles{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><main id="app" class="card"></main></div><script>
const cases={"1":{"title":"Caso 1 · Dolor lumbar","person":"Marco, 46 años · operario de bodega","intro":"Dolor lumbar de 5 semanas después de mover cajas. Desde entonces evita agacharse y teme haber lesionado un disco.","kine":["Inicia con una pregunta abierta.","Reconstruye inicio, mecanismo, evolución y comportamiento de 24 horas.","Pesquisa síntomas neurológicos y banderas clínicas relevantes.","Pregunta por función, sueño, trabajo, antecedentes y medicamentos.","Cuando aparezca nueva información, explica si cambia tu conducta y por qué."],"patient":{"start":"“Me duele la espalda baja desde que moví unas cajas. No sé si me habré dañado un disco.”","hidden":["Dolor 3–6/10.","Empeora al estar sentado y al levantar objetos.","No fiebre, pérdida de peso ni antecedente oncológico conocido.","Al inicio no refieres debilidad progresiva en las piernas.","Duermes peor y estás evitando actividad por miedo."],"newinfo":"Desde anoche notas adormecimiento en la zona perineal y te cuesta iniciar la micción. No lo habías mencionado por vergüenza."},"observer":["¿Comenzó con una pregunta abierta?","¿Exploró evolución, irritabilidad y comportamiento de 24 h?","¿Preguntó por déficit neurológico, cambios esfinterianos y sensibilidad perineal?","¿Exploró fiebre, pérdida de peso, cáncer y trauma?","¿Identificó miedo/evitación sin confundirlo con una bandera roja?","Con la nueva información: ¿priorizó seguridad y evaluación médica urgente?"],"observerNew":"Nueva información crítica: alteración sensitiva perineal + dificultad urinaria de inicio reciente."},"2":{"title":"Caso 2 · Dolor cervical","person":"Teresa, 58 años · secretaria","intro":"Dolor cervical y rigidez de 2 meses. Lo atribuye al trabajo frente al computador. Últimamente le cuesta realizar algunas tareas finas con las manos.","kine":["Caracteriza dolor y evolución.","Explora síntomas neurológicos de miembros superiores e inferiores.","Pregunta por destreza manual, equilibrio y marcha.","Pesquisa trauma y síntomas sistémicos.","Integra la nueva información y define si cambia la prioridad."],"patient":{"start":"“Pensé que era tensión del cuello por trabajar sentada, pero ya lleva varias semanas.”","hidden":["Dolor 4/10.","No fiebre ni pérdida de peso.","No trauma reciente.","Si preguntan específicamente: a veces se te caen objetos pequeños de las manos.","Abotonarte una blusa y escribir mensajes se sienten menos precisos."],"newinfo":"En la última semana notas las piernas ‘torpes’ al caminar rápido y ayer casi perdiste el equilibrio bajando una escalera."},"observer":["¿Preguntó por parestesias y debilidad?","¿Exploró destreza manual?","¿Preguntó por marcha, equilibrio y caídas?","¿Exploró trauma, fiebre y pérdida de peso?","¿Evitó asumir que era solo tensión muscular?","Con la nueva información: ¿reconoció progresión neurológica como prioritaria?"],"observerNew":"Nueva información crítica: torpeza de marcha y desequilibrio añadidos a pérdida de destreza manual."},"3":{"title":"Caso 3 · Dolor de hombro izquierdo","person":"Luis, 61 años · comerciante","intro":"Dolor de hombro izquierdo de 10 días. No recuerda golpe. Cree que comenzó después de cargar bolsas y pide ejercicios.","kine":["No asumas origen musculoesquelético solo por la localización.","Explora relación con movimiento local y con esfuerzo general.","Pregunta por síntomas acompañantes.","Indaga antecedentes y factores cardiovasculares.","Con la nueva información, explica la conducta más segura."],"patient":{"start":"“Me duele el hombro izquierdo y pensé que era por cargar cosas. Quiero saber qué ejercicio hacer.”","hidden":["El hombro se mueve casi completo.","No hubo trauma claro.","El dolor no siempre depende del movimiento del hombro.","Tienes hipertensión tratada.","Si preguntan: a veces aparece caminando rápido."],"newinfo":"Ayer, al subir dos pisos por escalera, apareció dolor en hombro y parte alta del pecho con náuseas leves; cedió al sentarte."},"observer":["¿Preguntó por relación del dolor con movimiento del hombro?","¿Exploró relación con esfuerzo general y reposo?","¿Preguntó por dolor torácico, disnea, náuseas, sudoración o mareos?","¿Recogió antecedentes cardiovasculares?","¿Evitó cierre precoz como tendinopatía?","Con la nueva información: ¿priorizó evaluación médica?"],"observerNew":"Nueva información crítica: dolor de hombro/pecho inducido por esfuerzo, asociado a náuseas y aliviado con reposo."},"4":{"title":"Caso 4 · Rodilla caliente y dolorosa","person":"Patricia, 67 años · jubilada","intro":"Dolor intenso de rodilla derecha de 3 días. No recuerda caída importante. La rodilla está rígida y le cuesta apoyar.","kine":["Reconstruye inicio y evolución.","Pregunta por fiebre, escalofríos y síntomas sistémicos.","Indaga procedimientos recientes, heridas y antecedentes médicos.","Explora capacidad de carga sin provocar innecesariamente.","Integra la nueva información y decide si corresponde continuar la evaluación MSK."],"patient":{"start":"“La rodilla empezó a doler hace unos días y cada vez me cuesta más doblarla y caminar.”","hidden":["Dolor 7/10.","No hubo mecanismo traumático claro.","La rodilla está más hinchada que la otra.","Tienes diabetes tipo 2.","Si preguntan por procedimientos: recibiste una infiltración hace dos semanas."],"newinfo":"Desde anoche tienes fiebre de 38,4 °C y escalofríos. La rodilla está muy caliente y moverla pasivamente duele mucho."},"observer":["¿Preguntó por fiebre y escalofríos?","¿Indagó infiltraciones/cirugía reciente?","¿Consideró diabetes u otros factores de susceptibilidad?","¿Preguntó por velocidad de instalación y aumento de volumen?","¿Evitó pruebas provocativas innecesarias?","Con la nueva información: ¿reconoció necesidad de evaluación médica urgente?"],"observerNew":"Nueva información crítica: fiebre + articulación caliente y muy dolorosa tras procedimiento reciente."},"5":{"title":"Caso 5 · Dolor de pantorrilla","person":"Camila, 36 años · ejecutiva","intro":"Dolor y tensión en pantorrilla izquierda desde ayer. Regresó hace tres días de un viaje largo y cree que se contracturó con las maletas.","kine":["Explora mecanismo e inicio.","Pregunta por viajes prolongados, inmovilización, cirugía y antecedentes trombóticos.","Indaga medicación hormonal.","Pregunta por edema unilateral y síntomas respiratorios.","Evita maniobras provocativas innecesarias si aumenta la sospecha vascular."],"patient":{"start":"“Siento la pantorrilla apretada y dolorida. Pensé que era una contractura por el viaje.”","hidden":["No recuerdas lesión muscular concreta.","Viajaste unas 10 horas sentada en bus.","Usas anticonceptivos hormonales.","La pierna izquierda se siente algo más hinchada.","No tienes fiebre."],"newinfo":"Hace una hora tuviste falta de aire al caminar y una molestia punzante en el pecho al respirar profundo."},"observer":["¿Diferenció lesión muscular de una presentación sin mecanismo claro?","¿Preguntó por viaje/inmovilización?","¿Preguntó por anticonceptivos, cirugía y antecedentes de trombosis?","¿Exploró edema unilateral?","¿Preguntó por disnea y dolor torácico?","Con la nueva información: ¿detuvo la evaluación MSK y priorizó atención médica?"],"observerNew":"Nueva información crítica: dolor unilateral de pantorrilla + factores trombóticos + síntomas respiratorios."},"6":{"title":"Caso 6 · Dolor lumbar persistente sin alarma","person":"Daniela, 39 años · docente","intro":"Dolor lumbar de 4 meses, fluctuante, sin trauma importante. Ha reducido ejercicio porque piensa que el dolor significa daño.","kine":["Realiza anamnesis completa y pesquisa de banderas sin convertirla en interrogatorio.","Explora creencias, miedo, sueño y participación.","Pregunta por síntomas neurológicos y sistémicos pertinentes.","Identifica factores modificables.","Integra la nueva información sin sobrerreaccionar."],"patient":{"start":"“Llevo meses con dolor lumbar y me preocupa que cada vez que me duele esté dañando más la espalda.”","hidden":["Dolor 2–5/10, variable.","No fiebre, pérdida de peso, trauma importante ni antecedente oncológico.","No cambios esfinterianos ni anestesia perineal.","No debilidad progresiva.","Evitas gimnasio y levantar a tu hija por miedo."],"newinfo":"Ayer caminaste 40 minutos; el dolor subió de 3/10 a 5/10 y volvió a 3/10 esa misma tarde. Hoy amaneciste igual que habitualmente."},"observer":["¿Realizó pesquisa de banderas rojas pertinente?","¿Exploró creencias y miedo al movimiento?","¿Preguntó por sueño, trabajo y metas?","¿Evitó lenguaje alarmista?","¿Diferenció una respuesta transitoria a carga de una señal de alarma?","Con la nueva información: ¿mantuvo una conducta razonada sin derivación innecesaria?"],"observerNew":"Nueva información de contraste: aumento transitorio y autorresuelto del dolor sin síntomas nuevos. No constituye por sí solo una bandera roja."}};
const id=new URLSearchParams(location.search).get("c"), c=cases[id], app=document.getElementById("app");
function header(role){return '<div class="head"><div class="ey">Práctica · Anamnesis y banderas clínicas</div><h1>'+c.title+'</h1><div class="tag">ROL: '+role+'</div><div class="sub">'+c.person+'</div></div>'}
function reveal(text){return '<div class="section"><button id="reveal">Abrir tarjeta de NUEVA INFORMACIÓN cuando lo indique el docente</button><div id="new" class="new box warn"><strong>Nueva información</strong><p style="margin-top:8px">'+text+'</p></div></div>'}
function bind(){const b=document.getElementById("reveal");if(b)b.onclick=()=>{document.getElementById("new").style.display="block";b.style.display="none"}}
function roleK(){app.innerHTML=header("KINESIÓLOGO/A")+'<div class="body"><div class="section"><h2>Información inicial</h2><p>'+c.intro+'</p></div><div class="section"><h2>Tu tarea</h2><ul>'+c.kine.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>'+reveal("Pide al paciente que lea su tarjeta de nueva información. Tú no debes verla antes.")+'<div class="foot">Tu objetivo es obtener la información mediante entrevista, no adivinar el diagnóstico.</div></div>';bind()}
function roleP(){app.innerHTML=header("PACIENTE")+'<div class="body"><div class="section"><h2>Cómo comienzas</h2><div class="box">'+c.patient.start+'</div></div><div class="section"><h2>Información que entregas solo si te la preguntan</h2><ul>'+c.patient.hidden.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>'+reveal(c.patient.newinfo)+'<div class="foot">No muestres tu pantalla. Responde solo lo que corresponda a las preguntas del kinesiólogo/a.</div></div>';bind()}
function roleO(){app.innerHTML=header("OBSERVADOR/A")+'<div class="body"><div class="section"><h2>Qué debes observar</h2><ul>'+c.observer.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>'+reveal(c.observerNew)+'<div class="section"><h2>Al terminar</h2><p>Entrega una retroalimentación breve: <strong>una fortaleza, una omisión y una pregunta que habría mejorado la pesquisa.</strong></p></div><div class="foot">No intervengas durante la entrevista salvo que el docente lo indique.</div></div>';bind()}
if(!c){app.innerHTML='<div class="head"><div class="ey">Práctica</div><h1>Caso no encontrado</h1></div><div class="body"><p>Escanea nuevamente el QR del docente.</p></div>'}
else{app.innerHTML='<div class="head"><div class="ey">Práctica · Anamnesis y banderas clínicas</div><h1>'+c.title+'</h1><div class="sub">'+c.person+'</div></div><div class="body"><div class="section"><p><strong>Los tres integrantes escanean este mismo QR.</strong> Cada uno selecciona únicamente el rol que realizará.</p></div><div class="roles"><button id="k">Soy kinesiólogo/a</button><button class="alt" id="p">Soy paciente</button><button class="obs" id="o">Soy observador/a</button></div><div class="foot">No intercambien pantallas. La nueva información se abre solo cuando lo indique el docente.</div></div>';document.getElementById("k").onclick=roleK;document.getElementById("p").onclick=roleP;document.getElementById("o").onclick=roleO}
</script></body></html>
