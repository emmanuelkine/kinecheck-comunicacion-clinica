<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Banderas clínicas: decidir si continuar, adaptar o derivar</title><desc id="desc">Infografía educativa sobre banderas rojas, naranjas y amarillas en la evaluación musculoesquelética.</desc><rect width="1080" height="1350" fill="#fff"/><path d="M785 0H1080V155Q910 130 785 0Z" fill="#e6f6f9"/><path d="M700 1350Q925 1150 1080 1190V1350Z" fill="#e6f6f9"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="80" font-size="54" font-weight="800" fill="#102a43">Banderas clínicas: Decidir si</text><text x="48" y="149" font-size="54" font-weight="800" fill="#102a43">continuar, adaptar o derivar</text><text x="48" y="223" font-size="27" fill="#243b53">Las banderas no son etiquetas; son señales para gestionar riesgo</text><rect x="48" y="250" width="84" height="8" rx="4" fill="#26abb0"/><rect x="48" y="285" width="312" height="521" rx="26" fill="#ffe5e9" stroke="#f55970" stroke-width="2"/><circle cx="204" cy="361" r="66" fill="#fff" stroke="#e7edf3" stroke-width="2"/><path d="M187 323 v77" stroke="#17334d" stroke-width="8" stroke-linecap="round"/><path d="M189 328 Q213 321 224 332 Q243 337 250 326 v45 Q226 382 211 371 Q201 367 189 374Z" fill="#ad2436"/><text x="204" y="482" text-anchor="middle" font-weight="800" font-size="42" fill="#ad2436">Rojas</text><text x="204" text-anchor="middle" y="540" font-size="26" font-weight="500" fill="#17334d">Más de una aumenta</text><text x="204" text-anchor="middle" y="579" font-size="26" font-weight="500" fill="#17334d">la probabilidad de</text><text x="204" text-anchor="middle" y="618" font-size="26" font-weight="500" fill="#17334d">patología grave</text><text x="204" text-anchor="middle" y="657" font-size="26" font-weight="500" fill="#17334d">potencial</text><line x1="84" y1="671" x2="324" y2="671" stroke="#f55970" stroke-width="2"/><rect x="68" y="694" width="272" height="92" rx="24" fill="#fff" fill-opacity=".8"/><text x="204" text-anchor="middle" y="730" font-size="25" font-weight="700" fill="#17334d">→ derivación /</text><text x="204" text-anchor="middle" y="764" font-size="25" font-weight="700" fill="#17334d">urgencia</text><rect x="384" y="285" width="312" height="521" rx="26" fill="#fff0e1" stroke="#ffa357" stroke-width="2"/><circle cx="540" cy="361" r="66" fill="#fff" stroke="#e7edf3" stroke-width="2"/><path d="M523 323 v77" stroke="#17334d" stroke-width="8" stroke-linecap="round"/><path d="M525 328 Q549 321 560 332 Q579 337 586 326 v45 Q562 382 547 371 Q537 367 525 374Z" fill="#bd5419"/><text x="540" y="482" text-anchor="middle" font-weight="800" font-size="42" fill="#bd5419">Naranjas</text><text x="540" text-anchor="middle" y="540" font-size="26" font-weight="500" fill="#17334d">Salud mental</text><text x="540" text-anchor="middle" y="579" font-size="26" font-weight="500" fill="#17334d">relevante</text><line x1="420" y1="671" x2="660" y2="671" stroke="#ffa357" stroke-width="2"/><rect x="404" y="694" width="272" height="92" rx="24" fill="#fff" fill-opacity=".8"/><text x="540" text-anchor="middle" y="730" font-size="25" font-weight="700" fill="#17334d">→ coordinación /</text><text x="540" text-anchor="middle" y="764" font-size="25" font-weight="700" fill="#17334d">derivación</text><rect x="720" y="285" width="312" height="521" rx="26" fill="#fff9d8" stroke="#f3ce43" stroke-width="2"/><circle cx="876" cy="361" r="66" fill="#fff" stroke="#e7edf3" stroke-width="2"/><path d="M859 323 v77" stroke="#17334d" stroke-width="8" stroke-linecap="round"/><path d="M861 328 Q885 321 896 332 Q915 337 922 326 v45 Q898 382 883 371 Q873 367 861 374Z" fill="#977000"/><text x="876" y="482" text-anchor="middle" font-weight="800" font-size="42" fill="#977000">Amarillas</text><text x="876" text-anchor="middle" y="540" font-size="26" font-weight="500" fill="#17334d">Riesgo psicosocial</text><text x="876" text-anchor="middle" y="579" font-size="26" font-weight="500" fill="#17334d">de persistencia</text><line x1="756" y1="671" x2="996" y2="671" stroke="#f3ce43" stroke-width="2"/><rect x="740" y="694" width="272" height="92" rx="24" fill="#fff" fill-opacity=".8"/><text x="876" text-anchor="middle" y="730" font-size="25" font-weight="700" fill="#17334d">→ educación +</text><text x="876" text-anchor="middle" y="764" font-size="25" font-weight="700" fill="#17334d">plan graduado</text><rect x="39" y="844" width="1002" height="438" rx="28" fill="#e8f7fb"/><circle cx="110" cy="908" r="38" fill="#146078"/><rect x="97" y="891" width="26" height="32" rx="4" fill="none" stroke="#fff" stroke-width="3"/><path d="M103 900h14m-14 7h14m-14 7h9" stroke="#fff" stroke-width="2"/><text x="174" y="925" font-size="40" font-weight="800" fill="#102a43">Ejemplo en el contexto</text><rect x="55" y="964" width="970" height="295" rx="22" fill="#fff"/><circle cx="125" cy="1020" r="30" fill="#fff2ba"/><text x="125" y="1030" text-anchor="middle" font-size="34">!</text><text x="182" y="1008" font-size="26" fill="#17334d">Miedo al movimiento y creencias de daño:</text><text x="182" y="1042" font-size="28" font-weight="800" fill="#17334d">Bandera amarilla.</text><line x1="80" x2="1000" y1="1073" y2="1073" stroke="#d7e7eb" stroke-width="2"/><circle cx="125" cy="1126" r="30" fill="#dbeeff"/><path d="m111 1125 10 10 18-22" fill="none" stroke="#2573aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="182" y="1112" font-size="26" font-weight="700" fill="#17334d">No trauma mayor ni signos sistémicos:</text><text x="182" y="1148" font-size="25" fill="#17334d">No descarta, pero reduce sospecha de riesgo grave.</text><line x1="80" x2="1000" y1="1176" y2="1176" stroke="#d7e7eb" stroke-width="2"/><circle cx="125" cy="1215" r="30" fill="#ddf5f3"/><circle cx="125" cy="1202" r="6" fill="#1b6f86"/><circle cx="111" cy="1226" r="6" fill="#1b6f86"/><circle cx="139" cy="1226" r="6" fill="#1b6f86"/><path d="m125 1202-14 24m14-24 14 24m-28 0h28" stroke="#1b6f86" stroke-width="3"/><text x="182" y="1224" font-size="26" fill="#17334d">La decisión exige patrones, no un dato aislado.</text><text x="48" y="1321" font-size="20" fill="#425569">Ladeira, 2018; Stearns et al., 2021; Greenhalgh &amp; Selfe, 2006.</text></g></svg>