<rect x="56" y="314" width="276" height="70" rx="19" fill="#102f37" stroke="#47afb7"/><text x="194" y="358" text-anchor="middle" fill="#c9f7f2">PHQ-9 · cribado</text>
<rect x="56" y="424" width="276" height="70" rx="19" fill="#102f37" stroke="#47afb7"/><text x="194" y="468" text-anchor="middle" fill="#c9f7f2">PEDro · criterios del ensayo</text>
<rect x="56" y="534" width="276" height="70" rx="19" fill="#102f37" stroke="#47afb7"/><text x="194" y="578" text-anchor="middle" fill="#c9f7f2">ODI / RMDQ · limitación</text>
