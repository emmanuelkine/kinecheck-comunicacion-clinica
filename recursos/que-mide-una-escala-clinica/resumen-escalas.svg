<text x="1000" y="161" text-anchor="middle" fill="#8be4e4" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2">INTERPRETA</text>
<g font-family="Arial,sans-serif" font-size="22" fill="#eff9f9"><text x="888" y="221">¿Qué constructo?</text><text x="888" y="283">¿Qué población?</text><text x="888" y="345">¿Qué incertidumbre?</text><text x="888" y="407">¿Qué otra evidencia?</text></g>
