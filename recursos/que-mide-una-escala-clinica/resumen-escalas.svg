<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Cómo interpretar una escala clínica</title>
<desc id="desc">Cinco ejemplos de instrumentos conectados con una persona y cuatro preguntas para interpretar sus resultados con contexto.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#123c44"/><stop offset="1" stop-color="#071d22"/></linearGradient><linearGradient id="acc" x2="1"><stop stop-color="#6de1dd"/><stop offset="1" stop-color="#42b8c4"/></linearGradient></defs>
