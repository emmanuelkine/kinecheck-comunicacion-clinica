<text x="971" y="557" text-anchor="middle" fill="#09262b" font-family="Arial,sans-serif" font-size="21" font-weight="800">Un puntaje orienta</text>
<text x="971" y="582" text-anchor="middle" fill="#09262b" font-family="Arial,sans-serif" font-size="18">no cuenta toda la historia</text>
<text x="60" y="55" fill="#eff9f9" font-family="Arial,sans-serif" font-size="26" font-weight="800">DEL INSTRUMENTO A LA DECISIÓN CLÍNICA</text>
