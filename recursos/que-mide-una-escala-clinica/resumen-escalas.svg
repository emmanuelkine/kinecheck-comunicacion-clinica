<circle cx="606" cy="306" r="166" fill="#0d2d34" stroke="#3d8992" stroke-width="2"/>
<circle cx="606" cy="245" r="44" fill="url(#acc)"/><path d="M520 390c8-68 48-101 86-101s78 33 86 101" fill="none" stroke="#6de1dd" stroke-width="24" stroke-linecap="round"/>
